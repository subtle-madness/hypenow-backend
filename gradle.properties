# CI 시간 단축 (2026-07-29 — CI 4분의 실체가 gradlew test 직렬 실행이라 도입)
# 모듈 3개(crawler·was·analytics)를 병렬 빌드·테스트 — Testcontainers는 랜덤 포트라 공존 안전
org.gradle.parallel=true
# 빌드 캐시 — 안 바뀐 모듈은 컴파일·테스트가 FROM-CACHE로 스킵된다(입력 해시 기반이라
# paths-filter식 경로 매핑 관리 불필요). CI에선 setup-gradle이 develop push에서 캐시를 쓰고
# PR이 읽는 기존 배선을 그대로 탄다 → 사실상 "변경된 모듈만 테스트"
org.gradle.caching=true
