spring:
  application:
    name: monitoring
  datasource:
    url: jdbc:postgresql://localhost:5433/monitoring
    username: monitoring
    password: monitoring
  task:
    scheduling:
      pool:
        # 기본 1이면 스윕의 재시도 라운드 대기(최대 간격×라운드 합)가 스케줄러 스레드를 붙잡아
        # 그 사이 알람 발송 틱이 통째로 밀린다 — 스윕과 발송을 분리하려면 최소 2가 필요하다.
        size: 2

server:
  port: 8083   # crawler 8080 · was 8081 · analytics 8082 다음

# 요청 ID 출력(RequestIdFilter → MDC requestId, 2026-08-23 요청 단위 로그 묶기) — Boot 기본
# 콘솔 패턴의 correlation 슬롯([스레드명] 뒤·로거명 앞)에 끼워 넣으므로 타임스탬프(1번 토큰)·
# 레벨(2번 토큰) 위치가 변하지 않는다. 운영 Alloy(deploy/alloy/config.alloy)가 이 위치로 level
# 라벨을 파싱하니(^\S+\s+(LEVEL)\s) logging.pattern.console을 직접 덮어쓰지 말 것 — 깨지면
# level 라벨이 사라져 {level="ERROR"} 대시보드·알람이 침묵한다. 요청 밖 로그(스케줄 잡·부팅)는
# 빈 대괄호([])로 찍힌다.
logging:
  pattern:
    correlation: "[%X{requestId:-}] "

# JVM 지표 노출(스펙 2026-08-22) — health·prometheus만. 운영은 compose env(MANAGEMENT_SERVER_PORT
# 9083)로 관리 포트를 분리해 내부망 전용(Caddy 라우팅 없음), 로컬·테스트는 메인 포트에 그대로 노출.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true   # 수신 uri별 p95(브랜드 운영 건강 '수신 처리 p95') — was와 같은 관용구
        external.call: true          # 외부 API 콜(Hiker·Gemini) p95 — 계층별 p95 뺄셈의 외부 구간(2026-08-23)
      maximum-expected-value:
        # 기본 상한 30s 포화 해제(08-25 실측: hiker tagged_feed가 정확히 30.00s로 캡) —
        # 논리 콜 1건이 재시도·백오프를 포함하므로 30s를 넘을 수 있다.
        external.call: 120s

monitoring:
  hiker:
    api-key: ${HIKER_API_KEY:}
    base-url: https://api.hikerapi.com
    request-timeout: 15s
    max-retries: 2       # 일시 오류(5xx·IO) 전용. 404는 재시도하지 않는다
    retry-backoff: 2s    # 회차마다 × n (2s → 4s)
  proxy:
    residential-url: ${DATAIMPULSE_RESIDENTIAL_PROXY_URL:}
    mobile-url: ${DATAIMPULSE_MOBILE_PROXY_URL:}
    request-timeout: 15s
    geo-kr: false          # C 실측 전 기본 off(스펙 §10-1)
    # 자체크롤 on/off는 boot 프로퍼티가 아니라 app_setting 'ig-source.self-enabled'(런타임 토글)로 제어
    comment-doc-id: ${IG_COMMENT_DOC_ID:}
    comment-friendly-name: ${IG_COMMENT_FRIENDLY_NAME:}
  self-retry:
    # F3: self 재시도(최대 3회 × request-timeout 15s=최악 45s) 총 시간예산 — 초과 시 남은 재시도를
    # 포기하고 즉시 Hiker로 폴백한다. 동기 등록(was→monitoring read timeout 10s)에서 폴백 전에
    # 사용자가 503을 보는 걸 막는다. p95 정상 경로(wpi 5.3s 실측)는 예산 안에서 1회 시도로 끝난다.
    budget: 8s
  sweep:
    retry-rounds: 3      # 스윕 말미 일시 실패 계정 재시도 라운드 수
    retry-interval: 10m  # 라운드 간격 × 라운드 번호 (10m → 20m → 30m)
    manual-trigger-enabled: false   # SweepController(POST /api/sweeps) 게이트 — 기본 off. 호출 1회가
                                     # 등록 계정 수만큼 Hiker 콜을 내는 증폭 지점이라 운영 공격면을
                                     # 최소화한다(Caddyfile 무배선이 1차 방어, 이건 2차 방어). false면
                                     # 컨트롤러 빈 자체가 등록되지 않아 /api/sweeps* 는 404.
  schedule:
    sweep-cron: "-"     # "-"=비활성. 운영은 UTC 17:00(KST 02:00)을 env로 주입
  enumerate-pages: 1    # 게시물 열거 페이지 수(최근 N개 범위) — Task 1 findings로 조정
  comment-pages: 3      # 스윕용 추적 게시물 댓글 페이지 수(3페이지 45건 상한 — findings §10-1 기반, 07-31 1→3 상향)
  # 등록 시점(POST 등록 직후 동기 즉시 수집) 전용 페이지 수 — 등록은 was→monitoring 10초 read
  # timeout 예산 안에서 동기로 도는 경로라 comment-pages(3)를 그대로 쓰면 콜이 4콜(게시물 1 +
  # 댓글 3)로 늘어 예산을 넘길 위험이 커진다. 등록의 목적은 "24시간 공백 해소"뿐이라 1페이지(15건)면
  # 충분하고, upsert가 누적 합집합이라 등록분 15건은 그날 스윕(comment-pages=3)이 돌아도 사라지지
  # 않고 보존된다 — 나머지 페이지는 스윕이 그날 안에 채운다.
  registration-comment-pages: 1
  # 저장·리포스트 세션 복권 재시도(08-04) — 키가 안 실린 추적 릴스가 있으면 clips 열거를 당첨까지
  # 재콜한다. 당첨률 콜당 ~45%(운영 원형 실측)라 상한 6회면 당일 확보율 ~98.5%, 기대 추가 콜은
  # 계정당 +1.2회 수준. 간격은 Hiker 응답 캐시(수 초 단위 동일 응답 관측) 회피용.
  metrics-retry-max: 6
  metrics-retry-delay: 10s
  # 브랜드 태그 모니터링(2026-08-06 스펙 + 2026-08-09 크롤링 정책 v1) — 태그 열거 단일 경로,
  # 게시물 나이 티어 주기(BrandCrawlPolicy: 14일 매일 / 30일 3일 / 90일 7일 / 180일 30일 주기).
  brand:
    schedule:
      sweep-cron: "-"   # "-"=비활성. 운영은 KST 02:00(UTC 17:00) env 주입 — 08-12 서버 드리프트를 정본으로 수용
    max-posts-per-sweep: 10000      # 개수 상한 폐지(정책 §4) — 폭주 방어 안전 밸브만(도달 시 error 로그).
                                    # 2,000은 tooq급 정상 고물량(11.8건/일 → 365일 창 ~4,300건)이 백필·
                                    # 심층 티어 스윕에서 닿아 08-12 상향 — 도달 시 커버 깊이 밖이 영구
                                    # 공백이 되므로 정상 브랜드가 절대 닿지 않는 값이어야 한다(08-12 스펙)
    collection-post-limit: 2000     # 수집 개수 상한(2026-08-19 스펙) — 한 실행의 열거를 최신 N건에서
                                    # "의도된 자연 종료"(INFO)로 끊는다. 종료 시 목표 컷 전체를 touch해
                                    # 컷 밖 게시물은 지표 동결·계속 서빙(due 재열거 루프 차단). 위
                                    # 안전 밸브(ERROR·커버 미처리)와 역할이 다르다 — was 목록 상한
                                    # (V1BrandPostsController.POST_LIMIT 2000)과 정합값.
                                    # 0 이하면 무제한(backfill-max-per-run 관용 일치)
    comment-pages: 3            # 게시물당 댓글 상한 3콜 45개(스펙 §2 — 정책 v1에서 30일 보충 없이 유지 확정)
    author-stale-days: 30       # 게시자 프로필 등장 시 stale 갱신 기준(스펙 §8)
    enrich-concurrency: 10      # 보강(게시자·댓글) 워커 풀 크기 — 08-13 실측에서 6/8/10 어느 레벨도 5초 초과 콜
                                # 미증가(정상 브랜드 세 레벨 모두 0건)라 6→10. enrich executor 2병렬로 브랜드당
                                # 실효 워커가 반감하므로 그 상쇄분이기도 하다
    enrich-executor-concurrency: 2  # 등록 백필의 보강 큐 스레드 수(08-13) — 백필 core 2병렬과 짝. 일일 스윕은
                                    # 자기 스레드에서 보강을 인라인으로 돌리므로 동시 보강 주체는 등록 2 + 스윕 1 = 최대 3.
                                    # 전역 동시 콜은 워커 풀이 상한이라 이 값을 올려도 안 늘어난다(콜은 전부 워커 풀로 나간다)
    backfill-concurrency: 2     # 등록 백필 core 동시 스레드(08-12) — 전역 동시 콜 최악 13(워커 10+스윕 1+core 2).
                                # 올리려면 힙(콜당 ~10MB)과 꼬리 레이턴시 재검토
    unenumerated-sweep-limit: 300   # 스윕당 2단계 재수집(direct∪hashtag) 상한(2026-08-27 설계 §5) — 0 이하 = 무제한.
                                    # 이관 직후 last_crawled_at NULL 행이 브랜드당 최대 1,000건 즉시 due라
                                    # 상한 없이는 전역 동시 콜 예산을 넘긴다. 미보강 우선 정렬로 잔량이 점진 소진된다.
    unenriched-backfill-on-startup: true   # 기동 즉시 백필 킬 스위치(2026-08-28 사용자 지시) — 이관 직후
                                    # 미보강(enriched_at IS NULL) 전량을 위 스윕 상한을 기다리지 않고 기동
                                    # 시점에 즉시 보강한다. 잔량 없으면 브랜드마다 빈 조회 한 번뿐인 no-op.
    hashtag:
      max-pages: 4               # 해시태그 recent 열거 태그당 상한(조기 종료가 정상 경로에선 이보다 먼저 끊는다)
    ad-disclosure:
      judge-model: gemini-3.1-flash-lite   # Tier2 문구 추출 모델(스펙 §5) — analytics 전 축과 통일
      concurrency: 4    # Tier2 LLM 전용 풀(enrichWorker와 분리 — 스펙 §7). LLM 지연이 보강 처리량을 잠식하지 않게 함
      enabled: true     # 판정 킬 스위치 — LLM 쿼터 장애 시 스윕 지연 방지용 독립 롤백 수단. GEMINI_API_KEY 제거는
                        # 해시태그 판정까지 죽이므로 쓰지 말 것. 기동 즉시 백필·야간 안전망 백필 둘 다 이 스위치로 끈다.
                        # 백필은 08-18 상한 제거 개정으로 상한 설정이 없다 — 잔량 0까지 전량 처리(LLM 풀 동시 4가 자연 속도 제한)
      # 백필 방어선(2026-08-18, #490 이후 스테이징 429 폭주 15분간 분당 83~146건 실측 계기) —
      # 연속 실패 서킷브레이커: LLM 연속 실패가 이 값에 도달하면 진행 중 배치 나머지는 LLM 호출을
      # 건너뛰고, 배치 종료 후 런 자체를 중단한다(잔여는 다음 주기가 재시도).
      llm-failure-abort-threshold: 10
      # 1회 백필 호출 처리 상한 — 0 이하면 무제한. 기본 무제한(08-18 사용자 결정 원복 — 429의 원인은
      # 상한이 아니라 무료 키 쿼터였고, Vertex 전환 + 위 서킷브레이커로 무제한이 안전하다).
      # 운영에서 일시적으로 누르고 싶을 때만 env로 양수를 준다.
      backfill-max-per-run: 0
  # LLM 전송(2026-08-18 Vertex 전환) — GOOGLE_APPLICATION_CREDENTIALS(SA 키)와 vertex-project가
  # 모두 설정돼 있으면 Vertex, 아니면 gemini.api-key(AI Studio)로 그레이스풀 폴백한다
  # (LlmTransportConfig.useVertex — analytics LlmConfig.useVertex 패턴 준용).
  llm:
    vertex-project: ${MONITORING_LLM_VERTEX_PROJECT:}
    vertex-location: ${MONITORING_LLM_VERTEX_LOCATION:global}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com
  image:
    # 프로필 이미지 아카이브(설계 스펙 §3-1) — 미설정이면 잡이 로그만 남기고 no-op(기동 실패 아님).
    # 운영은 analytics와 같은 버킷·쓰기 PAR을 재사용(compose.yaml MONITORING_IMAGE_PAR_URL 참고).
    par-url: ${MONITORING_IMAGE_PAR_URL:}
    # 이미지 스토어 선택(2026-08-12 GCS 이전): par=OCI PAR(기본), gcs=GCS
    store: ${IMAGE_STORE:par}
    gcs-bucket: ${IMAGE_GCS_BUCKET:}
    # 전용 SA 키 파일 경로 — 미설정이면 ADC 폴백. analytics와 같은 키를 재사용한다
    gcs-key: ${IMAGE_GCS_KEY:}
    # 08-25: 배치 상한(archive-batch-limit) 완전 제거 — 상한 1000/일에 author_profile 46.9%가
    # 정체돼 CDN 서명 만료로 영구 유실되는 문제(08-25 운영 진단) 재발 방지. 이제 매 스윕이 대기분
    # 전량을 처리한다(만료 필터·건 단위 실패 격리는 그대로 유지).
    backfill-trigger-enabled: false   # AuthorImageBackfillController(POST /api/author-image-backfill) 게이트
                                       # — 기본 off. 호출 1회가 대상 수만큼 Hiker 재조회 콜 + 직후 아카이브
                                       # 다운로드·업로드까지 내는 증폭 지점이라 운영 공격면을 최소화한다
                                       # (Caddyfile 무배선이 1차 방어, 이건 2차 방어 — sweep.manual-trigger-enabled와
                                       # 동일 근거). false면 컨트롤러 빈 자체가 등록되지 않아 이 경로는 404.
