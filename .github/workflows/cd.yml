# main 푸시마다 이미지 빌드·push + 오라클 서버 배포 — 수동 deploy.sh(deploy/scripts)의 CD 버전.
# 대상: was·analytics·crawler·monitoring 4종. staging→main 머지가 곧 배포 트리거 (staging CI 통과가 전제 —
# 승격 경로는 develop→staging(test 배포)→main. 07-29 staging 브랜치 전환).
#
# 분석 뷰(analytics/views)는 이미지에 안 들어가므로(운영 런북 §4-1) 배포 후 raw DB에 직접 적용 —
# 전부 CREATE OR REPLACE라 멱등이고, CI sql-harness가 프레시 DB 적용을 사전 검증한다.
# 컬럼 이름·타입이 바뀌는 뷰 변경은 OR REPLACE로 불가 — 해당 SQL에 DROP VIEW를 포함할 것(수동 절차와 동일 제약).
#
# 필요 시크릿: DEPLOY_SSH_KEY(서버 ssh 개인키), DEPLOY_HOST(서버 호스트/IP — ssh 사용자는 ubuntu 고정)
name: CD

on:
  push:
    branches: [main]

# 배포 겹침 방지 — 진행 중 배포는 취소하지 않고 다음 배포가 대기.
# test CD(cd-test.yml)와 같은 그룹 — 두 CD가 같은 서버 ~/deploy를 쓰므로 직렬화한다
concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: 이미지 빌드·push (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        service: [was, analytics, crawler, monitoring]
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # main은 기본 브랜치(develop)가 아니라 캐시 읽기 전용 — develop CI가 만든 캐시를 재사용
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      - name: bootJar 빌드
        run: ./gradlew :${{ matrix.service }}:bootJar

      # 레이어 추출(Spring Boot layered jar) — dependencies(변경 적음)/spring-boot-loader/
      # snapshot-dependencies(빈 디렉토리)/application(변경 잦음) 4레이어로 분리해 Docker
      # 레이어 캐시가 dependencies에서 히트하게 한다. 실측: 이미지 22~84M 중 dependencies가
      # 대부분이고 불변 — 코드만 바뀐 재배포는 application 레이어(280K~1.5M)만 push·pull된다.
      # 목적지가 비어있지 않으면 실패하므로 매 빌드 전 rm -rf로 초기화.
      - name: bootJar 레이어 추출
        run: |
          JAR=$(find ${{ matrix.service }}/build/libs -name '*.jar' ! -name '*-plain.jar')
          COUNT=$(echo "$JAR" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "bootJar 후보가 1개가 아님(plain jar 제외 후 $COUNT개) — 스테일 빌드 산출물 의심:"; echo "$JAR"
            exit 1
          fi
          rm -rf ${{ matrix.service }}/build/extracted
          java -Djarmode=tools -jar "$JAR" extract --layers --launcher \
            --destination ${{ matrix.service }}/build/extracted

      # 러너는 amd64, 서버(오라클 A1)는 arm64 단일 — 크로스 빌드(arm64 이미지를 amd64 러너에서 빌드)에
      # QEMU가 필요하다. amd64 이미지는 어디서도 실행되지 않아(로컬 colima도 arm64) 빌드하지 않는다.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: ghcr 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # deploy.sh와 동일 태깅 — :latest + :sha-<short> (롤백 절차: deploy/README.md §5)
      - name: arm64 빌드·push
        run: |
          SHA_TAG="sha-$(git rev-parse --short HEAD)"
          REPO="ghcr.io/${{ github.repository_owner }}/hypenow-${{ matrix.service }}"
          docker buildx build --platform linux/arm64 \
            -t "$REPO:latest" -t "$REPO:$SHA_TAG" --push ${{ matrix.service }}

  deploy:
    name: 서버 배포
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7   # 분석 뷰 SQL 전송용

      - name: SSH 설정
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # compose.yaml·Caddyfile은 서버 ~/deploy가 실물 — 레포를 정본으로 동기화해 드리프트 방지.
      # 동기화 후 config 검증: 레포에 새로 참조된 ${VAR}가 서버 .env에 없으면
      # 컨테이너가 빈 값으로 침묵 기동하므로, 그 전에 배포를 실패시킨다.
      - name: compose·Caddyfile·롤링 스크립트 동기화·검증
        run: |
          ssh -i ~/.ssh/id_deploy "ubuntu@${{ secrets.DEPLOY_HOST }}" 'mkdir -p ~/deploy/scripts'
          scp -i ~/.ssh/id_deploy deploy/compose.yaml deploy/Caddyfile "ubuntu@${{ secrets.DEPLOY_HOST }}:~/deploy/"
          # backup.sh도 여기서 함께 동기화 — 예전엔 CD가 안 올려 레포↔서버가 갈라졌고(monitoring
          # 덤프 블록이 레포에만 있고 서버엔 없어 monitoring이 운영 백업에서 조용히 누락됨,
          # 07-30 실측: md5sum 불일치·서버 backups/에 monitoring-*.sql.gz 0개), 그 결과 오프사이트
          # 전환(B2)도 서버에만 있고 레포에 반영이 안 되는 반대 방향 드리프트까지 겹쳤다.
          scp -i ~/.ssh/id_deploy deploy/scripts/rollout.sh deploy/scripts/backup.sh "ubuntu@${{ secrets.DEPLOY_HOST }}:~/deploy/scripts/"
          ssh -i ~/.ssh/id_deploy "ubuntu@${{ secrets.DEPLOY_HOST }}" \
            'cd ~/deploy && out=$(docker compose config 2>&1 >/dev/null) || { echo "$out"; exit 1; }
             if echo "$out" | grep -q "is not set"; then
               echo "$out"; echo "compose가 참조하는 env 변수가 서버 .env에 없음 — .env 갱신 후 재배포"; exit 1
             fi'

      # scp로 갱신된 Caddyfile은 컨테이너 재생성 없이는 반영되지 않는다 — 명시 reload(멱등,
      # cd-test와 동일 관용구). 기존엔 이 스텝이 없어 운영 라우팅 변경이 조용히 미반영되던 갭 해소.
      # 롤링보다 먼저 — 교대를 보호하는 lb_try_duration 등 프록시 설정이 롤링 전에 발효돼야 하고,
      # 설정이 깨졌으면 caddy가 옛 설정 유지한 채 여기서 실패하는 편이 안전하다(리뷰 I1).
      - name: caddy 설정 리로드
        run: |
          ssh -i ~/.ssh/id_deploy "ubuntu@${{ secrets.DEPLOY_HOST }}" \
            'cd ~/deploy && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile'

      # was만 무중단 롤링(트랙 X) — 순서가 규약: ① analytics·crawler·monitoring은 재기동(내부
      # 서비스, 다운타임 무해) + --wait로 analytics healthy(=analysis Flyway 완료)까지 대기 → 07-20
      # "새 분석 컬럼 참조 500" 가드를 롤링 경로에서도 유지 ② rollout.sh가 신 was를 먼저 띄워
      # healthy·스모크(/v1/stats) 확인 후 구를 제거(실패 시 구가 계속 서빙 — 무중단 실패.
      # 단 그 시점엔 신 analytics + 구 was 스큐가 남는다 — 조치는 README §5-1) ③ 마지막 up -d는
      # 나머지(redis·ons-relay 등) 정합 — orphan 경고(test-*)는 정상, --remove-orphans 금지(README §12)
      - name: compose pull·재기동 (was는 롤링)
        run: |
          ssh -i ~/.ssh/id_deploy "ubuntu@${{ secrets.DEPLOY_HOST }}" \
            'cd ~/deploy && docker compose pull was analytics crawler monitoring \
             && docker compose up -d --wait --wait-timeout 300 analytics crawler monitoring \
             && bash scripts/rollout.sh was \
             && docker compose up -d && docker compose ps'

      # crawler가 기동 중 Flyway로 raw 마이그레이션을 적용하므로, 새 컬럼 의존 뷰 대비 재시도.
      # (a) 변경 없으면 스킵 — analytics/views/*.sql 해시를 서버 ~/deploy/views.sha256(위 동기화
      #     스텝과 동일 경로)에 기록해두고, 해시 일치 + analytics 스키마에 뷰가 실제 존재할 때만
      #     생략(적용 성공 후에만 해시를 쓴다 — 실패한 걸 기록하면 다음 배포가 잘못 스킵한다).
      # (b) lock_timeout 15s + --single-transaction — DDL이 락 큐에 무한정 앉아 뒤따르는
      #     리더까지 줄 세우는 걸 막는다(89초 락 대기 실측은 앞쪽 CREATE OR REPLACE VIEW 9개가
      #     원인). lock_timeout으로 중간에 끊길 수 있어 원자성 확보에 --single-transaction 필수
      #     (기존 수동 런북과 동일 조합).
      - name: 분석 뷰 적용 (raw DB, 멱등 — 변경 없으면 스킵, lock_timeout 15s)
        run: |
          HASH=$(cat analytics/views/*.sql | sha256sum | cut -d' ' -f1)
          SKIP=$(ssh -i ~/.ssh/id_deploy "ubuntu@${{ secrets.DEPLOY_HOST }}" bash -s -- "$HASH" <<'REMOTE'
            hash_file=~/deploy/views.sha256
            if [ "$(cat "$hash_file" 2>/dev/null)" = "$1" ] && \
               docker exec deploy-postgres-raw-1 psql -U crawler -d crawler -tAc \
                 "select 1 from pg_views where schemaname='analytics' limit 1" | grep -q 1; then
              echo skip
            else
              echo apply
            fi
          REMOTE
          )
          if [ "$SKIP" = "skip" ]; then
            echo "뷰 해시 동일(analytics/views/*.sql) + analytics 스키마 뷰 존재 확인 — 적용 스킵"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            if { echo "SET lock_timeout = '15s';"; cat analytics/views/*.sql; } | \
              ssh -i ~/.ssh/id_deploy "ubuntu@${{ secrets.DEPLOY_HOST }}" \
              'docker exec -i deploy-postgres-raw-1 psql -U crawler -d crawler -v ON_ERROR_STOP=1 -q --single-transaction'; then
              ssh -i ~/.ssh/id_deploy "ubuntu@${{ secrets.DEPLOY_HOST }}" "echo '$HASH' > ~/deploy/views.sha256"
              exit 0
            fi
            echo "뷰 적용 실패 — ${i}회차, 15초 후 재시도 (lock_timeout 15s 초과=락 대기 가능성, 그 외는 crawler Flyway 마이그레이션 대기 가능성)"
            sleep 15
          done
          exit 1

      - name: 헬스체크
        run: curl -fsS --retry 5 --retry-delay 10 --retry-all-errors https://api.hypenow.io/health

      # monitoring은 호스트 포트를 노출하지 않아(전용 네트워크 전용) 외부 curl이 불가 —
      # compose 헬스체크 판정(8083 리슨 = Flyway 마이그레이션 완료)을 ps 출력으로 확인한다.
      # start_period 60s 여유를 위해 최대 5회 재시도.
      #   * ps -a: 죽은 컨테이너도 열거 — 크래시 루프(Exited/Restarting)가 로그에 남아야 원인 판별이 된다
      #   * || true: 러너 기본 셸이 bash -eo pipefail이라 일시적 ssh 실패가 재시도 루프를 통째로 죽인다
      - name: monitoring 헬스 확인 (호스트 포트 없음 — compose ps)
        run: |
          for i in 1 2 3 4 5; do
            out=$(ssh -i ~/.ssh/id_deploy "ubuntu@${{ secrets.DEPLOY_HOST }}" \
              'cd ~/deploy && docker compose ps -a monitoring' || true)
            echo "$out"
            if echo "$out" | grep -q '(healthy)'; then exit 0; fi
            echo "monitoring 아직 healthy 아님 — ${i}회차, 20초 후 재시도"
            sleep 20
          done
          echo "monitoring 컨테이너가 healthy에 도달하지 못함 — 서버 로그 확인(docker compose logs monitoring)"
          exit 1
