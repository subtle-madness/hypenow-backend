# staging CI 성공마다 test 스테이징 배포 (태스크 K → 07-29 S: staging 브랜치 전환) —
# 대상: was·analytics·monitoring 3종(:staging, arm64 단일). develop 머지는 CI만(배포 없음),
# test 배포는 develop→staging 머지가 트리거, 운영 승격은 staging→main 머지.
# 뷰는 analytics_dev 스키마로 치환 적용(analytics_dev 계정 실행 = 권한 fail-closed) 후 잔존 참조 검사.
# 서버 compose.yaml(main 배포 공급)에 prod/test 네트워크 선언이 있어야 config 검증이 통과한다 —
# 전환 순서·근거: docs/superpowers/specs/2026-07-29-staging-branch-test-stack-design.md
name: CD test

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging]

# 운영 CD(cd.yml)와 같은 그룹 — 두 CD가 같은 서버 ~/deploy를 쓰므로 배포를 직렬화한다
concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: test 이미지 빌드·push (${{ matrix.service }})
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        service: [was, analytics, monitoring]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 읽기 전용 강제 필수(08-07) — workflow_run은 항상 기본 브랜치(develop) 컨텍스트로 돌아서
      # setup-gradle의 "기본 브랜치만 쓰기" 가드를 통과해 이 잡이 캐시를 써버린다. bootJar만 돌린
      # 빌드는 cache-cleanup이 테스트 캐시를 미사용으로 퍼지해 0.2MB 스텁을 저장하고, 이게
      # cache-warm의 정상 캐시(4.7MB)보다 최신이 되면 PR CI의 restore-key 폴백이 스텁을 물어
      # 전체 테스트가 캐시 0%로 풀 실행됐다(배포 직후 PR CI 4m40s 실측 — PR #345 무효화 창).
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: bootJar 빌드
        run: ./gradlew :${{ matrix.service }}:bootJar

      # 레이어 추출(Spring Boot layered jar) — Dockerfile이 build/extracted/*를 COPY하므로 필수
      # (운영 CD와 동일 관용구, 근거는 그쪽 주석 참조). 목적지가 비어있지 않으면 실패하므로 rm -rf 선행.
      - name: bootJar 레이어 추출
        run: |
          JAR=$(find ${{ matrix.service }}/build/libs -name '*.jar' ! -name '*-plain.jar')
          COUNT=$(echo "$JAR" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "bootJar 후보가 1개가 아님(plain jar 제외 후 $COUNT개) — 스테일 빌드 산출물 의심:"; echo "$JAR"
            exit 1
          fi
          rm -rf ${{ matrix.service }}/build/extracted
          java -Djarmode=tools -jar "$JAR" extract --layers --launcher \
            --destination ${{ matrix.service }}/build/extracted

      # 서버(오라클 A1)가 arm64 단일이라 test는 멀티아치 불필요 — 운영 CD보다 빠르게.
      # QEMU는 러너(amd64)에서 arm64 이미지를 크로스 빌드하는 데 필요(제거 불가)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: ghcr 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: arm64 빌드·push (:staging)
        run: |
          SHA_TAG="staging-sha-$(git rev-parse --short HEAD)"
          REPO="ghcr.io/${{ github.repository_owner }}/hypenow-${{ matrix.service }}"
          docker buildx build --platform linux/arm64 \
            -t "$REPO:staging" -t "$REPO:$SHA_TAG" --push ${{ matrix.service }}

  deploy:
    name: test 서버 배포
    needs: build-push
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: SSH 설정
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # 본 Caddyfile(운영 라우팅)은 보내지 않는다 — test 라우팅은 caddy.d/test-api.caddy만 갱신.
      # staging에만 있는 운영 라우팅 변경이 main 배포 전에 발효되는 뒷문을 막는 게 요점.
      # 운영 compose.yaml도 보내지 않는다 — test 서비스 정의는 compose.test.yaml에만 있고
      # 이 파일만 test CD가 공급한다(운영 정의는 main 배포로만 서버에 도달). config 검증은
      # 서버의 compose.yaml(=main 버전)에 test 오버레이를 겹친 실제 조합으로 수행한다.
      # 구 명칭 파일(compose.dev.yaml·dev-api.caddy)은 제거(멱등) — 특히 구 caddy 파일이 남으면
      # 같은 도메인(dev-api) 이중 선언으로 caddy reload가 깨진다(07-29 리네임 잔재 정리).
      - name: test compose·라우팅·스크립트 동기화·검증
        run: |
          # dumps 1777은 cd.yml과 동일 사유(non-root JVM의 OOM 힙 덤프 쓰기) — staging이 main보다
          # 먼저 도는 승격 순서상 test 스택 기동 전에 여기서도 보장해야 한다.
          ssh -i ~/.ssh/id_deploy "ubuntu@${{ secrets.DEPLOY_HOST }}" \
            'mkdir -p ~/deploy/scripts ~/deploy/caddy.d && install -d -m 1777 ~/deploy/dumps && rm -f ~/deploy/compose.dev.yaml ~/deploy/caddy.d/dev-api.caddy'
          scp -i ~/.ssh/id_deploy deploy/compose.test.yaml "ubuntu@${{ secrets.DEPLOY_HOST }}:~/deploy/"
          scp -i ~/.ssh/id_deploy deploy/caddy.d/test-api.caddy "ubuntu@${{ secrets.DEPLOY_HOST }}:~/deploy/caddy.d/"
          scp -i ~/.ssh/id_deploy deploy/scripts/prepare-dev-raw-role.sh "ubuntu@${{ secrets.DEPLOY_HOST }}:~/deploy/scripts/"
          ssh -i ~/.ssh/id_deploy "ubuntu@${{ secrets.DEPLOY_HOST }}" \
            'cd ~/deploy && out=$(docker compose -f compose.yaml -f compose.test.yaml --profile test config 2>&1 >/dev/null) || { echo "$out"; exit 1; }
             if echo "$out" | grep -q "is not set"; then
               echo "$out"; echo "compose가 참조하는 env 변수가 서버 .env에 없음 — .env 갱신 후 재배포"; exit 1
             fi'

      - name: test DB 계정·스키마 준비 (멱등)
        run: |
          ssh -i ~/.ssh/id_deploy "ubuntu@${{ secrets.DEPLOY_HOST }}" 'bash ~/deploy/scripts/prepare-dev-raw-role.sh'

      - name: 치환 셀프테스트
        run: deploy/scripts/rewrite-views-dev-schema.test.sh

      # analytics_dev 계정으로 적용 — 치환 누락 시 analytics 스키마 쓰기 권한이 없어 즉시 실패.
      # 운영 CD와 동일한 스킵 기법(해시 비교 + 스키마 존재 프로브, 파일은 analytics_dev 전용
      # ~/deploy/views-test.sha256로 분리) + lock_timeout 15s·--single-transaction을 그대로 적용 —
      # 치환은 psql로 보내기 직전 필터라 스킵 판단(치환 전 원본 해시 비교)과 서로 무관해 복잡해지지 않는다.
      - name: test 뷰 적용 (analytics_dev 치환, 변경 없으면 스킵, lock_timeout 15s)
        run: |
          HASH=$(cat analytics/views/*.sql | sha256sum | cut -d' ' -f1)
          SKIP=$(ssh -i ~/.ssh/id_deploy "ubuntu@${{ secrets.DEPLOY_HOST }}" bash -s -- "$HASH" <<'REMOTE'
            hash_file=~/deploy/views-test.sha256
            if [ "$(cat "$hash_file" 2>/dev/null)" = "$1" ] && \
               docker exec deploy-postgres-raw-1 psql -U crawler -d crawler -tAc \
                 "select 1 from pg_views where schemaname='analytics_dev' limit 1" | grep -q 1; then
              echo skip
            else
              echo apply
            fi
          REMOTE
          )
          if [ "$SKIP" = "skip" ]; then
            echo "뷰 해시 동일(analytics/views/*.sql) + analytics_dev 스키마 뷰 존재 확인 — 적용 스킵"
            exit 0
          fi
          { echo "SET lock_timeout = '15s';"; cat analytics/views/*.sql; } | \
            deploy/scripts/rewrite-views-dev-schema.sh | \
            ssh -i ~/.ssh/id_deploy "ubuntu@${{ secrets.DEPLOY_HOST }}" \
              'docker exec -i deploy-postgres-raw-1 psql -U analytics_dev -d crawler -v ON_ERROR_STOP=1 -q --single-transaction'
          ssh -i ~/.ssh/id_deploy "ubuntu@${{ secrets.DEPLOY_HOST }}" "echo '$HASH' > ~/deploy/views-test.sha256"

      # 뷰 정의·함수 본문에 analytics.(비-따옴표) 참조가 남았으면 치환 누락 — 배포 실패 처리
      - name: 잔존 참조 검사
        run: |
          residue=$(ssh -i ~/.ssh/id_deploy "ubuntu@${{ secrets.DEPLOY_HOST }}" \
            'docker exec -i deploy-postgres-raw-1 psql -U crawler -d crawler -tA -v ON_ERROR_STOP=1' <<'SQL'
          SELECT 'view ' || viewname FROM pg_views
            WHERE schemaname = 'analytics_dev' AND definition ~ $q$[^']analytics\.$q$
          UNION ALL
          SELECT 'function ' || p.proname FROM pg_proc p
            JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'analytics_dev' AND p.prosrc ~ $q$[^']analytics\.$q$;
          SQL
          )
          if [ -n "$residue" ]; then
            echo "analytics_dev 안에 운영 analytics 참조 잔존:"; echo "$residue"; exit 1
          fi

      # --remove-orphans는 이 경로 한정 안전 — 전체 파일 세트(-f 둘 다) 기준이라 고아 = 정의가
      # 사라진 컨테이너(07-29 전환 시점의 구 deploy-dev-* 3종)뿐, 운영 서비스는 compose.yaml에
      # 정의돼 무관. README §12의 "--remove-orphans 금지"는 운영 파일 단독 실행 경로(test
      # 서비스가 고아로 보이는 케이스) 이야기로, 이 경로와 혼동하지 말 것.
      - name: test compose pull·재기동
        run: |
          ssh -i ~/.ssh/id_deploy "ubuntu@${{ secrets.DEPLOY_HOST }}" \
            'cd ~/deploy && docker compose -f compose.yaml -f compose.test.yaml --profile test pull test-analytics test-was test-monitoring && \
             docker compose -f compose.yaml -f compose.test.yaml --profile test up -d --remove-orphans test-postgres test-redis test-analytics test-was test-monitoring && \
             docker compose -f compose.yaml -f compose.test.yaml --profile test ps'

      - name: caddy 설정 리로드 (test-api 라우팅 반영)
        run: |
          ssh -i ~/.ssh/id_deploy "ubuntu@${{ secrets.DEPLOY_HOST }}" \
            'cd ~/deploy && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile'

      - name: 헬스체크
        run: curl -fsS --retry 10 --retry-delay 10 --retry-all-errors https://dev-api.hypenow.io/health

      # monitoring은 호스트 포트를 노출하지 않아 외부 curl 불가 — compose 헬스체크 판정(8083 리슨
      # = monitoring DB Flyway 마이그레이션 완료)을 ps 출력으로 확인한다(운영 CD와 동일 관용구).
      # 이 게이트가 없어 08-12 마이그레이션 채번 역전 크래시루프를 스테이징 "success"가 숨겼고,
      # 운영 CD에서 처음 터졌다 — 여기서 잡아야 승격 전에 드러난다.
      # start_period 60s 여유를 위해 최대 5회 재시도.
      #   * ps -a: 죽은 컨테이너도 열거 — 크래시 루프(Exited/Restarting)가 로그에 남아야 원인 판별이 된다
      #   * || true: 러너 기본 셸이 bash -eo pipefail이라 일시적 ssh 실패가 재시도 루프를 통째로 죽인다
      - name: test-monitoring 헬스 확인 (호스트 포트 없음 — compose ps)
        run: |
          for i in 1 2 3 4 5; do
            out=$(ssh -i ~/.ssh/id_deploy "ubuntu@${{ secrets.DEPLOY_HOST }}" \
              'cd ~/deploy && docker compose -f compose.yaml -f compose.test.yaml --profile test ps -a test-monitoring' || true)
            echo "$out"
            if echo "$out" | grep -q '(healthy)'; then exit 0; fi
            echo "test-monitoring 아직 healthy 아님 — ${i}회차, 20초 후 재시도"
            sleep 20
          done
          echo "test-monitoring 컨테이너가 healthy에 도달하지 못함 — 서버 로그 확인(docker compose -f compose.yaml -f compose.test.yaml --profile test logs test-monitoring)"
          exit 1

      # 운영 CD(cd.yml)와 같은 서버·같은 docker 데몬을 test 배포도 공유해 댕글링 이미지가
      # 함께 쌓인다 — 상세 근거는 cd.yml의 동일 단계 주석 참고. dangling-only(-f)만, 실패는 흡수.
      - name: 댕글링 이미지 정리 (서버)
        run: |
          ssh -i ~/.ssh/id_deploy "ubuntu@${{ secrets.DEPLOY_HOST }}" 'docker image prune -f' \
            || echo "이미지 정리 실패(무시) — 다음 배포에서 재시도됨"
