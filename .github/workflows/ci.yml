# develop·staging 대상 push·PR + main 대상 PR(배포 관문 — staging→main 머지 전 검증)마다
# 전체 Gradle 테스트 + 분석 뷰 SQL 하니스를 돌린다.
# staging push CI는 test 스테이징 배포(cd-test.yml)의 게이트 — 성공 시에만 workflow_run이 발화.
# 테스트는 Testcontainers(PostgreSQL)를 쓰므로 러너의 Docker(ubuntu-latest 기본 제공)로 충분 —
# 외부 API 키·별도 서비스 컨테이너 불필요.
#
# sql-harness 잡은 raw 스키마의 사실상 계약 테스트(ARCHITECTURE §4-5) — 프레시 Postgres에
# crawler 마이그레이션 전체를 적용하고 run.sh(뷰 적용 + 시드/기대값)를 실행한다.
# 뷰·하니스가 신스키마로 전환(07-18)돼 프레시 DB 재현이 가능해졌다(§8 블로커 해소).
name: CI

on:
  push:
    branches: [develop, staging]
  pull_request:
    branches: [develop, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Gradle 전체 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # 병행 PR이 같은 Flyway 번호를 선점하면 머지 후에야 터진다(07-21 V35·V36 연속 선점) —
      # 테스트 전체를 기다리지 않고 수 초 안에 명확히 실패시킨다. PR CI는 base와의
      # 머지 결과(refs/pull/N/merge)를 체크아웃하므로 develop에 먼저 들어간 번호와의 중복도 잡힌다.
      - name: Flyway 마이그레이션 버전 중복 검사
        run: |
          fail=0
          for d in analytics/src/main/resources/db/migration/analysis \
                   was/src/main/resources/db/migration/app \
                   crawler/src/main/resources/db/migration; do
            [ -d "$d" ] || continue
            dup=$(ls "$d" | grep -oE '^V[0-9]+' | sort | uniq -d)
            if [ -n "$dup" ]; then
              echo "::error::마이그레이션 버전 중복 ($d): $(echo $dup | tr '\n' ' ') — 뒤에 온 PR이 다음 번호로 재번호할 것"
              fail=1
            fi
          done
          exit $fail

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 캐시·래퍼 검증 포함. 캐시 쓰기는 기본 브랜치(develop) push에서만 일어나고
      # PR은 읽기 전용으로 재사용한다.
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      - name: 전체 테스트
        run: ./gradlew test

      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/test/'
          retention-days: 7

  # was 롤링 배포(트랙 X) 중 신구 코드가 같은 DB를 공존해서 본다 — 파괴적 DDL(DROP·RENAME·
  # 타입 변경·SET NOT NULL)은 참조 코드가 사라진 다음 릴리스로 분리(expand-contract,
  # deploy/README.md §5-1). 의도된 contract 단계는 `-- allow-destructive: <사유>` 주석으로 통과.
  # 대상은 analysis DB(was app + analytics)만 — crawler(raw)는 재기동 배포라 공존이 없고
  # was는 raw 접근 금지(시스템 경계)라 대상 외. PR에서만 — base_ref 기준 diff가 검사 대상.
  migration-guard:
    name: 마이그레이션 롤링 호환 가드
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # base 브랜치와의 diff에 전체 refs 필요

      - name: 가드 셀프테스트
        run: .github/scripts/check-migration-safety.test.sh

      - name: 파괴적 마이그레이션 검사 (expand-contract)
        run: .github/scripts/check-migration-safety.sh "origin/${{ github.base_ref }}"

  sql-harness:
    name: 분석 뷰 SQL 하니스
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # run.sh의 기본 컨테이너 이름(crawler-postgres-1)에 맞춰 기동 — PG_CONTAINER 오버라이드 불필요.
      # 마이그레이션은 파일명 버전 번호순(-t V -k 2 -n: 경로에 대문자 V는 버전 접두사뿐) —
      # 사전순은 V10을 V1__ 앞에 놓아 깨진다.
      - name: 프레시 raw DB 기동 + crawler 마이그레이션 적용
        run: |
          docker run -d --name crawler-postgres-1 \
            -e POSTGRES_USER=crawler -e POSTGRES_PASSWORD=crawler -e POSTGRES_DB=crawler \
            postgres:16
          # 대기는 실쿼리로 — pg_isready는 initdb 중 임시 서버(소켓)에도 OK를 줘서
          # POSTGRES_DB 생성 전에 통과하는 레이스가 있다(07-29 PR #178에서 실발생:
          # "database crawler does not exist"). SELECT 1이 돼야 초기화 완료다.
          for i in $(seq 1 30); do
            if docker exec crawler-postgres-1 psql -U crawler -d crawler -c 'SELECT 1' -q >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec crawler-postgres-1 psql -U crawler -d crawler -c 'SELECT 1' -q >/dev/null
          for f in $(ls crawler/src/main/resources/db/migration/*.sql | sort -t V -k 2 -n); do
            echo "migrate $f"
            docker exec -i crawler-postgres-1 psql -U crawler -d crawler -v ON_ERROR_STOP=1 -q < "$f"
          done

      - name: 하니스 실행 (뷰 적용 + 시드/기대값)
        run: analytics/test/run.sh
