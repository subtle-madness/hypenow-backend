# develop 대상 push·PR마다 전체 Gradle 테스트를 돌린다.
# 테스트는 Testcontainers(PostgreSQL)를 쓰므로 러너의 Docker(ubuntu-latest 기본 제공)로 충분 —
# 외부 API 키·별도 서비스 컨테이너 불필요.
#
# 분석 뷰 SQL 하니스(analytics/test/run.sh)는 미포함: 뷰가 실DB(V6 시점) 스키마를 전제해
# 리포 마이그레이션(V8+ influencer 개편)만으로는 재현 불가. analytics 재구축 후 연결(ARCHITECTURE §8).
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Gradle 전체 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 캐시·래퍼 검증 포함. 캐시 쓰기는 기본 브랜치(develop) push에서만 일어나고
      # PR은 읽기 전용으로 재사용한다.
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      - name: 전체 테스트
        run: ./gradlew test

      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/test/'
          retention-days: 7
