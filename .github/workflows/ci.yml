# develop·staging·main 대상 PR과 머지 큐(merge_group), staging push(배포 관문)마다
# 전체 Gradle 테스트 + 분석 뷰 SQL 하니스를 돌린다. develop push만 예외로 캐시 시딩만 한다(아래).
# staging push CI는 test 스테이징 배포(cd-test.yml)의 게이트 — 성공 시에만 workflow_run이 발화.
# 테스트는 Testcontainers(PostgreSQL)를 쓰므로 러너의 Docker(ubuntu-latest 기본 제공)로 충분 —
# 외부 API 키·별도 서비스 컨테이너 불필요.
#
# sql-harness 잡은 raw 스키마의 사실상 계약 테스트(ARCHITECTURE §4-5) — 프레시 Postgres에
# crawler 마이그레이션 전체를 적용하고 run.sh(뷰 적용 + 시드/기대값)를 실행한다.
# 뷰·하니스가 신스키마로 전환(07-18)돼 프레시 DB 재현이 가능해졌다(§8 블로커 해소).
#
# develop push는 검증이 아니라 **Gradle 캐시 시딩 전용**이다(07-30, 머지 큐 도입 후 정리).
# 머지 큐를 켠 뒤로 develop에 들어오는 커밋은 예외 없이 merge_group에서 세 잡을 이미 통과한
# 바로 그 머지 커밋이라(룰셋이 직접 push를 막는다) push에서 전체 테스트를 또 도는 건 순수 중복
# — 승격 PR·staging push에서 배포 전에 한 번 더 돈다. 그런데 push 런을 통째로 없앨 수는 없다:
# `gradle/actions/setup-gradle`은 **기본 브랜치(develop) push에서만 캐시를 쓰고** PR·merge_group은
# 읽기만 한다(머지 큐 임시 브랜치에서 쓴 캐시는 그 ref 스코프라 재사용 불가). 시딩이 끊기면
# 모든 PR CI가 캐시 미스로 느려진다(실측 1m16s → 3m). 그래서 develop push에서는 test·sql-harness
# 대신 컴파일까지만 도는 `cache-warm` 잡 하나만 남긴다.
#
# merge_group(07-30, 머지 큐 도입 선행 작업): 룰셋 `protect-release-branches`가 이 워크플로의
# 세 잡(test·migration-guard·sql-harness)을 develop·main에 required status check로 건다.
# 머지 큐를 켜면 GitHub이 큐 엔트리마다 임시 브랜치(refs/heads/gh-readonly-queue/<base>/pr-N-<sha>)를
# merge_group 이벤트로 만들고 그 위에서 required check 셋이 전부 보고되길 기다린다 — 이 이벤트를
# 안 받으면 세 잡 중 하나가 영영 안 돌아 큐 엔트리가 타임아웃까지 매달린다. branches 필터는
# pull_request와 동일 범위로 맞춰둔다(당장은 develop만 큐를 켜지만, staging·main으로 큐를
# 넓힐 때 이 파일을 다시 건드리지 않아도 되게).
name: CI

on:
  push:
    branches: [develop, staging]
  pull_request:
    branches: [develop, staging, main]
  merge_group:
    branches: [develop, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  # merge_group에서는 github.ref가 큐 엔트리마다 고유한 임시 브랜치라 그룹이 겹치지 않고,
  # required check는 취소되면 안 되므로 cancel-in-progress는 pull_request에서만 true로 둔다
  # (merge_group·push는 false — 특히 merge_group을 취소하면 큐 엔트리가 그대로 멈춘다).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # develop push 전용 — 검증이 아니라 공유 Gradle 캐시를 채우는 자리다(파일 상단 주석).
  # 테스트를 돌리지 않는 이유: 이 커밋은 merge_group에서 세 잡을 이미 통과했다.
  # `testClasses`까지만 도는 이유: PR CI가 실제로 아끼는 건 의존성 다운로드와 컴파일 산출물이고,
  # 테스트 실행 결과는 어차피 코드가 다르면 재사용되지 않는다.
  cache-warm:
    name: Gradle 캐시 시딩 (develop push)
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      - name: 컴파일 (캐시 채우기)
        run: ./gradlew testClasses

  test:
    name: Gradle 전체 테스트
    # develop push에서는 위 cache-warm이 대신한다(merge_group에서 이미 통과한 커밋).
    # staging push는 그대로 돈다 — cd-test.yml이 이 CI 성공을 배포 게이트로 쓴다.
    if: github.event_name != 'push' || github.ref_name != 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # 병행 PR이 같은 Flyway 번호를 선점하면 머지 후에야 터진다(07-21 V35·V36 연속 선점) —
      # 테스트 전체를 기다리지 않고 수 초 안에 명확히 실패시킨다. PR CI는 base와의
      # 머지 결과(refs/pull/N/merge)를 체크아웃하므로 develop에 먼저 들어간 번호와의 중복도
      # 논리적으로는 잡힌다. **다만 그것만으론 부족하다(07-30 실측, #181 3차 재발)**: base가
      # 바뀐 뒤 PR CI가 재실행되지 않으면 이 스텝은 낡은 머지 스냅샷을 보고 통과시킨다 —
      # #181의 실제 원인은 검사 부재가 아니라 재실행 부재였다(CI 실행 이후 develop이 같은
      # 번호를 선점, 그 뒤 재실행 없이 머지). 이 스텝은 그 레이스를 고치지 못한다(고치려면
      # 브랜치 보호 룰셋의 required+strict 필요, 워크플로 범위 밖) — push 이벤트(이 잡은
      # push에서도 돈다, base_ref 없음)를 포함해 "현재 트리 내부에서 번호가 겹치는" 실패
      # 모드는 여전히 여기서 잡는다. PR·merge_group 대상 `migration-guard` 잡의 base 대조 모드
      # (`check-migration-safety.sh <base-ref>`, 07-30 merge_group 추가)가 그 위에 base 충돌
      # 검사를 더한다.
      # 로직은 check-migration-safety.sh(셀프테스트 보호) 하나로 통합 — monitoring 디렉토리
      # 포함·선행 0 정규화(V07==V7)까지 여기 인라인 버전엔 없던 걸 얻는다.
      - name: Flyway 마이그레이션 버전 중복 검사
        run: .github/scripts/check-migration-safety.sh --versions-tree

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 캐시·래퍼 검증 포함. 캐시 쓰기는 기본 브랜치(develop) push에서만 일어나므로
      # 이 잡(PR·merge_group·staging push)에서는 읽기 전용 재사용이고, 쓰기는 cache-warm 잡이 맡는다.
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      - name: 전체 테스트
        run: ./gradlew test

      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/test/'
          retention-days: 7

  # was 롤링 배포(트랙 X) 중 신구 코드가 같은 DB를 공존해서 본다 — 파괴적 DDL(DROP·RENAME·
  # 타입 변경·SET NOT NULL)은 참조 코드가 사라진 다음 릴리스로 분리(expand-contract,
  # deploy/README.md §5-1). 의도된 contract 단계는 `-- allow-destructive: <사유>` 주석으로 통과.
  # 대상은 analysis DB(was app + analytics)만 — crawler(raw)는 재기동 배포라 공존이 없고
  # was는 raw 접근 금지(시스템 경계)라 대상 외. PR·merge_group에서만 — base와의 diff가
  # 검사 대상(push엔 base 개념이 없다). merge_group에서도 도는 이유는 이 잡이 required
  # status check라서다(파일 상단 주석) — base ref 정규화는 아래 "대조 base 결정" 스텝 참고.
  migration-guard:
    name: 마이그레이션 롤링 호환 가드
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # base 브랜치와의 diff에 전체 refs 필요

      - name: 가드 셀프테스트
        run: .github/scripts/check-migration-safety.test.sh

      # base ref 표현이 이벤트마다 다르다 — pull_request의 github.base_ref는 브랜치명만
      # (예: develop), merge_group의 github.event.merge_group.base_ref는 풀 ref
      # (예: refs/heads/develop)를 준다. check-migration-safety.sh는 "origin/<branch>" 형태의
      # git ref를 기대하므로(파일 하단 스크립트 사용법) 여기서 이벤트별로 정규화해 맞춘다.
      - name: 대조 base 결정
        id: base
        env:
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=origin/${MERGE_GROUP_BASE_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
          fi

      - name: 파괴적 마이그레이션 검사 (expand-contract)
        run: .github/scripts/check-migration-safety.sh "${{ steps.base.outputs.ref }}"

  sql-harness:
    name: 분석 뷰 SQL 하니스
    # test 잡과 같은 이유로 develop push에서는 건너뛴다(merge_group에서 이미 통과).
    if: github.event_name != 'push' || github.ref_name != 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # run.sh의 기본 컨테이너 이름(crawler-postgres-1)에 맞춰 기동 — PG_CONTAINER 오버라이드 불필요.
      # 마이그레이션은 파일명 버전 번호순(-t V -k 2 -n: 경로에 대문자 V는 버전 접두사뿐) —
      # 사전순은 V10을 V1__ 앞에 놓아 깨진다.
      - name: 프레시 raw DB 기동 + crawler 마이그레이션 적용
        run: |
          docker run -d --name crawler-postgres-1 \
            -e POSTGRES_USER=crawler -e POSTGRES_PASSWORD=crawler -e POSTGRES_DB=crawler \
            postgres:16
          # 대기는 실쿼리로 — pg_isready는 initdb 중 임시 서버(소켓)에도 OK를 줘서
          # POSTGRES_DB 생성 전에 통과하는 레이스가 있다(07-29 PR #178에서 실발생:
          # "database crawler does not exist"). SELECT 1이 돼야 초기화 완료다.
          for i in $(seq 1 30); do
            if docker exec crawler-postgres-1 psql -U crawler -d crawler -c 'SELECT 1' -q >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec crawler-postgres-1 psql -U crawler -d crawler -c 'SELECT 1' -q >/dev/null
          for f in $(ls crawler/src/main/resources/db/migration/*.sql | sort -t V -k 2 -n); do
            echo "migrate $f"
            docker exec -i crawler-postgres-1 psql -U crawler -d crawler -v ON_ERROR_STOP=1 -q < "$f"
          done

      - name: 하니스 실행 (뷰 적용 + 시드/기대값)
        run: analytics/test/run.sh
