<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>hypenow analytics</title>
    <link rel="stylesheet" href="/css/admin.css"/>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
<main>
    <header class="hd">
        <h1>hypenow analytics</h1>
        <div class="pills">
            <span class="pill on" th:if="${scheduleEnabled}">자동화 ON</span>
            <span class="pill" th:unless="${scheduleEnabled}">자동화 OFF — 수동 전용</span>
            <span class="pill ghost">5초마다 자동 갱신</span>
        </div>
    </header>
    <p class="hint"><a href="/ui/coverage">커버리지 — 필드별 채움 상태 →</a></p>

    <div class="flash" th:if="${message}" th:text="${message}"></div>

    <!-- 건강·퍼널·잡 카드·피드를 통째로 5초 폴링.
         퍼널이 폴링 대상이어야 후보 집계(무거운 캐시) 완료가 새로고침 없이 반영된다. -->
    <div hx-get="/ui/fragments/board" hx-trigger="load, every 5s">
        <p class="hint">현황 불러오는 중…</p>
    </div>

    <details class="logs">
        <summary>라이브 로그</summary>
        <div hx-get="/ui/fragments/logs" hx-trigger="load, every 5s"></div>
    </details>
</main>
</body>
</html>
