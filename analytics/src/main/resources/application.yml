spring:
  application:
    name: analytics
  # 기본 DataSource 자동설정 비활성 (수동 2개 정의)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

app:
  datasource:
    raw:
      url: jdbc:postgresql://localhost:5433/crawler
      username: crawler
      password: crawler
      driver-class-name: org.postgresql.Driver
    analysis:
      url: jdbc:postgresql://localhost:5433/analysis
      username: crawler
      password: crawler
      driver-class-name: org.postgresql.Driver
