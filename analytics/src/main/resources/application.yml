spring:
  application:
    name: analytics
  # 기본 DataSource 자동설정 비활성 (수동 2개 정의)
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

server:
  port: 8082   # crawler 8080 · was 8081 다음

analytics:
  admin-enabled: true          # 어드민 UI·잡 트리거 층. cloud one-shot에서는 false
  mirror-on-startup: false     # 서버 모드에선 UI 트리거가 정본. one-shot 미러: --analytics.mirror-on-startup=true --spring.main.web-application-type=none
  classify-on-startup: false   # 댓글 분류 배치 — 실 API 비용이 들어 기본 off. 실행: --analytics.classify-on-startup=true --spring.main.web-application-type=none
  analyze-on-startup: false    # 콘텐츠 분석 배치 — 실 API 비용. 실행: --analytics.analyze-on-startup=true --spring.main.web-application-type=none
  account-analyze-on-startup: false  # 계정 카피 배치 — 실 API 비용. 실행: --analytics.account-analyze-on-startup=true --spring.main.web-application-type=none
  vlm-enabled: false           # F-2 스파이크 검증 전까지 VLM 스킵 (컬럼 NULL)
  # 이미지 스토어 선택(2026-08-12 GCS 이전): par=OCI PAR(기본), gcs=GCS. 복귀는 par로 원복.
  image-store: ${IMAGE_STORE:par}
  image-gcs-bucket: ${IMAGE_GCS_BUCKET:}
  schedule:
    enabled: false             # 스케줄 트리거 골격 — 켜려면 true + 잡별 *-cron 지정 (admin-enabled 필요)
    # mirror-cron: "0 0 6 * * *"   # 켜는 날 예시. 미지정 잡은 "-"(비활성)
    # late-backfill-analyze-cron: "0 30 3 * * *"  # timely(analyze-cron) 직후 예시 — 별도 예산이라 독립 조정 가능

app:
  datasource:
    raw:
      jdbc-url: jdbc:postgresql://localhost:5433/crawler
      username: crawler
      password: crawler
      driver-class-name: org.postgresql.Driver
      # 뷰·캐시 스키마 선택(태스크 K) — 운영 기본 analytics, dev 스테이징은 ANALYTICS_RAW_SCHEMA=analytics_dev.
      # SQL은 뷰 이름을 무접두어로 쓰고(태스크 2) 이 search_path가 스키마를 결정한다.
      connection-init-sql: SET search_path TO ${analytics.raw-schema:analytics}, public
    analysis:
      jdbc-url: jdbc:postgresql://localhost:5433/analysis
      username: crawler
      password: crawler
      driver-class-name: org.postgresql.Driver
