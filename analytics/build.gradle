plugins {
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
}

dependencies {
	implementation project(':contract-analysis')
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.flywaydb:flyway-core'
	// JVM 지표 노출(2026-08-31, 08-22 monitoring 스펙의 이연분) — /actuator/prometheus. was·monitoring과 같은 패턴
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'com.anthropic:anthropic-java:2.34.0'
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.49.0'
	implementation 'com.google.cloud:google-cloud-storage:2.48.0'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// JobConfigLlmWiringTest가 LlmConfig.geminiApi()의 실제 빈 배선을 그대로 태워 컨텍스트 기동을
	// 재현한다 — GeminiHttpApi 생성자는 네트워크를 타지 않으므로 더미 키로 충분(2026-09-03).
	environment 'GEMINI_API_KEY', 'test-dummy-key-no-network-call'
}
