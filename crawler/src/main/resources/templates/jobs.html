<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>celfit crawler — 잡 실행</title>
    <link rel="stylesheet" href="/css/admin.css"/>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="/js/admin.js"></script>
</head>
<body>
<nav th:replace="~{fragments/nav :: nav('jobs')}"></nav>
<main>
<h1>잡 실행</h1>
<div class="flash" th:if="${message}" th:text="${message}"></div>

<div class="job-forms">
    <form method="post" th:action="@{/ui/jobs/discover}">
        <select name="category" data-persist>
            <option value="">전체 카테고리</option>
            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
        </select>
        <button type="submit" class="primary">① discover — 발굴</button>
    </form>
    <form method="post" th:action="@{/ui/jobs/qualify}">
        <label><input type="checkbox" name="requalify" value="true" data-persist/> EXCLUDED 재판정 포함</label>
        <button type="submit" class="primary">② qualify — 프로필·규칙 판정</button>
    </form>
    <form method="post" th:action="@{/ui/jobs/aggregate}">
        <button type="submit" class="primary">③ aggregate — +3일 상세·댓글</button>
    </form>
</div>

<h2>실행 로그</h2>
<div hx-get="/ui/fragments/logs" hx-trigger="load, every 3s"></div>

<h2>최근 실행</h2>
<div hx-get="/ui/fragments/runs" hx-trigger="load, every 5s"></div>
</main>
</body>
</html>
