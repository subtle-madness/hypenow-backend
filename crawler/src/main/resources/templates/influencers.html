<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>celfit crawler — 인플루언서</title>
    <link rel="stylesheet" href="/css/admin.css"/>
    <script src="/js/admin.js"></script>
</head>
<body data-restore-query="true">
<nav th:replace="~{fragments/nav :: nav(${companyView} ? 'companies' : 'influencers')}"></nav>
<main>
<h1 th:text="${companyView} ? '뷰티 회사' : '인플루언서'">인플루언서</h1>
<p class="hint" th:text="${companyView}
    ? '뷰티 회사로 판정된 계정 리스트업 — 수집·유사발굴 대상에서는 제외된다.'
    : '발굴 후 판정까지 끝난 인플루언서 명단 — 판정 전(DISCOVERED)은 대시보드 카운트로만 보인다.'"></p>

<form method="get" th:action="@{/ui/influencers}" class="row status-filter">
    <!-- 전부 해제해도 쿼리가 비지 않게 하는 마커 — 비면 복원 스크립트가 이전 필터로 되돌린다 -->
    <input type="hidden" name="f" value="1"/>
    <input type="hidden" name="company" th:value="${companyView}"/>
    <label class="check" th:each="s : ${statuses}">
        <input type="checkbox" name="status" th:value="${s}"
               th:checked="${status != null && status.contains(s)}"
               onchange="this.form.submit()"/>
        <span class="badge" th:classappend="${s}" th:text="${s}"></span>
    </label>
    <!-- 뷰티 판정 필터 — 회사 리스트업 뷰는 이미 회사 고정이라 숨긴다 -->
    <span class="filter-sep" th:unless="${companyView}"></span>
    <label class="check" th:unless="${companyView}" th:each="bf : ${beautyFilters}">
        <input type="checkbox" name="beauty" th:value="${bf.key()}"
               th:checked="${beauty != null && beauty.contains(bf.key())}"
               onchange="this.form.submit()"/>
        <span class="badge" th:classappend="${bf.badge()}" th:text="${bf.label()}"></span>
    </label>
    <!-- F&B 판정 필터 — 뷰티 필터와 동시 선택 시 뷰티가 이긴다(두 축 교차 조합 미지원) -->
    <span class="filter-sep" th:unless="${companyView}"></span>
    <label class="check" th:unless="${companyView}" th:each="ff : ${fnbFilters}">
        <input type="checkbox" name="fnb" th:value="${ff.key()}"
               th:checked="${fnb != null && fnb.contains(ff.key())}"
               onchange="this.form.submit()"/>
        <span class="badge" th:classappend="${ff.badge()}" th:text="${'F&B: ' + ff.label()}"></span>
    </label>
    <span class="hint">체크 없음 = 판정 완료 전체</span>
</form>

<table class="data">
    <tr><th>id</th><th>username</th><th>상태</th><th>팔로워</th><th>뷰티</th><th>F&amp;B</th>
        <th>발굴 키워드</th><th>발굴일</th><th>최근 수집</th></tr>
    <tr th:each="row : ${page.content}">
        <td th:text="${row.influencer.id}"></td>
        <td><a class="username-link" target="_blank" rel="noopener"
               th:href="'https://www.instagram.com/' + ${row.influencer.username} + '/'"
               th:text="${row.influencer.username}"></a></td>
        <td><span class="badge" th:classappend="${row.influencer.status}"
                 th:text="${row.influencer.status}"></span></td>
        <td th:text="${row.influencer.followers != null ? #numbers.formatInteger(row.influencer.followers, 0, 'COMMA') : '—'}"></td>
        <td th:with="cls=${row.influencer.beautyClass != null ? row.influencer.beautyClass.name() : null}">
            <!-- v3 판정(beauty_class 있음) — 5분류 배지 -->
            <span th:if="${cls != null}" class="badge"
                  th:classappend="${cls == 'INFLUENCER'} ? 'BEAUTY' : (${cls == 'COMPANY'} ? 'BEAUTY_COMPANY' : (${cls == 'BEAUTY_SERVICE'} ? 'BEAUTY_SERVICE' : (${cls == 'FOREIGN_INFLUENCER'} ? 'FOREIGN_INFLUENCER' : 'NOT_BEAUTY')))"
                  th:text="${cls == 'INFLUENCER'} ? '뷰티' : (${cls == 'COMPANY'} ? '뷰티 회사' : (${cls == 'BEAUTY_SERVICE'} ? '시술·서비스' : (${cls == 'FOREIGN_INFLUENCER'} ? '외국인' : '뷰티 아님')))"
                  th:title="${row.influencer.beautyReason}"></span>
            <!-- 구 3분류 시대 판정분(재판정 전 과도기) — boolean 기반 표시 -->
            <span th:if="${cls == null and row.influencer.beauty != null}" class="badge"
                  th:classappend="${row.influencer.beauty} ? (${row.influencer.beautyCompany} ? 'BEAUTY_COMPANY' : 'BEAUTY') : 'NOT_BEAUTY'"
                  th:text="${row.influencer.beauty} ? (${row.influencer.beautyCompany} ? '뷰티 회사(구)' : '뷰티(구)') : '뷰티 아님(구)'"
                  th:title="${row.influencer.beautyReason}"></span>
            <span th:if="${cls == null and row.influencer.beauty == null}">—</span>
            <form method="post" th:action="@{|/ui/influencers/${row.influencer.id}/beauty|}"
                  style="display:inline" th:each="target : ${beautyClasses}"
                  th:unless="${cls == target.name()}">
                <input type="hidden" name="page" th:value="${page.number}"/>
                <input type="hidden" th:each="s : ${status}" name="status" th:value="${s}"/>
                <input type="hidden" th:each="b : ${beauty}" name="beauty" th:value="${b}"/>
                <input type="hidden" th:each="f : ${fnb}" name="fnb" th:value="${f}"/>
                <input type="hidden" name="beautyClass" th:value="${target.name()}"/>
                <button type="submit"
                        th:text="${target.name() == 'INFLUENCER'} ? '뷰티' : (${target.name() == 'COMPANY'} ? '회사' : (${target.name() == 'BEAUTY_SERVICE'} ? '시술' : (${target.name() == 'FOREIGN_INFLUENCER'} ? '외국인' : '아님')))"></button>
            </form>
        </td>
        <td th:with="fcls=${row.influencer.fnbClass != null ? row.influencer.fnbClass.name() : null}">
            <!-- F&B 축 5분류 배지 — 배지 색상 클래스는 뷰티 것 재사용(색 의미 동일) -->
            <span th:if="${fcls != null}" class="badge"
                  th:classappend="${fcls == 'INFLUENCER'} ? 'BEAUTY' : (${fcls == 'COMPANY'} ? 'BEAUTY_COMPANY' : (${fcls == 'SERVICE'} ? 'BEAUTY_SERVICE' : (${fcls == 'FOREIGN_INFLUENCER'} ? 'FOREIGN_INFLUENCER' : 'NOT_BEAUTY')))"
                  th:text="${fcls == 'INFLUENCER'} ? 'F&B' : (${fcls == 'COMPANY'} ? 'F&B 회사' : (${fcls == 'SERVICE'} ? '매장·서비스' : (${fcls == 'FOREIGN_INFLUENCER'} ? 'F&B 외국인' : 'F&B 아님')))"
                  th:title="${row.influencer.fnbReason}"></span>
            <span th:if="${fcls == null}">—</span>
            <form method="post" th:action="@{|/ui/influencers/${row.influencer.id}/fnb|}"
                  style="display:inline" th:each="target : ${fnbClasses}"
                  th:unless="${fcls == target.name()}">
                <input type="hidden" name="page" th:value="${page.number}"/>
                <input type="hidden" th:each="s : ${status}" name="status" th:value="${s}"/>
                <input type="hidden" th:each="b : ${beauty}" name="beauty" th:value="${b}"/>
                <input type="hidden" th:each="f : ${fnb}" name="fnb" th:value="${f}"/>
                <input type="hidden" name="fnbClass" th:value="${target.name()}"/>
                <button type="submit"
                        th:text="${target.name() == 'INFLUENCER'} ? 'F&B' : (${target.name() == 'COMPANY'} ? '회사' : (${target.name() == 'SERVICE'} ? '매장' : (${target.name() == 'FOREIGN_INFLUENCER'} ? '외국인' : '아님')))"></button>
            </form>
        </td>
        <td th:text="${row.discoveredKeyword != null ? row.discoveredKeyword : '—'}"></td>
        <td th:text="${row.discoveredAt != null ? row.discoveredAt : '—'}"></td>
        <td th:text="${row.influencer.lastCollectedAt != null ? row.influencer.lastCollectedAt : '—'}"></td>
    </tr>
</table>
<p class="pager">
    <a th:if="${page.hasPrevious()}"
       th:href="@{/ui/influencers(status=${status}, beauty=${beauty}, fnb=${fnb}, page=${page.number - 1}, company=${companyView})}">이전</a>
    <span th:text="${page.number + 1} + ' / ' + ${page.totalPages}"></span>
    <a th:if="${page.hasNext()}"
       th:href="@{/ui/influencers(status=${status}, beauty=${beauty}, fnb=${fnb}, page=${page.number + 1}, company=${companyView})}">다음</a>
</p>
</main>
</body>
</html>
