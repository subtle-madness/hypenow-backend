<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>celfit crawler — 수집 게시물</title>
    <link rel="stylesheet" href="/css/admin.css"/>
    <script src="/js/admin.js"></script>
</head>
<body data-restore-query="true">
<nav th:replace="~{fragments/nav :: nav('contents')}"></nav>
<main>
<h1>수집 게시물</h1>

<form method="get" th:action="@{/ui/contents}" class="row status-filter">
    <!-- 전부 해제해도 쿼리가 비지 않게 하는 마커 — 비면 복원 스크립트가 이전 필터로 되돌린다 -->
    <input type="hidden" name="f" value="1"/>
    <label class="check" th:each="s : ${statuses}">
        <input type="checkbox" name="status" th:value="${s}"
               th:checked="${status != null && status.contains(s)}"
               onchange="this.form.submit()"/>
        <span class="badge" th:classappend="${s}" th:text="${s}"></span>
    </label>
    <span class="hint">체크 없음 = 전체</span>
</form>

<table class="data">
    <tr><th>id</th><th>short_code</th><th>유형</th><th>인플루언서</th><th>업로드</th>
        <th>상태</th></tr>
    <tr th:each="c : ${page.content}">
        <td><a th:href="@{'/ui/contents/' + ${c.id}}" th:text="${c.id}"></a></td>
        <td th:text="${c.shortCode}"></td>
        <td><span class="badge" th:classappend="${c.contentType}" th:text="${c.contentType}"></span></td>
        <td th:text="${c.ownerUsername}"></td>
        <td th:text="${c.uploadedAt}"></td>
        <td><span class="badge" th:classappend="${c.status}" th:text="${c.status}"></span></td>
    </tr>
</table>
<p class="pager">
    <a th:if="${page.hasPrevious()}"
       th:href="@{/ui/contents(status=${status}, page=${page.number - 1})}">이전</a>
    <span th:text="${page.number + 1} + ' / ' + ${page.totalPages}"></span>
    <a th:if="${page.hasNext()}"
       th:href="@{/ui/contents(status=${status}, page=${page.number + 1})}">다음</a>
</p>
</main>
</body>
</html>
