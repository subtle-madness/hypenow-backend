<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>celfit crawler — 검색 키워드</title>
    <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body>
<nav th:replace="~{fragments/nav :: nav('keywords')}"></nav>
<main>
<h1>검색 키워드</h1>
<div class="flash" th:if="${message}" th:text="${message}"></div>
<p class="hint">discover가 순회하는 해시태그 검색어 목록 — 여기서는 등록만 하고, 수집은
    <a href="/ui">대시보드</a>의 실행 스트립에서 discover를 눌러야 시작돼요.
    "제외"한 키워드는 다음 발굴에서 빠집니다. 키워드 텍스트는 수정할 수 없음(수정 = 삭제 후 재추가).</p>

<div class="card">
    <table class="data fit">
        <tr><th>키워드</th><th>상태</th><th></th></tr>
        <tr th:each="k : ${keywords}">
            <td th:text="${k.keyword}" th:classappend="${k.enabled} ? '' : 'off'"></td>
            <td><span class="badge" th:classappend="${k.enabled} ? 'QUALIFIED' : 'EXCLUDED'"
                      th:text="${k.enabled} ? '포함' : '제외'"></span></td>
            <td>
                <form class="inline" method="post" th:action="@{'/ui/keywords/' + ${k.id} + '/toggle'}">
                    <input type="hidden" name="enabled" th:value="${!k.enabled}"/>
                    <button type="submit" class="kw-toggle"
                            th:text="${k.enabled} ? '제외' : '포함'"
                            th:title="${k.enabled} ? '다음 발굴에서 제외' : '다시 발굴에 포함'"></button>
                </form>
                <form class="inline" method="post" th:action="@{'/ui/keywords/' + ${k.id} + '/delete'}"
                      th:attr="onsubmit=|return confirm('${k.keyword} 키워드를 삭제할까요?')|">
                    <button type="submit" class="danger kw-toggle">삭제</button>
                </form>
            </td>
        </tr>
        <tr th:if="${keywords.isEmpty()}"><td colspan="3" class="hint">등록된 키워드가 없습니다.</td></tr>
    </table>

    <form class="row" method="post" th:action="@{/ui/keywords}">
        <input name="keyword" placeholder="새 검색 키워드 (예: 데일리룩)" required/>
        <button type="submit" class="primary">추가</button>
    </form>
</div>
</main>
</body>
</html>
