<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>celfit crawler — 대시보드</title>
    <link rel="stylesheet" href="/css/admin.css"/>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
<nav th:replace="~{fragments/nav :: nav('dashboard')}"></nav>
<main>
<h1>대시보드</h1>
<!-- 현재 작업 바 (실시간, 2초 폴링) -->
<div hx-get="/ui/fragments/status" hx-trigger="load, every 2s"></div>
<!-- 상태 카드 (실시간, 3초 폴링) -->
<div hx-get="/ui/fragments/status-tiles" hx-trigger="load, every 3s"></div>
<h2>최근 실행</h2>
<div hx-get="/ui/fragments/runs" hx-trigger="load, every 5s"></div>
</main>
</body>
</html>
