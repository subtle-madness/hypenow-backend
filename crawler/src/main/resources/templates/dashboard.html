<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>celfit crawler — 대시보드</title>
    <link rel="stylesheet" href="/css/admin.css"/>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
<nav th:replace="~{fragments/nav :: nav('dashboard')}"></nav>
<main>
<h1>대시보드</h1>
<div class="tiles">
    <div class="tile" th:each="e : ${summary.contentByStatus()}">
        <div class="num" th:text="${e.value}">0</div>
        <div class="label"><span class="badge" th:classappend="${e.key}" th:text="${e.key}">STATUS</span></div>
    </div>
    <div class="tile">
        <div class="num" th:text="${summary.dueForAggregate()}">0</div>
        <div class="label">집계 대기 (+3일 도래)</div>
    </div>
</div>
<h2>raw 적재량</h2>
<div class="tiles sub">
    <div class="tile"><div class="num" th:text="${summary.rawDiscoveryPosts()}">0</div><div class="label">발굴 게시물</div></div>
    <div class="tile"><div class="num" th:text="${summary.rawPostDetails()}">0</div><div class="label">게시물 상세</div></div>
    <div class="tile"><div class="num" th:text="${summary.rawComments()}">0</div><div class="label">댓글</div></div>
    <div class="tile"><div class="num" th:text="${summary.rawProfiles()}">0</div><div class="label">프로필</div></div>
    <div class="tile"><div class="num" th:text="${summary.rawRunItems()}">0</div><div class="label">응답 아카이브</div></div>
</div>
<h2>최근 실행</h2>
<div hx-get="/ui/fragments/runs" hx-trigger="load, every 5s"></div>
</main>
</body>
</html>
