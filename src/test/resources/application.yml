spring:
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

crawler:
  apify:
    token: test-token
    base-url: http://localhost:9999
    poll-interval: 1ms
    run-timeout: 1s
    actor-memory-mb: 1024
  direct-comment:
    proxy-url: ${APIFY_PROXY_URL:}
    request-timeout: 15s
    page-delay: 1s
    comment-doc-id: ${IG_COMMENT_DOC_ID:}
    comment-friendly-name: ${IG_COMMENT_FRIENDLY_NAME:}
  hiker:
    api-key: test-key
    base-url: http://localhost:9999
    request-timeout: 15s
  discover:
    results-limit: 100
  aggregate:
    delay-days: 3
    batch-limit: 200
    chunk-size: 50
    comments-per-post: 50
    max-attempts: 3
  schedule:
    enabled: false
    discover-cron: "0 0 6 * * *"
    qualify-cron: "0 30 6 * * *"
    aggregate-cron: "0 0 7 * * *"
