<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>celfit crawler — 콘텐츠 상세</title>
    <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body>
<nav th:replace="~{fragments/nav :: nav('contents')}"></nav>
<main>
<h1 th:text="'콘텐츠 ' + ${content.shortCode}"></h1>
<table class="data fit">
    <tr><th>유형</th><td><span class="badge" th:classappend="${content.contentType}" th:text="${content.contentType}"></span></td></tr>
    <tr><th>계정</th><td th:text="${content.ownerUsername}"></td></tr>
    <tr><th>업로드</th><td th:text="${content.uploadedAt}"></td></tr>
    <tr><th>상태</th><td><span class="badge" th:classappend="${content.status}" th:text="${content.status}"></span></td></tr>
    <tr th:if="${!taggedUsers.isEmpty()}"><th>태그된 계정</th>
        <td><span class="badge tag" th:each="t : ${taggedUsers}" th:text="${t}"></span></td></tr>
    <tr><th>링크</th><td><a th:href="'https://www.instagram.com/p/' + ${content.shortCode} + '/'"
                            th:text="'instagram.com/p/' + ${content.shortCode}" target="_blank"></a></td></tr>
</table>

<h2>게시물 상세 raw (+3일 확정)</h2>
<pre class="raw" th:if="${detailJson}" th:text="${detailJson}"></pre>
<p class="hint" th:unless="${detailJson}">아직 미수집</p>

<h2>댓글 (최근 100)</h2>
<table class="data" th:if="${!comments.isEmpty()}">
    <tr><th>작성자</th><th>내용</th><th>작성 시각</th></tr>
    <tr th:each="cm : ${comments}">
        <td th:text="${cm.writer}"></td>
        <td th:text="${cm.text}"></td>
        <td th:text="${cm.writtenAt}"></td>
    </tr>
</table>
<p class="hint" th:if="${comments.isEmpty()}">댓글 없음</p>

<h2>작성자 프로필 raw</h2>
<pre class="raw" th:if="${profileJson}" th:text="${profileJson}"></pre>
<p class="hint" th:unless="${profileJson}">아직 미수집</p>
</main>
</body>
</html>
