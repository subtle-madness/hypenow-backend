<div th:fragment="tiles" xmlns:th="http://www.thymeleaf.org">
    <div class="tiles">
        <div class="tile" th:each="e : ${summary.contentByStatus()}">
            <div class="num" th:text="${e.value}">0</div>
            <div class="label"><span class="badge" th:classappend="${e.key}" th:text="${e.key}">STATUS</span></div>
        </div>
        <div class="tile">
            <div class="num" th:text="${summary.dueForAggregate()}">0</div>
            <div class="label">집계 대기 (+3일 도래)</div>
        </div>
    </div>
</div>
