<div th:fragment="tiles" xmlns:th="http://www.thymeleaf.org">
    <h2 class="tiles-head">인플루언서 파이프라인 <span class="tiles-head-sub">발굴 → 판정 → 수집</span></h2>
    <div class="tiles">
        <div class="tile" th:each="t : ${influencerTiles}">
            <div class="num" th:text="${t.count()}">0</div>
            <div class="label"><span class="badge" th:classappend="${t.key()}" th:text="${t.key()}">STATUS</span></div>
            <div class="tile-desc" th:text="${t.desc()}"></div>
        </div>
    </div>
    <h2 class="tiles-head">게시물 수집 <span class="tiles-head-sub">collect 열거 기준 — 첫 방문 <span th:text="${backfillMonths}">6</span>개월치 · 재방문 시 최근 <span th:text="${trackWindowDays}">30</span>일치 (<span th:text="${revisitIntervalDays}">7</span>일 주기 · 설정에서 변경)</span></h2>
    <div class="tiles">
        <div class="tile" th:each="t : ${contentTiles}">
            <div class="num" th:text="${t.count()}">0</div>
            <div class="label"><span class="badge" th:classappend="${t.key()}" th:text="${t.key()}">STATUS</span></div>
            <div class="tile-desc" th:text="${t.desc()}"></div>
        </div>
    </div>
    <p class="job-cost-note">발굴 보관(부산물) <span th:text="${discoveryArchiveCount}">0</span>건 — 수집 대상 아님</p>
</div>
