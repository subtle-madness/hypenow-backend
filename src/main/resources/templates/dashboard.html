<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>celfit crawler — 대시보드</title>
    <link rel="stylesheet" href="/css/admin.css"/>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
<nav th:replace="~{fragments/nav :: nav('dashboard')}"></nav>
<main>
<h1>대시보드</h1>

<h2 class="tiles-head">수집 파이프라인 <span class="tiles-head-sub">발견 → 채택 → 집계</span></h2>
<div class="tiles">
    <div class="tile" th:each="t : ${pipelineTiles}">
        <div class="num" th:text="${t.count()}">0</div>
        <div class="label"><span class="badge" th:classappend="${t.key()}" th:text="${t.key()}">STATUS</span></div>
        <div class="tile-desc" th:text="${t.desc()}"></div>
    </div>
    <div class="tile highlight">
        <div class="num" th:text="${summary.dueForAggregate()}">0</div>
        <div class="label">집계 대기</div>
        <div class="tile-desc">채택됐고 업로드 3일 지나 지금 집계하면 처리될 물량 (QUALIFIED의 부분집합)</div>
    </div>
</div>

<h2 class="tiles-head">제외 · 종료 <span class="tiles-head-sub">파이프라인에서 빠진 것</span></h2>
<div class="tiles">
    <div class="tile" th:each="t : ${droppedTiles}">
        <div class="num" th:text="${t.count()}">0</div>
        <div class="label"><span class="badge" th:classappend="${t.key()}" th:text="${t.key()}">STATUS</span></div>
        <div class="tile-desc" th:text="${t.desc()}"></div>
    </div>
</div>
<h2>raw 적재량</h2>
<div class="tiles sub">
    <div class="tile"><div class="num" th:text="${summary.rawDiscoveryPosts()}">0</div><div class="label">발굴 게시물</div></div>
    <div class="tile"><div class="num" th:text="${summary.rawPostDetails()}">0</div><div class="label">게시물 상세</div></div>
    <div class="tile"><div class="num" th:text="${summary.rawComments()}">0</div><div class="label">댓글</div></div>
    <div class="tile"><div class="num" th:text="${summary.rawProfiles()}">0</div><div class="label">프로필</div></div>
    <div class="tile"><div class="num" th:text="${summary.rawRunItems()}">0</div><div class="label">응답 아카이브</div></div>
</div>
<h2>최근 실행</h2>
<div hx-get="/ui/fragments/runs" hx-trigger="load, every 5s"></div>
</main>
</body>
</html>
