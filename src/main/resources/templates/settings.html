<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>celfit crawler — 설정</title>
    <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body>
<nav th:replace="~{fragments/nav :: nav('settings')}"></nav>
<main>
<h1>런타임 설정</h1>

<section class="card">
    <h2>댓글 수집 방식</h2>
    <form method="post" th:action="@{/ui/comment-source}">
        <label class="check"><input type="radio" name="source" value="ACTOR"
            th:checked="${commentSource == 'ACTOR'}"/> 액터 (Apify)</label>
        <label class="check"><input type="radio" name="source" value="DIRECT"
            th:checked="${commentSource == 'DIRECT'}"/> 자체 크롤 (직접)</label>
        <button type="submit" class="primary">저장</button>
    </form>
    <p class="hint">현재: <b th:text="${commentSource}">ACTOR</b> · 기본값: ACTOR</p>
</section>

<section class="card">
    <h2>프로필 수집 방식</h2>
    <form method="post" th:action="@{/ui/profile-source}">
        <label class="check"><input type="radio" name="source" value="SELF"
            th:checked="${profileSource == 'SELF'}"/> 자체 크롤 (기본)</label>
        <label class="check"><input type="radio" name="source" value="ACTOR"
            th:checked="${profileSource == 'ACTOR'}"/> 액터 (Apify)</label>
        <label class="check"><input type="radio" name="source" value="HIKER_MOBILE"
            th:checked="${profileSource == 'HIKER_MOBILE'}"/> HikerAPI 모바일</label>
        <label class="check"><input type="radio" name="source" value="HIKER_WEB_GQL"
            th:checked="${profileSource == 'HIKER_WEB_GQL'}"/> HikerAPI 웹gql</label>
        <hr/>
        <p class="hint">보충 (SELF·HikerAPI모바일에서만 적용):</p>
        <label class="check"><input type="checkbox" name="posts" value="true"
            th:checked="${profilePosts}"/> 게시물 조회수 채우기 (HikerAPI medias)</label>
        <label class="check"><input type="checkbox" name="related" value="true"
            th:checked="${profileRelated}"/> 관련계정 채우기 (HikerAPI suggested)</label>
        <button type="submit" class="primary">저장</button>
    </form>
    <p class="hint">현재: <b th:text="${profileSource}">SELF</b> · 기본값: SELF</p>
</section>

<section class="card">
    <h2>상세 수집 방식</h2>
    <form method="post" th:action="@{/ui/detail-source}">
        <p class="hint">릴스:</p>
        <label class="check"><input type="radio" name="reels" value="HIKER"
            th:checked="${detailReelsSource == 'HIKER'}"/> HikerAPI (기본·실조회수)</label>
        <label class="check"><input type="radio" name="reels" value="ACTOR"
            th:checked="${detailReelsSource == 'ACTOR'}"/> 액터 (Apify)</label>
        <hr/>
        <p class="hint">피드:</p>
        <label class="check"><input type="radio" name="feed" value="SELF"
            th:checked="${detailFeedSource == 'SELF'}"/> 자체 크롤 (기본·프록시)</label>
        <label class="check"><input type="radio" name="feed" value="ACTOR"
            th:checked="${detailFeedSource == 'ACTOR'}"/> 액터 (Apify)</label>
        <button type="submit" class="primary">저장</button>
    </form>
    <p class="hint">현재: 릴스 <b th:text="${detailReelsSource}">HIKER</b> · 피드 <b th:text="${detailFeedSource}">SELF</b></p>
</section>

<p class="hint">빈칸으로 저장하면 기본값(yml)으로 복귀합니다.</p>
<div class="flash" th:if="${message}" th:text="${message}"></div>

<form method="post" th:action="@{/ui/settings}">
    <table class="data fit">
        <tr><th>키</th><th>오버라이드 값</th><th>기본값</th></tr>
        <tr th:each="s : ${settings}">
            <td th:text="${s.key()}"></td>
            <td>
                <input type="number" th:name="${s.key()}"
                       th:value="${s.overridden()} ? ${s.effective()} : null"/>
            </td>
            <td th:text="${s.defaultValue()}"></td>
        </tr>
    </table>
    <p><button type="submit" class="primary">저장</button></p>
</form>
</main>
</body>
</html>
