spring:
  application:
    name: celfit-crawler
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  threads:
    virtual:
      enabled: true

crawler:
  apify:
    token: ${APIFY_TOKEN:}
    base-url: https://api.apify.com
    poll-interval: 5s
    run-timeout: 10m
    actor-memory-mb: ${APIFY_ACTOR_MEMORY_MB:1024}  # 실행당 메모리(128 배수). 미지정 기본 128MB면 스크래퍼 OOM
  direct-comment:
    proxy-url: ${APIFY_PROXY_URL:}
    request-timeout: 15s
    page-delay: 1s
    comment-doc-id: ${IG_COMMENT_DOC_ID:}
    comment-friendly-name: ${IG_COMMENT_FRIENDLY_NAME:}
  direct-detail:
    # 비로그인 포스트 상세 쿼리(정찰 확정). doc_id는 IG가 주기적으로 교체하므로 env로 덮어쓸 수 있음.
    post-doc-id: ${IG_POST_DOC_ID:27130156389949648}
    post-friendly-name: ${IG_POST_FRIENDLY_NAME:PolarisLoggedOutDesktopWWWPostRootContentQuery}
    page-delay: 1s
  hiker:
    api-key: ${HIKER_API_KEY:}
    base-url: https://api.hikerapi.com
    request-timeout: 15s
  discover:
    results-limit: 100
  qualify:
    batch-limit: 500        # 판정 1회당 처리할 PENDING 콘텐츠 상한(프로필 호출량 제어). 초과분은 다음 실행에서.
  aggregate:
    delay-days: 3
    batch-limit: 200
    chunk-size: 50
    comments-per-post: 50
    max-attempts: 3
  schedule:
    enabled: false
    discover-cron: "0 0 6 * * *"
    qualify-cron: "0 30 6 * * *"
    aggregate-cron: "0 0 7 * * *"
