# dev 스테이징 스택 (태스크 K) — develop 브랜치 검증용. 운영 compose.yaml과 겹쳐 쓴다:
#   docker compose -f compose.yaml -f compose.dev.yaml --profile dev up -d dev-postgres dev-analytics dev-was dev-monitoring
# 파일을 나눈 이유: 이 파일만 dev CD(cd-dev.yml)가 서버로 보낸다 — 운영 서비스 정의는
# main 배포(운영 CD)로만 서버에 도달하므로, develop의 운영 정의 변경이 dev 배포로 먼저
# 발효되거나(뒷문) depends_on 연쇄로 운영 컨테이너가 재생성되는 사고를 구조로 막는다.
# (caddy.d/dev-api.caddy를 본 Caddyfile에서 분리한 것과 같은 원리.)
#
# YAML 앵커는 파일 경계를 못 넘으므로 로그 로테이션 정의를 compose.yaml과 동일하게 복제한다.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # raw는 운영 postgres-raw를 analytics_dev 계정(읽기 전용 + analytics_dev 스키마 소유)으로 공유.
  # 스케줄 전부 off — 잡은 어드민(터널 8083) 수동 트리거만. LLM 자격증명은 운영 공유(소량 수동 전제).
  # profiles: ["dev"]는 유지 — 파일 분리와 이중 가드(실수로 -f 를 겹쳐도 프로파일 없이는 안 뜬다).
  dev-postgres:
    image: postgres:17-alpine
    profiles: ["dev"]
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_DB: analysis
      POSTGRES_USER: ${DEV_DB_USER:-}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:5434:5432"   # 루프백 전용 — 외부 접속은 SSH 터널로만
    volumes:
      - dev-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_DB_USER:-} -d analysis"]
      interval: 10s
      timeout: 5s
      retries: 5

  dev-analytics:
    image: ghcr.io/subtle-madness/hypenow-analytics:develop
    profiles: ["dev"]
    restart: unless-stopped
    logging: *logging
    mem_limit: 1536m
    cpus: 1.0
    environment:
      APP_DATASOURCE_RAW_JDBC_URL: jdbc:postgresql://postgres-raw:5432/crawler
      APP_DATASOURCE_RAW_USERNAME: analytics_dev
      APP_DATASOURCE_RAW_PASSWORD: ${DEV_RAW_DB_PASSWORD:-}
      # dev 뷰·캐시는 analytics_dev 스키마 — 치환 적용(cd-dev)과 짝
      ANALYTICS_RAW_SCHEMA: analytics_dev
      APP_DATASOURCE_ANALYSIS_JDBC_URL: jdbc:postgresql://dev-postgres:5432/analysis
      APP_DATASOURCE_ANALYSIS_USERNAME: ${DEV_DB_USER:-}
      APP_DATASOURCE_ANALYSIS_PASSWORD: ${DEV_DB_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/vertex-sa.json
      ANALYTICS_SCHEDULE_ENABLED: "false"
      # 이미지 아카이브는 dev 대상 아님(운영 버킷 오염 방지) — 빈 값이면 잡이 fail-fast
      ANALYTICS_IMAGE_PAR_URL: ""
      JAVA_OPTS: "-Xms256m -Xmx768m"
    volumes:
      - ./secrets/vertex-sa.json:/secrets/vertex-sa.json:ro
    ports:
      - "127.0.0.1:8083:8082"   # 루프백 전용 — 어드민은 SSH 터널(ssh -L 8083:localhost:8083)
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8082' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    depends_on:
      dev-postgres:
        condition: service_healthy
      postgres-raw:
        condition: service_healthy

  dev-was:
    image: ghcr.io/subtle-madness/hypenow-was:develop
    profiles: ["dev"]
    restart: unless-stopped
    logging: *logging
    mem_limit: 1024m
    cpus: 1.0
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://dev-postgres:5432/analysis
      DB_USER: ${DEV_DB_USER:-}
      DB_PASSWORD: ${DEV_DB_PASSWORD:-}
      # RESEND 미설정 = 로깅 폴백 — dev 이메일 인증 코드는 docker logs deploy-dev-was-1 에서 확인
      CODES_API_KEY: ${DEV_CODES_API_KEY:-}
      JAVA_OPTS: "-Xms512m -Xmx512m"
    # dev-monitoring 명령 API의 유일한 클라이언트 — dev 전용 네트워크에 함께 소속(하단 networks 주석).
    # default를 반드시 같이 적는다 — networks를 선언하는 순간 암묵적 default 소속이 사라져
    # dev-postgres·postgres-raw 이름 해석이 끊긴다.
    networks: [default, dev-monitoring-net]
    # 기동 순서는 운영과 동일 규율 — dev-analytics healthy(=dev analysis DB 마이그레이션 완료) 후
    depends_on:
      dev-postgres:
        condition: service_healthy
      dev-analytics:
        condition: service_healthy

  # dev 모니터링 — dev-postgres 안의 사설 monitoring DB. 호스트 포트 미노출(운영과 동일 관용구,
  # 어드민 UI 없음). 스윕 크론 미설정 = 기본값 "-" = off(K 원칙 "dev 스케줄 전부 off") —
  # 등록 시 동기 수집만 동작한다. Hiker 키는 운영 공유라 등록 테스트는 소량 전제.
  dev-monitoring:
    image: ghcr.io/subtle-madness/hypenow-monitoring:develop
    profiles: ["dev"]
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    cpus: 0.5
    networks: [default, dev-monitoring-net]   # default는 dev-postgres 접속용
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://dev-postgres:5432/monitoring
      SPRING_DATASOURCE_USERNAME: monitoring
      SPRING_DATASOURCE_PASSWORD: ${DEV_MONITORING_DB_PASSWORD:-}
      HIKER_API_KEY: ${HIKER_API_KEY:-}
      JAVA_OPTS: "-Xms128m -Xmx256m"
    # 8083 리슨 = Spring 기동 완료 = monitoring DB Flyway 마이그레이션 적용 완료 신호.
    # 이미지에 curl이 없어 bash /dev/tcp로 확인(운영 monitoring과 동일 관용구).
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8083' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    depends_on:
      dev-postgres:
        condition: service_healthy

volumes:
  dev-pg-data:

networks:
  # dev-was ↔ dev-monitoring 전용 — 운영 monitoring-net(compose.yaml)과 이름이 다르므로
  # 두 파일을 겹쳐 써도 병합 충돌이 없고, 서로의 명령 API에 닿지도 않는다(상호 불가침).
  # dev 컨테이너는 운영 monitoring 호스트명 해석부터 실패 = 오배선 fail-closed.
  dev-monitoring-net: {}
