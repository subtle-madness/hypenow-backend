# test 스테이징 스택 (태스크 K, 07-29 test 리네임·staging 전환) — staging 브랜치 검증용.
# 운영 compose.yaml과 겹쳐 쓴다:
#   docker compose -f compose.yaml -f compose.test.yaml --profile test up -d test-postgres test-redis test-analytics test-was test-monitoring
# 파일을 나눈 이유: 이 파일만 test CD(cd-test.yml)가 서버로 보낸다 — 운영 서비스 정의는
# main 배포(운영 CD)로만 서버에 도달하므로, staging의 운영 정의 변경이 test 배포로 먼저
# 발효되거나(뒷문) depends_on 연쇄로 운영 컨테이너가 재생성되는 사고를 구조로 막는다.
# (caddy.d/test-api.caddy를 본 Caddyfile에서 분리한 것과 같은 원리.)
#
# 네트워크: test 서비스는 test 브리지에만 소속(선언은 compose.yaml — main 배포 공급) —
# 운영 postgres·analytics·crawler로 가는 경로가 커널 수준에서 차단된다. 운영과의 공유
# 접점은 postgres-raw(양쪽 소속, analytics_dev 읽기 전용)와 caddy(도메인 분기)뿐.
# 예외로 test-monitoring-net(이 파일 하단 선언)은 test-was↔test-monitoring 전용 —
# test 안에서만 닫혀 있어 격리를 깨지 않는다.
#
# YAML 앵커는 파일 경계를 못 넘으므로 로그 로테이션 정의를 compose.yaml과 동일하게 복제한다.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # raw는 운영 postgres-raw를 analytics_dev 계정(읽기 전용 + analytics_dev 스키마 소유)으로 공유.
  # 스케줄 전부 off — 잡은 어드민(터널 8083) 수동 트리거만. LLM 자격증명은 운영 공유(소량 수동 전제).
  # profiles: ["test"]는 유지 — 파일 분리와 이중 가드(실수로 -f 를 겹쳐도 프로파일 없이는 안 뜬다).
  # 데이터 볼륨은 구 명칭 dev-pg-data 그대로 — 리네임하면 test DB 데이터가 유실된다(의도적 예외).
  test-postgres:
    image: postgres:17-alpine
    profiles: ["test"]
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    # 호스트 OOM 희생 순서 최우선(+800) — 스테이징은 죽어도 무해, 운영 압박 시 제일 먼저
    # 비켜준다(전 test 서비스 동일. 정책 전체는 compose.yaml 상단 "메모리 격리" 주석).
    oom_score_adj: 800
    cpus: 1.0
    networks: [test]
    environment:
      POSTGRES_DB: analysis
      POSTGRES_USER: ${DEV_DB_USER:-}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:5434:5432"   # 루프백 전용 — 외부 접속은 SSH 터널로만
    volumes:
      - dev-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_DB_USER:-} -d analysis"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-analytics:
    image: ghcr.io/subtle-madness/hypenow-analytics:staging
    profiles: ["test"]
    restart: unless-stopped
    logging: *logging
    mem_limit: 1536m
    oom_score_adj: 800
    cpus: 1.0
    networks: [test]
    environment:
      APP_DATASOURCE_RAW_JDBC_URL: jdbc:postgresql://postgres-raw:5432/crawler
      APP_DATASOURCE_RAW_USERNAME: analytics_dev
      APP_DATASOURCE_RAW_PASSWORD: ${DEV_RAW_DB_PASSWORD:-}
      # test 뷰·캐시는 analytics_dev 스키마 — 치환 적용(cd-test)과 짝
      ANALYTICS_RAW_SCHEMA: analytics_dev
      APP_DATASOURCE_ANALYSIS_JDBC_URL: jdbc:postgresql://test-postgres:5432/analysis
      APP_DATASOURCE_ANALYSIS_USERNAME: ${DEV_DB_USER:-}
      APP_DATASOURCE_ANALYSIS_PASSWORD: ${DEV_DB_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/vertex-sa.json
      ANALYTICS_SCHEDULE_ENABLED: "false"
      # 이미지 아카이브는 test 대상 아님(운영 버킷 오염 방지) — 빈 값이면 잡이 fail-fast
      ANALYTICS_IMAGE_PAR_URL: ""
      # OOM 자동 힙 덤프(08-27 스펙) — 운영 analytics 주석 참조, test는 test-* 파일명으로 구분
      JAVA_OPTS: "-Xms256m -Xmx768m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps/test-analytics.hprof"
    volumes:
      - ./secrets/vertex-sa.json:/secrets/vertex-sa.json:ro
      - ./dumps:/dumps
    ports:
      - "127.0.0.1:8083:8082"   # 루프백 전용 — 어드민은 SSH 터널(ssh -L 8083:localhost:8083)
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8082' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    depends_on:
      test-postgres:
        condition: service_healthy
      postgres-raw:
        condition: service_healthy

  test-redis:
    image: redis:7-alpine
    profiles: ["test"]
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m   # maxmemory 128mb + fork 여유 — test 스택에서 유일하게 상한이 없었다(08-04)
    oom_score_adj: 800
    networks: [test]
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

  test-was:
    image: ghcr.io/subtle-madness/hypenow-was:staging
    profiles: ["test"]
    restart: unless-stopped
    logging: *logging
    mem_limit: 1024m
    oom_score_adj: 800
    cpus: 1.0
    # test-monitoring 명령 API의 유일한 클라이언트 — test 전용 네트워크에 함께 소속(하단 networks 주석).
    # test 브리지를 반드시 같이 적는다 — 빠지면 test-postgres·test-analytics 이름 해석이 끊긴다.
    networks: [test, test-monitoring-net]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://test-postgres:5432/analysis
      DB_USER: ${DEV_DB_USER:-}
      DB_PASSWORD: ${DEV_DB_PASSWORD:-}
      # 메일: admin 계정만 실발송(08-12) — test DB에 실사용자 이메일이 있어 전원 실발송 금지.
      # 일반 계정 인증코드는 종전대로 docker logs deploy-test-was-1 에서 확인.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      WEB_BASE_URL: ${DEV_WEB_BASE_URL:-https://dev.hypenow.io}   # 주간 리포트 메일 딥링크 기준 주소(스테이징)
      # 개인정보 봉투 암호화(트랙 A, deploy/README.md §6-3) — 운영 compose.yaml was 블록과 동일
      # 관용구(KEK·endpoint는 비밀 아닌 식별자, IAM이 접근 통제). test-postgres의 app DB는
      # 운영과 별개 DB라 DEK도 최초 기동 시 독립적으로 자동 부트스트랩된다(환경별 DEK 분리).
      CRYPTO_MODE: vault
      CRYPTO_KEK_OCID: ocid1.key.oc1.ap-tokyo-1.ezvjprllaacng.abxhiljrxoa5bwu432rpge634dplnahnnwguxfca7dwwudwuzlm3chw72x6a
      CRYPTO_CRYPTO_ENDPOINT: https://ezvjprllaacng-crypto.kms.ap-tokyo-1.oraclecloud.com
      # 주간 다이제스트 생성·발송 크론(README §13-5-3) — 운영과 동일 관용구, DEV_* 오버라이드
      MONITORING_DIGEST_WEEKLY_CRON: "${DEV_MONITORING_DIGEST_WEEKLY_CRON:-0 0 9 * * MON}"
      MONITORING_DIGEST_WEEKLY_CATCHUP_CRON: "${DEV_MONITORING_DIGEST_WEEKLY_CATCHUP_CRON:-0 10,20,30,40,50 9-23 * * *}"
      WAS_MAIL_ADMIN_ONLY: "true"
      CODES_API_KEY: ${DEV_CODES_API_KEY:-}
      REDIS_HOST: test-redis
      # 모니터링 v3 조회 개통 — 운영과 동일 관용구, 기본 off. test-monitoring이 쓰는 test-postgres의
      # monitoring DB를 was_reader 읽기 전용 계정으로(계정 이름은 운영과 동일, 비밀번호만 DEV_* 구명)
      MONITORING_ENABLED: "${DEV_MONITORING_ENABLED:-false}"
      # 광고 표기 판정 FE 노출 개통(08-19) — 운영과 동일 개통, false로 내리면 즉시 중립값(킬 스위치)
      AD_DISCLOSURE_EXPOSE: "${DEV_AD_DISCLOSURE_EXPOSE:-true}"
      # 명령 API도 test 스택으로 — 기본값(http://monitoring:8083)은 운영 이름이라 test에선 DNS 해석 실패(fail-closed)
      MONITORING_API_BASE_URL: http://test-monitoring:8083
      MONITORING_DATASOURCE_URL: jdbc:postgresql://test-postgres:5432/monitoring
      MONITORING_DATASOURCE_USERNAME: was_reader
      MONITORING_DATASOURCE_PASSWORD: ${DEV_WAS_READER_PASSWORD:-}
      # 브랜드 AI 어시스턴트 - 운영 compose.yaml was 블록과 동일 구성(스테이징 스모크용). 끄려면 DEV_BRAND_AI_ENABLED=false.
      BRAND_AI_ENABLED: "${DEV_BRAND_AI_ENABLED:-true}"
      BRAND_AI_VERTEX_PROJECT: ${DEV_BRAND_AI_VERTEX_PROJECT:-project-00d0f3bd-bdef-4b0a-9eb}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/vertex-sa.json
      # OOM 자동 힙 덤프 — 운영 analytics 주석 참조
      JAVA_OPTS: "-Xms512m -Xmx512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps/test-was.hprof"
    volumes:
      - ./dumps:/dumps
      - ./secrets/vertex-sa.json:/secrets/vertex-sa.json:ro
    # 기동 순서는 운영과 동일 규율 — test-analytics healthy(=test analysis DB 마이그레이션 완료) 후
    depends_on:
      test-postgres:
        condition: service_healthy
      test-analytics:
        condition: service_healthy

  # test 모니터링 — test-postgres 안의 사설 monitoring DB. 호스트 포트 미노출(운영과 동일 관용구,
  # 어드민 UI 없음). 스윕 크론 미설정 = 기본값 "-" = off(K 원칙 "test 스케줄 전부 off") —
  # 등록 시 동기 수집만 동작한다. Hiker 키는 운영 공유라 등록 테스트는 소량 전제.
  # env 변수명은 DEV_* 관용구 유지(서버 .env 무변경 — 리네임의 의도적 예외).
  test-monitoring:
    image: ghcr.io/subtle-madness/hypenow-monitoring:staging
    profiles: ["test"]
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    oom_score_adj: 800
    cpus: 0.5
    networks: [test, test-monitoring-net]   # test 브리지는 test-postgres 접속용
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://test-postgres:5432/monitoring
      SPRING_DATASOURCE_USERNAME: monitoring
      SPRING_DATASOURCE_PASSWORD: ${DEV_MONITORING_DB_PASSWORD:-}
      HIKER_API_KEY: ${HIKER_API_KEY:-}
      # 자체크롤(instagram-source) 프록시·댓글 doc_id — 운영 monitoring과 동일 배선(crawler와 .env 키 공유).
      # 프록시 미주입이면 IgSourceSettings 가드가 self를 강제 비활성(fail-safe)해 staging 스모크가 불가능하다.
      # 개통 여부는 app_setting 런타임 토글(ig-source.self-enabled 등)이 관장 — 기본 off라 배선만으론 미개통.
      DATAIMPULSE_RESIDENTIAL_PROXY_URL: ${DATAIMPULSE_RESIDENTIAL_PROXY_URL:-}
      DATAIMPULSE_MOBILE_PROXY_URL: ${DATAIMPULSE_MOBILE_PROXY_URL:-}
      IG_COMMENT_DOC_ID: ${IG_COMMENT_DOC_ID:-}
      IG_COMMENT_FRIENDLY_NAME: ${IG_COMMENT_FRIENDLY_NAME:-}
      # 해시태그 감지 LLM 판정(BrandMentionJudge) — 미주입이면 fail-closed(전 판정 UNCERTAIN=비노출)라
      # 스테이징에서 LLM 경로가 한 번도 실행되지 않는다. 요청 셰이프·응답 파싱 첫 실증을 운영으로
      # 미루지 않기 위해 배선(2026-08-11 최종 리뷰 I-4). 크론은 K 원칙대로 off라 콜 폭주 없음.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Vertex SA 키(2026-08-18 전환) — test-analytics와 같은 파일·같은 경로 재사용. 프로젝트는
      # 운영과 같은 신규 프로젝트를 기본값으로 둔다(test 전용 GCP 프로젝트가 없다는 전제 —
      # analytics도 test/운영이 같은 SA 파일을 쓴다, PR 보고 참조). 구 프로젝트 hypenow-llm-prod는
      # 2026-08-31 billing 중단(전 호출 403 BILLING_DISABLED) — 운영 compose.yaml은 50ceba36에서
      # 전환됐으나 이 파일이 빠져 test 스택 광고 표기 판정이 09-03까지 전건 실패했다(ad_verdict NULL 고정).
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/vertex-sa.json
      MONITORING_LLM_VERTEX_PROJECT: ${MONITORING_LLM_VERTEX_PROJECT:-project-00d0f3bd-bdef-4b0a-9eb}
      MONITORING_LLM_VERTEX_LOCATION: ${MONITORING_LLM_VERTEX_LOCATION:-global}
      # 이미지 아카이브는 test 대상 아님(운영 버킷 오염 방지) — analytics와 동일하게 빈 값이면 잡이 no-op
      MONITORING_IMAGE_PAR_URL: ""
      # 감지 동작 검증용 — 운영(compose.yaml)에는 넣지 않는다. POST /api/sweeps는 등록 계정 수만큼
      # Hiker 콜을 내는 증폭 지점이라 기본 off(application.yml manual-trigger-enabled: false)인데,
      # test는 크론이 꺼져 있어(K 원칙) 수동 트리거 없이는 스윕 동작을 검증할 방법이 없다.
      MONITORING_SWEEP_MANUAL_TRIGGER_ENABLED: "true"
      # 만료 CDN 프로필 이미지 재수집 백필 검증용(2026-08-25) — 운영(compose.yaml)에는 넣지 않는다.
      # POST /api/author-image-backfill은 대상 수만큼 Hiker 재조회 콜 + 직후 아카이브 다운로드·업로드까지
      # 내는 증폭 지점이라 기본 off(application.yml image.backfill-trigger-enabled: false)인데, 위
      # MONITORING_IMAGE_PAR_URL이 빈 값이라 아카이브 단계는 test에서도 no-op(운영 버킷 오염 방지) —
      # 이 트리거는 Hiker 재조회·DB 갱신 동작만 검증한다.
      MONITORING_IMAGE_BACKFILL_TRIGGER_ENABLED: "true"
      # 스윕 크론은 K 원칙(test 스케줄 전부 off)대로 미설정 유지 — v3 개통 검증 시에는 아래를 임시로
      # 근접 시각(UTC)으로 넣어 1회 실행(sweep_run 시드)한 뒤 제거·재기동한다(README §13-6).
      # MONITORING_SCHEDULE_SWEEP_CRON: "0 <mm> <HH> * * *"
      # 브랜드 태그 스윕도 동일 원칙 — test는 크론 off, 검증은 임시 근접 시각 1회 후 제거.
      # MONITORING_BRAND_SCHEDULE_SWEEP_CRON: "0 <mm> <HH> * * *"
      # 알람 메일 발송은 2026-08-27 주간 개편으로 was(주간 리포트)로 이관됐다 - monitoring은 alarm_event 적재만 한다.
      # ExitOnOOM은 운영과 동일 관용구(08-12) — test는 데이터가 작아 힙 상향은 미적용.
      # OOM 자동 힙 덤프 — 운영 analytics 주석 참조. ExitOnOOM과 공존(덤프를 먼저 쓰고 종료).
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps/test-monitoring.hprof"
    volumes:
      - ./secrets/vertex-sa.json:/secrets/vertex-sa.json:ro
      - ./dumps:/dumps
    # 8083 리슨 = Spring 기동 완료 = monitoring DB Flyway 마이그레이션 적용 완료 신호.
    # 이미지에 curl이 없어 bash /dev/tcp로 확인(운영 monitoring과 동일 관용구).
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8083' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    depends_on:
      test-postgres:
        condition: service_healthy

volumes:
  dev-pg-data:

networks:
  # test-was ↔ test-monitoring 전용 — 운영 monitoring-net(compose.yaml)과 이름이 다르므로
  # 두 파일을 겹쳐 써도 병합 충돌이 없고, 서로의 명령 API에 닿지도 않는다(상호 불가침).
  # test 컨테이너는 운영 monitoring 호스트명 해석부터 실패 = 오배선 fail-closed.
  # 선언이 이 파일에 있는 이유는 test 전용이기 때문 — test CD만으로 자족한다.
  test-monitoring-net: {}
