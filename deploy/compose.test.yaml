# test 스테이징 스택 (태스크 K, 07-29 test 리네임·staging 전환) — staging 브랜치 검증용.
# 운영 compose.yaml과 겹쳐 쓴다:
#   docker compose -f compose.yaml -f compose.test.yaml --profile test up -d test-postgres test-analytics test-was
# 파일을 나눈 이유: 이 파일만 test CD(cd-test.yml)가 서버로 보낸다 — 운영 서비스 정의는
# main 배포(운영 CD)로만 서버에 도달하므로, staging의 운영 정의 변경이 test 배포로 먼저
# 발효되거나(뒷문) depends_on 연쇄로 운영 컨테이너가 재생성되는 사고를 구조로 막는다.
# (caddy.d/test-api.caddy를 본 Caddyfile에서 분리한 것과 같은 원리.)
#
# 네트워크: test 서비스는 test 브리지에만 소속(선언은 compose.yaml — main 배포 공급) —
# 운영 postgres·analytics·crawler로 가는 경로가 커널 수준에서 차단된다. 운영과의 공유
# 접점은 postgres-raw(양쪽 소속, analytics_dev 읽기 전용)와 caddy(도메인 분기)뿐.
#
# YAML 앵커는 파일 경계를 못 넘으므로 로그 로테이션 정의를 compose.yaml과 동일하게 복제한다.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # raw는 운영 postgres-raw를 analytics_dev 계정(읽기 전용 + analytics_dev 스키마 소유)으로 공유.
  # 스케줄 전부 off — 잡은 어드민(터널 8083) 수동 트리거만. LLM 자격증명은 운영 공유(소량 수동 전제).
  # profiles: ["test"]는 유지 — 파일 분리와 이중 가드(실수로 -f 를 겹쳐도 프로파일 없이는 안 뜬다).
  # 데이터 볼륨은 구 명칭 dev-pg-data 그대로 — 리네임하면 test DB 데이터가 유실된다(의도적 예외).
  test-postgres:
    image: postgres:17-alpine
    profiles: ["test"]
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    cpus: 1.0
    networks: [test]
    environment:
      POSTGRES_DB: analysis
      POSTGRES_USER: ${DEV_DB_USER:-}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:5434:5432"   # 루프백 전용 — 외부 접속은 SSH 터널로만
    volumes:
      - dev-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_DB_USER:-} -d analysis"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-analytics:
    image: ghcr.io/subtle-madness/hypenow-analytics:staging
    profiles: ["test"]
    restart: unless-stopped
    logging: *logging
    mem_limit: 1536m
    cpus: 1.0
    networks: [test]
    environment:
      APP_DATASOURCE_RAW_JDBC_URL: jdbc:postgresql://postgres-raw:5432/crawler
      APP_DATASOURCE_RAW_USERNAME: analytics_dev
      APP_DATASOURCE_RAW_PASSWORD: ${DEV_RAW_DB_PASSWORD:-}
      # test 뷰·캐시는 analytics_dev 스키마 — 치환 적용(cd-test)과 짝
      ANALYTICS_RAW_SCHEMA: analytics_dev
      APP_DATASOURCE_ANALYSIS_JDBC_URL: jdbc:postgresql://test-postgres:5432/analysis
      APP_DATASOURCE_ANALYSIS_USERNAME: ${DEV_DB_USER:-}
      APP_DATASOURCE_ANALYSIS_PASSWORD: ${DEV_DB_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/vertex-sa.json
      ANALYTICS_SCHEDULE_ENABLED: "false"
      # 이미지 아카이브는 test 대상 아님(운영 버킷 오염 방지) — 빈 값이면 잡이 fail-fast
      ANALYTICS_IMAGE_PAR_URL: ""
      JAVA_OPTS: "-Xms256m -Xmx768m"
    volumes:
      - ./secrets/vertex-sa.json:/secrets/vertex-sa.json:ro
    ports:
      - "127.0.0.1:8083:8082"   # 루프백 전용 — 어드민은 SSH 터널(ssh -L 8083:localhost:8083)
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8082' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    depends_on:
      test-postgres:
        condition: service_healthy
      postgres-raw:
        condition: service_healthy

  test-was:
    image: ghcr.io/subtle-madness/hypenow-was:staging
    profiles: ["test"]
    restart: unless-stopped
    logging: *logging
    mem_limit: 1024m
    cpus: 1.0
    networks: [test]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://test-postgres:5432/analysis
      DB_USER: ${DEV_DB_USER:-}
      DB_PASSWORD: ${DEV_DB_PASSWORD:-}
      # RESEND 미설정 = 로깅 폴백 — test 이메일 인증 코드는 docker logs deploy-test-was-1 에서 확인
      CODES_API_KEY: ${DEV_CODES_API_KEY:-}
      JAVA_OPTS: "-Xms512m -Xmx512m"
    # 기동 순서는 운영과 동일 규율 — test-analytics healthy(=test analysis DB 마이그레이션 완료) 후
    depends_on:
      test-postgres:
        condition: service_healthy
      test-analytics:
        condition: service_healthy

volumes:
  dev-pg-data:
