# 운영 스택 — 오라클 A1이든 폴백 VPS든 동일 (사용법: deploy/README.md)
# 로그 로테이션 — 미설정 시 json 로그가 무한 증식해 디스크를 침식한다
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 네트워크 분리 (07-29) — 운영(prod)과 test 스테이징(test)을 브리지로 격리해 test→운영
# 경로를 커널(iptables) 수준에서 차단한다. 커스텀 네트워크 선언 시 compose 기본 네트워크가
# 사라지므로 모든 서비스에 networks: 명시 필수(누락 = 통신 고립). 의도된 공유 접점 둘만
# 양쪽 소속: caddy(운영·test 도메인 라우팅), postgres-raw(test-analytics의 raw 읽기 —
# analytics_dev 읽기 전용 계정). test 서비스 정의는 compose.test.yaml 참조.
#
# monitoring-net은 prod 안의 한 겹 더 좁은 통제 — 명령 API 접근을 was↔monitoring으로
# 한정한다(스펙 결정 11). 토큰 없음: 이 네트워크 미소속 컨테이너(test 스택 포함)는
# monitoring 호스트명 해석부터 실패한다. test 대응물은 compose.test.yaml의 test-monitoring-net.
networks:
  prod:
  test:
  monitoring-net:

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    networks: [prod]
    environment:
      POSTGRES_DB: analysis
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"   # 루프백 전용 — 외부 접속은 SSH 터널로만
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d analysis"]
      interval: 10s
      timeout: 5s
      retries: 5

  # raw DB — 분석 잡(일회성 analytics 실행)의 읽기 소스. was는 접근 금지(시스템 경계).
  postgres-raw:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    networks: [prod, test]   # test-analytics가 analytics_dev 계정으로 raw를 읽는다 — 의도된 공유 접점
    environment:
      POSTGRES_DB: crawler
      POSTGRES_USER: ${RAW_DB_USER}
      POSTGRES_PASSWORD: ${RAW_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"   # 루프백 전용 — 로컬 5433 컨벤션과 동일 포트
    volumes:
      - pg-raw-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAW_DB_USER} -d crawler"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 분석 상주 서버(8082 어드민 /ui) — raw(postgres-raw) 읽기 → analysis(postgres) 쓰기.
  # 외부 미노출(루프백) — 어드민 접근은 SSH 터널(ssh -L 8082:localhost:8082).
  # LLM: app_setting analytics.llm-provider로 선택 — gemini(무료 키) | vertex(SA 키, 07-20 전환).
  analytics:
    image: ghcr.io/subtle-madness/hypenow-analytics:latest
    restart: unless-stopped
    logging: *logging
    networks: [prod]
    environment:
      APP_DATASOURCE_RAW_JDBC_URL: jdbc:postgresql://postgres-raw:5432/crawler
      APP_DATASOURCE_RAW_USERNAME: ${RAW_DB_USER}
      APP_DATASOURCE_RAW_PASSWORD: ${RAW_DB_PASSWORD}
      APP_DATASOURCE_ANALYSIS_JDBC_URL: jdbc:postgresql://postgres:5432/analysis
      APP_DATASOURCE_ANALYSIS_USERNAME: ${DB_USER}
      APP_DATASOURCE_ANALYSIS_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Vertex SA 키 — provider=vertex일 때만 읽힘(빈 생성 시점), 파일은 secrets/ 볼륨
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/vertex-sa.json
      # 스케줄(KST=UTC+9): 미러 04:30 → 아카이브 04:50 → 분석 05:00 → 백필 06:00 → 계정 카피 07:00 (백업 04:10 이후)
      ANALYTICS_SCHEDULE_ENABLED: "true"
      ANALYTICS_SCHEDULE_MIRROR_CRON: "0 30 19 * * *"
      ANALYTICS_SCHEDULE_ARCHIVE_CRON: "0 50 19 * * *"
      ANALYTICS_SCHEDULE_ANALYZE_CRON: "0 0 20 * * *"
      # 늦크롤 백필 — timely와 예산 독립(2026-07-23 분리). 신규 계정 온보딩 백카탈로그가 주 대상
      ANALYTICS_SCHEDULE_LATE_BACKFILL_ANALYZE_CRON: "0 0 21 * * *"
      ANALYTICS_SCHEDULE_ACCOUNT_ANALYZE_CRON: "0 0 22 * * *"
      ANALYTICS_IMAGE_PAR_URL: ${ANALYTICS_IMAGE_PAR_URL}
      JAVA_OPTS: "-Xms256m -Xmx768m"
    volumes:
      - ./secrets/vertex-sa.json:/secrets/vertex-sa.json:ro
    ports:
      - "127.0.0.1:8082:8082"   # 루프백 전용 — 어드민은 SSH 터널로만
    # 8082 리슨 = Spring 기동 완료 = analysis DB Flyway 마이그레이션 적용 완료 신호.
    # 이미지에 curl이 없어 bash /dev/tcp로 확인. start_period는 마이그레이션(백필 포함) 여유.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8082' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      postgres-raw:
        condition: service_healthy

  # 수집 상주 서버(8080 어드민 /ui) — raw(postgres-raw)에 쓰기.
  # 외부 미노출(루프백) — 접근은 SSH 터널(ssh -L 8080:localhost:8080).
  # 데일리 스케줄 자동(아래 CRAWLER_SCHEDULE_*) — 발굴(discover·similar)만 어드민 UI 수동 트리거.
  crawler:
    image: ghcr.io/subtle-madness/hypenow-crawler:latest
    restart: unless-stopped
    logging: *logging
    networks: [prod]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-raw:5432/crawler
      SPRING_DATASOURCE_USERNAME: ${RAW_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${RAW_DB_PASSWORD}
      APIFY_TOKEN: ${APIFY_TOKEN}
      HIKER_API_KEY: ${HIKER_API_KEY:-}
      DATALIKERS_API_KEY: ${DATALIKERS_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Claude 뷰티 판정(claude-api 전환 대비) — OAuth 토큰만, ANTHROPIC_API_KEY는 서버에 두지 않는다
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      APIFY_PROXY_URL: ${APIFY_PROXY_URL:-}
      DATAIMPULSE_RESIDENTIAL_PROXY_URL: ${DATAIMPULSE_RESIDENTIAL_PROXY_URL:-}
      DATAIMPULSE_MOBILE_PROXY_URL: ${DATAIMPULSE_MOBILE_PROXY_URL:-}
      # 크롬 익스텐션 수동 발굴 등록 API 토큰 — 미설정 시 해당 API 비활성(fail-closed)
      MANUAL_DISCOVERY_TOKEN: ${MANUAL_DISCOVERY_TOKEN:-}
      # 스케줄(KST=UTC+9) — 윈도우 반복 발사: 잡들이 "남은 대상만" 선정하므로(재방문 컷오프·
      # DISCOVERED/미판정 잔여) 반복이 안전하고, 일시 실패·컨테이너 재기동을 윈도우 안에서 흡수한다.
      # collect 01:00~03:30/30분 · reels 01:10~03:55/15분 · qualify 02:00~03:30/30분 · beauty 03:00·03:30
      # → analytics 미러 04:30 전에 완결(같은 날 새벽 분석·아카이브 반영). 발굴(discover·similar)은 수동.
      CRAWLER_SCHEDULE_ENABLED: "true"
      CRAWLER_SCHEDULE_COLLECT_CRON: "0 0/30 16-18 * * *"
      CRAWLER_SCHEDULE_REELS_CRON: "0 10/15 16-18 * * *"
      CRAWLER_SCHEDULE_QUALIFY_CRON: "0 0/30 17-18 * * *"
      CRAWLER_SCHEDULE_BEAUTY_CRON: "0 0,30 18 * * *"
      CRAWLER_SCHEDULE_DISCOVER_CRON: "-"
      JAVA_OPTS: "-Xmx1g"
    ports:
      - "127.0.0.1:8080:8080"   # 루프백 전용 — 어드민은 SSH 터널로만
    depends_on:
      postgres-raw:
        condition: service_healthy

  # was 조회 캐시 전용(세션 아님) — 휘발 허용(재시작=콜드 캐시), AOF·볼륨 없음 (스펙 §3).
  # was가 REDIS_HOST=redis로 접속. depends_on 없음 — redis 불능이어도 was는 DB 직행(fail-open).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    networks: [prod]   # 커스텀 네트워크 체제 — 누락 시 was에서 도달 불가(조용한 캐시 미스 fail-open이라 증상도 안 보인다)
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  was:
    image: ghcr.io/subtle-madness/hypenow-was:latest
    restart: unless-stopped
    logging: *logging
    # prod는 postgres·redis·analytics 접속용, monitoring-net은 monitoring 명령 API 전용
    # (was가 그 유일한 클라이언트 — 상단 networks 주석).
    networks: [prod, monitoring-net]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/analysis
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      # 이메일 인증 발송(Resend) — 서버 .env에 등록. 미설정 시 로깅 폴백(기동 WARN, 실발송 없음)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # 어드민 가입 코드 일괄 적재(POST /admin/signup-codes) 정적 토큰 — 서버 .env에 등록. 미설정 시 엔드포인트 fail-closed(503)
      CODES_API_KEY: ${CODES_API_KEY:-}
      # 모니터링 v3 조회 개통(was 계약 §1) — 기본 off. 개통은 .env의 MONITORING_ENABLED=true +
      # WAS_READER_PASSWORD 설정(README §13-6). false면 MonitoringConfig 자체가 안 뜬다(부가 서브시스템 무영향).
      MONITORING_ENABLED: "${MONITORING_ENABLED:-false}"
      # monitoring 사설 DB(postgres 인스턴스 내 monitoring DB)를 읽기 전용 계정으로 — 객체 GRANT는
      # monitoring Flyway(V2)가 소유자로서 부여, was_reader에는 접속 권한만(db/init/02 참조)
      MONITORING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monitoring
      MONITORING_DATASOURCE_USERNAME: was_reader
      MONITORING_DATASOURCE_PASSWORD: ${WAS_READER_PASSWORD:-}
      # 상주 메모리 확보 — 오라클 무료 계정 유휴 회수(메모리 10% 미만 조건) 방어 겸 여유
      JAVA_OPTS: "-Xms2g -Xmx2g -XX:+AlwaysPreTouch"
    # 롤링 배포(scripts/rollout.sh)의 전환 판정 — 8081 리슨 = Spring 기동 완료(app Flyway 포함).
    # 이미지에 curl이 없어 bash /dev/tcp(analytics와 동일 관용구). start_period는 2g pre-touch 여유.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
    # SIGTERM 후 graceful drain(스프링 기본 30s) 여유 — 컨테이너 기본 10s면 드레인 중 SIGKILL
    stop_grace_period: 40s
    # analytics healthy(=analysis DB 마이그레이션 완료) 후 기동 — was 코드가 새 분석 컬럼을
    # 참조하는 배포에서 기동 직후 500 레이스 차단(07-20 장애의 일시 변형). analytics가
    # healthy 실패하면 was도 안 뜨는 결합이 생기니, 그때는 up -d에 --no-deps로 우회.
    # 롤링 경로(rollout.sh)는 --no-deps로 이 결합을 건너뛴다 — analytics healthy 선행은 CD가 보장.
    depends_on:
      postgres:
        condition: service_healthy
      analytics:
        condition: service_healthy

  # 시딩 캠페인 모니터링 — 사설 monitoring DB(postgres 인스턴스 내). 스윕 KST 02:00(UTC 17:00).
  # 호스트 포트 미노출 — 어드민 UI가 없고 유일한 클라이언트 was는 monitoring-net으로 붙는다
  # (호스트 8083은 test-analytics 터널이 이미 점유 중이라 충돌 회피이기도 함).
  # 수동 디버깅은 같은 네트워크에 임시 컨테이너를 붙여서 —
  #   docker run --rm --network deploy_monitoring-net curlimages/curl -s http://monitoring:8083/…
  #   (was·monitoring 이미지엔 curl이 없다 — analytics 헬스체크 주석과 같은 이유)
  monitoring:
    image: ghcr.io/subtle-madness/hypenow-monitoring:latest
    restart: unless-stopped
    logging: *logging
    networks: [prod, monitoring-net]   # prod는 postgres 접속용
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monitoring
      SPRING_DATASOURCE_USERNAME: ${MONITORING_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${MONITORING_DB_PASSWORD}
      HIKER_API_KEY: ${HIKER_API_KEY}
      # 스케줄(KST=UTC+9): 일일 스윕 KST 02:00 — crawler collect 윈도우(KST 01:00~03:30)와 무관한 별개 파이프라인
      MONITORING_SCHEDULE_SWEEP_CRON: "0 0 17 * * *"
      # 알람 발송(07-30~) — 07-31 개통(README §13-5-4). 5분 주기.
      # 선행 필수: analysis DB `alarm_reader` 롤 + `.env`의 ALARM_READER_PASSWORD·RESEND_API_KEY.
      # 끄려면 "-"로 되돌려 커밋·배포(서버 직접 수정은 다음 CD가 덮는다).
      MONITORING_ALARM_DISPATCH_CRON: "0 */5 * * * *"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # 수신자 해석용 analysis DB 읽기 전용(두 객체만 GRANT — 계약 v2 §6)
      MONITORING_ALARM_READER_URL: jdbc:postgresql://postgres:5432/analysis
      MONITORING_ALARM_READER_USERNAME: alarm_reader
      MONITORING_ALARM_READER_PASSWORD: ${ALARM_READER_PASSWORD:-}
      # 수신자 허용목록 안전판(비어있으면 무제한 — 운영 기본). 07-30 test 스택 검증용으로 추가, 운영은 미사용 전제
      MONITORING_ALARM_ALLOWED_RECIPIENTS: ${ALARM_ALLOWED_RECIPIENTS:-}
      JAVA_OPTS: "-Xms128m -Xmx384m"
    # 8083 리슨 = Spring 기동 완료 = monitoring DB Flyway 마이그레이션 적용 완료 신호.
    # 이미지에 curl이 없어 bash /dev/tcp로 확인(analytics와 동일 관용구).
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8083' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  # OCI ONS 알람 → 디스코드 웹훅 릴레이 — ONS가 SLACK 엔드포인트를 hooks.slack.com만
  # 허용해 디스코드 직결 불가(2026-07 실측). caddy가 /internal/ons-relay/*를 이쪽으로 라우팅.
  ons-relay:
    image: python:3.12-alpine
    restart: unless-stopped
    logging: *logging
    networks: [prod]
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      ONS_RELAY_TOKEN: ${ONS_RELAY_TOKEN}
    volumes:
      - ./ons-discord-relay.py:/relay.py:ro
    command: python /relay.py

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    networks: [prod, test]   # api(운영)·dev-api(test) 도메인을 한 caddy가 라우팅 — 의도된 공유 접점
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy.d:/etc/caddy/caddy.d:ro
      - caddy-data:/data
      - caddy-config:/config
      # 액세스 로그(2026-07-29) — 호스트에서 바로 grep/jq 가능하게 바인드(로테이션은 Caddy roll이 담당)
      - ./logs/caddy:/var/log/caddy

volumes:
  pg-data:
  pg-raw-data:
  caddy-data:
  caddy-config:
