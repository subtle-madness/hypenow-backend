# 운영 스택 — 오라클 A1이든 폴백 VPS든 동일 (사용법: deploy/README.md)
# 로그 로테이션 — 미설정 시 json 로그가 무한 증식해 디스크를 침식한다
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: analysis
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"   # 루프백 전용 — 외부 접속은 SSH 터널로만
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d analysis"]
      interval: 10s
      timeout: 5s
      retries: 5

  # raw DB — 분석 잡(일회성 analytics 실행)의 읽기 소스. was는 접근 금지(시스템 경계).
  postgres-raw:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: crawler
      POSTGRES_USER: ${RAW_DB_USER}
      POSTGRES_PASSWORD: ${RAW_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"   # 루프백 전용 — 로컬 5433 컨벤션과 동일 포트
    volumes:
      - pg-raw-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAW_DB_USER} -d crawler"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 분석 상주 서버(8082 어드민 /ui) — raw(postgres-raw) 읽기 → analysis(postgres) 쓰기.
  # 외부 미노출(루프백) — 어드민 접근은 SSH 터널(ssh -L 8082:localhost:8082). LLM은 Gemini 무료 키.
  analytics:
    image: ghcr.io/subtle-madness/hypenow-analytics:latest
    restart: unless-stopped
    logging: *logging
    environment:
      APP_DATASOURCE_RAW_JDBC_URL: jdbc:postgresql://postgres-raw:5432/crawler
      APP_DATASOURCE_RAW_USERNAME: ${RAW_DB_USER}
      APP_DATASOURCE_RAW_PASSWORD: ${RAW_DB_PASSWORD}
      APP_DATASOURCE_ANALYSIS_JDBC_URL: jdbc:postgresql://postgres:5432/analysis
      APP_DATASOURCE_ANALYSIS_USERNAME: ${DB_USER}
      APP_DATASOURCE_ANALYSIS_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # 스케줄(KST=UTC+9): 미러 04:30 → 분석 05:00 → 계정 카피 07:00 (백업 04:10 이후)
      ANALYTICS_SCHEDULE_ENABLED: "true"
      ANALYTICS_SCHEDULE_MIRROR_CRON: "0 30 19 * * *"
      ANALYTICS_SCHEDULE_ANALYZE_CRON: "0 0 20 * * *"
      ANALYTICS_SCHEDULE_ACCOUNT_ANALYZE_CRON: "0 0 22 * * *"
      JAVA_OPTS: "-Xms256m -Xmx768m"
    ports:
      - "127.0.0.1:8082:8082"   # 루프백 전용 — 어드민은 SSH 터널로만
    depends_on:
      postgres:
        condition: service_healthy
      postgres-raw:
        condition: service_healthy

  was:
    image: ghcr.io/subtle-madness/hypenow-was:latest
    restart: unless-stopped
    logging: *logging
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/analysis
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # 이메일 인증 발송(Resend) — 서버 .env에 등록. 미설정 시 로깅 폴백(기동 WARN, 실발송 없음)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # 상주 메모리 확보 — 오라클 무료 계정 유휴 회수(메모리 10% 미만 조건) 방어 겸 여유
      JAVA_OPTS: "-Xms2g -Xmx2g -XX:+AlwaysPreTouch"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pg-data:
  pg-raw-data:
  caddy-data:
  caddy-config:
