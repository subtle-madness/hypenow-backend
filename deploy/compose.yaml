# 운영 스택 — 오라클 A1이든 폴백 VPS든 동일 (사용법: deploy/README.md)
# 로그 로테이션 — 미설정 시 json 로그가 무한 증식해 디스크를 침식한다
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 메모리 격리 (08-04) — 전 서비스 mem_limit + oom_score_adj. 상한은 느슨한 오버커밋(평소치·
# 힙 상한 × 1.5~2, 합계 ~15.7G > 물리 12G 의도) — 단일 컨테이너 폭주가 호스트 OOM으로 번져
# 무고한 컨테이너(postgres 등)가 죽는 경로만 차단하고 평소 운영엔 무영향. oom_score_adj는
# 동시 폭주로 그래도 호스트 OOM에 몰렸을 때의 희생 순서: test +800 → 배치(crawler·analytics)
# +500 → 기본 0 → was -300(자동 재기동되는 가용성 문제) → postgres×2·caddy·ons-relay -800
# (데이터·전면 다운·알람 실명 — 영향 비대칭). 커널 선정은 RSS 비율(≈RSS/전체×1000)+adj라
# ±100으론 순서가 안 뒤집히고, -1000은 사살 불가(극단 상황 커널 패닉)라 금지. postgres류
# 상한은 페이지 캐시가 cgroup에 동반 과금되는 특성상 OOM이 아니라 캐시 축소(쿼리 지연)로
# 먼저 발현 — 미러 잡이 느려지면 postgres-raw 상한만 상향하면 된다.
#
# 네트워크 분리 (07-29) — 운영(prod)과 test 스테이징(test)을 브리지로 격리해 test→운영
# 경로를 커널(iptables) 수준에서 차단한다. 커스텀 네트워크 선언 시 compose 기본 네트워크가
# 사라지므로 모든 서비스에 networks: 명시 필수(누락 = 통신 고립). 의도된 공유 접점 둘만
# 양쪽 소속: caddy(운영·test 도메인 라우팅), postgres-raw(test-analytics의 raw 읽기 —
# analytics_dev 읽기 전용 계정). test 서비스 정의는 compose.test.yaml 참조.
#
# monitoring-net은 명령 API 접근을 was↔monitoring으로 한정하려는 의도였다(스펙 결정 11).
# ⚠️ 실제로는 그 격리가 성립하지 않는다 — monitoring 자신이 postgres 접속 때문에 prod에도
# 소속돼 있어(아래 monitoring 서비스 networks), prod에 붙은 컨테이너는 전부 monitoring을
# 해석·도달할 수 있다. 07-31 실측:
#   $ docker exec deploy-caddy-1 getent hosts monitoring
#   172.21.0.9  monitoring
# 따라서 monitoring API를 외부로부터 막는 실질 방어는 네트워크 격리가 아니라 ①호스트 포트
# 미노출 ②Caddyfile에 monitoring 라우트 부재, 이 두 가지다. 여기에 의존하는 판단을 할 때는
# 이 사실을 전제로 할 것(스윕 수동 트리거는 그래서 프로퍼티 게이트를 2차 방어로 둔다 —
# monitoring.sweep.manual-trigger-enabled, 기본 off).
# monitoring-net이 실제로 차단하는 건 prod 밖(test 스택)뿐인데, 그건 prod↔test 분리가
# 이미 하는 일이다. 격리를 의도대로 되살리려면 postgres를 monitoring-net에 넣고 monitoring을
# prod에서 빼야 한다(미실행 — 배포 영향 검토 필요).
# test 대응물은 compose.test.yaml의 test-monitoring-net.
networks:
  prod:
  test:
  monitoring-net:
  # IPv6 이그레스 전용(08-11) — 인스타 지역 엣지 CDN(instagram.f*.fna.fbcdn.net)이 AAAA-only라
  # IPv4 전용 컨테이너에선 이미지 아카이브가 Network is unreachable로 실패한다. 기존 prod에
  # enable_ipv6를 켜면 네트워크 재생성 = 전 스택 다운이라, 별도 네트워크를 만들어 CDN 다운로드가
  # 있는 서비스(analytics·monitoring)만 추가 소속시킨다. 서브넷 미지정 → 도커가 ULA /64 자동
  # 할당 + NAT66(도커 27+ 기본). 전제: 호스트에 글로벌 IPv6 필요(OCI VNIC IPv6 + netplan dhcp6 —
  # 08-11 활성화). test 스택은 이미지 아카이브가 no-op(PAR URL 빈 값)이라 대상 아님.
  v6egress:
    enable_ipv6: true

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 1536m
    # 병렬 쿼리 DSM(/dev/shm)은 도커 기본 64MB로는 부족하다 — 09-01 유사 추천 신규 쿼리가
    # "could not resize shared memory segment ... No space left on device"로 전면 500(94% 포화 실측).
    # mem_limit 안쪽이라 페이지 캐시처럼 cgroup에 과금될 뿐 추가 예산 아님.
    shm_size: 256m
    oom_score_adj: -800
    networks: [prod]
    # 쿼리 성능 측정(스펙 2026-08-10) — pg_stat_statements는 preload 필수라 command로 주입.
    # 확장 생성(CREATE EXTENSION)은 README §15 런북(수동 1회). 이 항목을 바꾸면 postgres가
    # 재생성돼 짧은 순단이 발생한다 — was/analytics는 HikariCP가 자동 재접속.
    command:
      - postgres
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "log_min_duration_statement=500"
    environment:
      POSTGRES_DB: analysis
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"   # 루프백 전용 — 외부 접속은 SSH 터널로만
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d analysis"]
      interval: 10s
      timeout: 5s
      retries: 5

  # raw DB — 분석 잡(일회성 analytics 실행)의 읽기 소스. was는 접근 금지(시스템 경계).
  postgres-raw:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 2g   # raw 대용량(덤프 11GiB급) — 미러 잡 페이지 캐시 몫을 analysis보다 여유 있게
    shm_size: 256m   # 병렬 쿼리 DSM — postgres(analysis)와 동일 사유(위 주석), 예방 동반 적용
    oom_score_adj: -800
    networks: [prod, test]   # test-analytics가 analytics_dev 계정으로 raw를 읽는다 — 의도된 공유 접점
    environment:
      POSTGRES_DB: crawler
      POSTGRES_USER: ${RAW_DB_USER}
      POSTGRES_PASSWORD: ${RAW_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"   # 루프백 전용 — 로컬 5433 컨벤션과 동일 포트
    volumes:
      - pg-raw-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAW_DB_USER} -d crawler"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 분석 상주 서버(8082 어드민 /ui) — raw(postgres-raw) 읽기 → analysis(postgres) 쓰기.
  # 외부 미노출(루프백) — 어드민 접근은 SSH 터널(ssh -L 8082:localhost:8082).
  # LLM: app_setting analytics.llm-provider로 선택 — gemini(무료 키) | vertex(SA 키, 07-20 전환).
  analytics:
    image: ghcr.io/subtle-madness/hypenow-analytics:latest
    restart: unless-stopped
    logging: *logging
    mem_limit: 1280m   # 힙 768m + 오프힙 여유
    oom_score_adj: 500   # 지정 희생양 — 재기동 무해 배치, 새벽 폭주 주범이 먼저 죽게
    networks: [prod, v6egress]   # v6egress: 이미지 아카이브의 AAAA-only CDN 도달용(상단 networks 주석)
    environment:
      APP_DATASOURCE_RAW_JDBC_URL: jdbc:postgresql://postgres-raw:5432/crawler
      APP_DATASOURCE_RAW_USERNAME: ${RAW_DB_USER}
      APP_DATASOURCE_RAW_PASSWORD: ${RAW_DB_PASSWORD}
      APP_DATASOURCE_ANALYSIS_JDBC_URL: jdbc:postgresql://postgres:5432/analysis
      APP_DATASOURCE_ANALYSIS_USERNAME: ${DB_USER}
      APP_DATASOURCE_ANALYSIS_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Vertex SA 키 — provider=vertex일 때만 읽힘(빈 생성 시점), 파일은 secrets/ 볼륨
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/vertex-sa.json
      # 스케줄(KST=UTC+9): 미러 04:30 → 아카이브 04:50 → 사실 분석 05:00 → 해석 분석 05:30
      #                    → 늦크롤 백필 06:00 → 계정 카피 07:00 (백업 04:10 이후)
      ANALYTICS_SCHEDULE_ENABLED: "true"
      ANALYTICS_SCHEDULE_MIRROR_CRON: "0 30 19 * * *"
      ANALYTICS_SCHEDULE_ARCHIVE_CRON: "0 50 19 * * *"
      # 파트 A(사실) — 2026-09-03 2단계 분리. app_setting analytics.analyze-mode=unified면
      # 잡이 no-op 로그만 남긴다(토글을 켜기 전까지 이 크론은 무해).
      ANALYTICS_SCHEDULE_FACT_ANALYZE_CRON: "0 0 20 * * *"
      # 파트 B(해석). unified 모드에서는 현행 통합 1콜 그대로다. 파트 A 제출과 15~30분 띄운다 —
      # 제출 직전 pending 수거가 겹치면 BATCH_COLLECT 락에서 한쪽이 BUSY로 건너뛴다(30분 뒤
      # 정기 수거가 받쳐 주므로 무해하지만 로그가 어지럽다).
      ANALYTICS_SCHEDULE_ANALYZE_CRON: "0 30 20 * * *"
      # 늦크롤 백필 — timely와 예산 독립(2026-07-23 분리). 신규 계정 온보딩 백카탈로그가 주 대상
      ANALYTICS_SCHEDULE_LATE_BACKFILL_ANALYZE_CRON: "0 0 21 * * *"
      ANALYTICS_SCHEDULE_ACCOUNT_ANALYZE_CRON: "0 0 22 * * *"
      # 배치 전송(2026-08-11, Vertex 배치 50% 할인) 수거 — KST 05:10~11:40 30분 간격.
      # transport 자체(online|batch)는 app_setting analytics.analyze-transport 수동 UPDATE로 전환하므로
      # 여기엔 없음 — online이면 content_batch_jobs에 pending 행이 없어 이 크론은 매번 no-op이다.
      ANALYTICS_SCHEDULE_BATCH_COLLECT_CRON: "0 10,40 20-23,0-2 * * *"
      ANALYTICS_IMAGE_PAR_URL: ${ANALYTICS_IMAGE_PAR_URL}
      # 이미지 스토어 선택(2026-08-12 GCS 이전) — par가 기본, .env의 IMAGE_STORE=gcs 한 줄이 컷오버 스위치.
      # GCS 인증은 전용 SA 키(IMAGE_GCS_KEY)를 코드가 직접 읽는다 — 위 GOOGLE_APPLICATION_CREDENTIALS는
      # Vertex LLM 전용이라 건드리지 않는다(ADC는 JVM당 하나뿐이라 덮으면 Vertex가 전면 403).
      IMAGE_STORE: ${IMAGE_STORE:-par}
      IMAGE_GCS_BUCKET: ${IMAGE_GCS_BUCKET:-}
      IMAGE_GCS_KEY: ${IMAGE_GCS_KEY:-/run/secrets/gcs-image-archiver.json}
      # OOM 자동 힙 덤프(08-27 스펙) — HotSpot은 기존 파일을 덮어쓰지 않아 첫 OOM분 1개만
      # 남는다(크래시루프에도 디스크 안전). 분석 후 수동 삭제. cgroup OOM kill은 덤프 불가.
      JAVA_OPTS: "-Xms256m -Xmx768m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps/analytics.hprof"
      # 액추에이터 관리 포트 분리(2026-08-31, 08-22 스펙 이연분) — prod 네트워크 내부(prometheus 스크레이프) 전용.
      # monitoring 9083과 같은 관용구(env 주입), 번호는 앱 포트 +1000.
      MANAGEMENT_SERVER_PORT: "9082"
    volumes:
      - ./secrets/vertex-sa.json:/secrets/vertex-sa.json:ro
      - ./secrets/gcs-image-archiver.json:/run/secrets/gcs-image-archiver.json:ro
      - ./dumps:/dumps
    ports:
      - "127.0.0.1:8082:8082"   # 루프백 전용 — 어드민은 SSH 터널로만
    # 8082 리슨 = Spring 기동 완료 = analysis DB Flyway 마이그레이션 적용 완료 신호.
    # 이미지에 curl이 없어 bash /dev/tcp로 확인. start_period는 마이그레이션(백필 포함) 여유.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8082' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      postgres-raw:
        condition: service_healthy

  # 수집 상주 서버(8080 어드민 /ui) — raw(postgres-raw)에 쓰기.
  # 외부 미노출(루프백) — 접근은 SSH 터널(ssh -L 8080:localhost:8080).
  # 데일리 스케줄 자동(아래 CRAWLER_SCHEDULE_*) — 발굴(discover·similar)만 어드민 UI 수동 트리거.
  crawler:
    image: ghcr.io/subtle-madness/hypenow-crawler:latest
    restart: unless-stopped
    logging: *logging
    mem_limit: 1536m   # 힙 1g + 오프힙 여유
    oom_score_adj: 500   # 지정 희생양 — analytics와 동일 사유
    networks: [prod]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-raw:5432/crawler
      SPRING_DATASOURCE_USERNAME: ${RAW_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${RAW_DB_PASSWORD}
      APIFY_TOKEN: ${APIFY_TOKEN}
      HIKER_API_KEY: ${HIKER_API_KEY:-}
      DATALIKERS_API_KEY: ${DATALIKERS_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Claude 뷰티 판정(claude-api 전환 대비) — OAuth 토큰만, ANTHROPIC_API_KEY는 서버에 두지 않는다
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      APIFY_PROXY_URL: ${APIFY_PROXY_URL:-}
      DATAIMPULSE_RESIDENTIAL_PROXY_URL: ${DATAIMPULSE_RESIDENTIAL_PROXY_URL:-}
      DATAIMPULSE_MOBILE_PROXY_URL: ${DATAIMPULSE_MOBILE_PROXY_URL:-}
      # 크롬 익스텐션 수동 발굴 등록 API 토큰 — 미설정 시 해당 API 비활성(fail-closed)
      MANUAL_DISCOVERY_TOKEN: ${MANUAL_DISCOVERY_TOKEN:-}
      # 스케줄(KST=UTC+9) — 윈도우 반복 발사: 잡들이 "남은 대상만" 선정하므로(재방문 컷오프·
      # DISCOVERED/미판정 잔여) 반복이 안전하고, 일시 실패·컨테이너 재기동을 윈도우 안에서 흡수한다.
      # collect 01:00~03:30/30분 · reels 01:10~03:55/15분 · qualify 02:00~03:30/30분 · beauty 03:00·03:30
      # → analytics 미러 04:30 전에 완결(같은 날 새벽 분석·아카이브 반영). 발굴(discover·similar)은 수동.
      CRAWLER_SCHEDULE_ENABLED: "true"
      CRAWLER_SCHEDULE_COLLECT_CRON: "0 0/30 16-18 * * *"
      CRAWLER_SCHEDULE_REELS_CRON: "0 10/15 16-18 * * *"
      CRAWLER_SCHEDULE_QUALIFY_CRON: "0 0/30 17-18 * * *"
      CRAWLER_SCHEDULE_BEAUTY_CRON: "0 0,30 18 * * *"
      CRAWLER_SCHEDULE_DISCOVER_CRON: "-"
      # OOM 자동 힙 덤프 — analytics 주석 참조(첫 OOM분 1개만 보존)
      JAVA_OPTS: "-Xmx1g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps/crawler.hprof"
      # 액추에이터 관리 포트 분리(2026-08-31, 08-22 스펙 이연분) — prod 네트워크 내부(prometheus 스크레이프) 전용.
      # monitoring 9083과 같은 관용구(env 주입), 번호는 앱 포트 +1000.
      MANAGEMENT_SERVER_PORT: "9080"
    volumes:
      - ./dumps:/dumps
    ports:
      - "127.0.0.1:8080:8080"   # 루프백 전용 — 어드민은 SSH 터널로만
    depends_on:
      postgres-raw:
        condition: service_healthy

  # was 조회 캐시 전용(세션 아님) — 휘발 허용(재시작=콜드 캐시), AOF·볼륨 없음 (스펙 §3).
  # was가 REDIS_HOST=redis로 접속. depends_on 없음 — redis 불능이어도 was는 DB 직행(fail-open).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m   # maxmemory 256mb + RDB fork COW 여유
    networks: [prod]   # 커스텀 네트워크 체제 — 누락 시 was에서 도달 불가(조용한 캐시 미스 fail-open이라 증상도 안 보인다)
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  was:
    image: ghcr.io/subtle-madness/hypenow-was:latest
    restart: unless-stopped
    logging: *logging
    mem_limit: 3g   # 힙 2g pre-touch 상시 점유 + 오프힙 여유 — 힙을 줄이면 이 상한도 같이 재조정
    oom_score_adj: -300   # 완만한 보호 — postgres(-800)와 단차 유지(사망 = 자동 복구되는 가용성 문제)
    # prod는 postgres·redis·analytics 접속용, monitoring-net은 monitoring 명령 API 전용
    # (was가 그 유일한 클라이언트 — 상단 networks 주석).
    networks: [prod, monitoring-net]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/analysis
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      # 이메일 인증 발송(Resend) — 서버 .env에 등록. 미설정 시 로깅 폴백(기동 WARN, 실발송 없음)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      WEB_BASE_URL: ${WEB_BASE_URL:-https://www.hypenow.io}   # 주간 리포트 메일 딥링크 기준 주소
      # 주간 다이제스트 생성·발송 크론(README §13-5-3) — 기본 매주 월요일 09:00 KST + 따라잡기
      # 09:10~23:50 10분 간격. 임시 중단은 둘 다 "-"로 덮어 재기동(README 참조, 하나만 끄면
      # 따라잡기가 10분 안에 되살린다).
      MONITORING_DIGEST_WEEKLY_CRON: "${MONITORING_DIGEST_WEEKLY_CRON:-0 0 9 * * MON}"
      MONITORING_DIGEST_WEEKLY_CATCHUP_CRON: "${MONITORING_DIGEST_WEEKLY_CATCHUP_CRON:-0 10,20,30,40,50 9-23 * * *}"
      # 어드민 가입 코드 일괄 적재(POST /admin/signup-codes) 정적 토큰 — 서버 .env에 등록. 미설정 시 엔드포인트 fail-closed(503)
      CODES_API_KEY: ${CODES_API_KEY:-}
      # 모니터링 v3 조회 개통(was 계약 §1) — 기본 off. 개통은 .env의 MONITORING_ENABLED=true +
      # WAS_READER_PASSWORD 설정(README §13-6). false면 MonitoringConfig 자체가 안 뜬다(부가 서브시스템 무영향).
      MONITORING_ENABLED: "${MONITORING_ENABLED:-false}"
      # 광고 표기 판정 FE 노출 개통(08-19, 계약 §9) — false로 내리면 즉시 중립값 강제(킬 스위치)
      AD_DISCLOSURE_EXPOSE: "${AD_DISCLOSURE_EXPOSE:-true}"
      # monitoring 사설 DB(postgres 인스턴스 내 monitoring DB)를 읽기 전용 계정으로 — 객체 GRANT는
      # monitoring Flyway(V2)가 소유자로서 부여, was_reader에는 접속 권한만(db/init/02 참조)
      MONITORING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monitoring
      MONITORING_DATASOURCE_USERNAME: was_reader
      MONITORING_DATASOURCE_PASSWORD: ${WAS_READER_PASSWORD:-}
      # 브랜드 AI 어시스턴트(2026-09-02 #712로 코드 배포, 개통은 이 env) - 끄려면 .env에 BRAND_AI_ENABLED=false.
      # monitoring.enabled도 true여야 컨트롤러 빈이 뜬다(둘 다 @ConditionalOnProperty). Vertex 프로젝트는
      # analytics·monitoring과 같은 신규 프로젝트, SA 키는 같은 secrets 파일을 읽기 전용으로 마운트한다.
      BRAND_AI_ENABLED: "${BRAND_AI_ENABLED:-true}"
      BRAND_AI_VERTEX_PROJECT: ${BRAND_AI_VERTEX_PROJECT:-project-00d0f3bd-bdef-4b0a-9eb}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/vertex-sa.json
      # 상주 메모리 확보 — 오라클 무료 계정 유휴 회수(메모리 10% 미만 조건) 방어 겸 여유.
      # OOM 자동 힙 덤프 — analytics 주석 참조(첫 OOM분 1개만 보존, 덤프 크기 ~2g)
      JAVA_OPTS: "-Xms2g -Xmx2g -XX:+AlwaysPreTouch -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps/was.hprof"
    volumes:
      - ./dumps:/dumps
      - ./secrets/vertex-sa.json:/secrets/vertex-sa.json:ro
    # 롤링 배포(scripts/rollout.sh)의 전환 판정 — 8081 리슨 = Spring 기동 완료(app Flyway 포함).
    # 이미지에 curl이 없어 bash /dev/tcp(analytics와 동일 관용구). start_period는 2g pre-touch 여유.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
    # SIGTERM 후 graceful drain(스프링 기본 30s) 여유 — 컨테이너 기본 10s면 드레인 중 SIGKILL
    stop_grace_period: 40s
    # analytics healthy(=analysis DB 마이그레이션 완료) 후 기동 — was 코드가 새 분석 컬럼을
    # 참조하는 배포에서 기동 직후 500 레이스 차단(07-20 장애의 일시 변형). analytics가
    # healthy 실패하면 was도 안 뜨는 결합이 생기니, 그때는 up -d에 --no-deps로 우회.
    # 롤링 경로(rollout.sh)는 --no-deps로 이 결합을 건너뛴다 — analytics healthy 선행은 CD가 보장.
    depends_on:
      postgres:
        condition: service_healthy
      analytics:
        condition: service_healthy

  # 시딩 캠페인 모니터링 — 사설 monitoring DB(postgres 인스턴스 내). 캠페인 스윕 KST 02:00 · 브랜드 태그 스윕 KST 02:00(08-12 정본).
  # 호스트 포트 미노출 — 어드민 UI가 없고 유일한 클라이언트 was는 monitoring-net으로 붙는다
  # (호스트 8083은 test-analytics 터널이 이미 점유 중이라 충돌 회피이기도 함).
  # 수동 디버깅은 같은 네트워크에 임시 컨테이너를 붙여서 —
  #   docker run --rm --network deploy_monitoring-net curlimages/curl -s http://monitoring:8083/…
  #   (was·monitoring 이미지엔 curl이 없다 — analytics 헬스체크 주석과 같은 이유)
  monitoring:
    image: ghcr.io/subtle-madness/hypenow-monitoring:latest
    restart: unless-stopped
    logging: *logging
    mem_limit: 768m   # 힙 512m + 오프힙 여유(08-12 힙 상향 후에도 256m 마진 — 스레드 적고 오프힙 소비 없음)
    # prod는 postgres 접속용, v6egress는 프로필·썸네일 아카이브의 AAAA-only CDN 도달용
    networks: [prod, monitoring-net, v6egress]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monitoring
      SPRING_DATASOURCE_USERNAME: ${MONITORING_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${MONITORING_DB_PASSWORD}
      HIKER_API_KEY: ${HIKER_API_KEY}
      # 자체크롤 프록시·댓글 graphql 파라미터. 개통 토글은 app_setting(ig-source.self-enabled,
      # ig-source.force-hiker)이 런타임 관장 — 기본 off라 미개통. DATAIMPULSE_*는 crawler와 같은 .env 키 공유.
      DATAIMPULSE_RESIDENTIAL_PROXY_URL: ${DATAIMPULSE_RESIDENTIAL_PROXY_URL:-}
      DATAIMPULSE_MOBILE_PROXY_URL: ${DATAIMPULSE_MOBILE_PROXY_URL:-}
      IG_COMMENT_DOC_ID: ${IG_COMMENT_DOC_ID:-}
      IG_COMMENT_FRIENDLY_NAME: ${IG_COMMENT_FRIENDLY_NAME:-}
      # 브랜드 해시태그 감지·광고 표기 LLM 판정(BrandMentionJudge·AdDisclosureExtractorGemini) —
      # 2026-08-18 Vertex 전환: SA 키(GOOGLE_APPLICATION_CREDENTIALS)가 있으면 Vertex, 없으면
      # 이 GEMINI_API_KEY로 AI Studio 폴백(fail-closed 전 판정 UNCERTAIN=비노출, 최초 1회 warn).
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Vertex SA 키 — analytics와 같은 키 파일 재사용(전용 SA 아님, 08-18 승인). GCS 이미지 인증은
      # 전용 SA 키(IMAGE_GCS_KEY)를 코드가 직접 읽으므로 이 값과 충돌하지 않는다(analytics
      # compose 주석과 동일 사유 — ADC는 JVM당 하나뿐이라 GcsImageStore가 여길 덮으면 Vertex가 403).
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/vertex-sa.json
      MONITORING_LLM_VERTEX_PROJECT: ${MONITORING_LLM_VERTEX_PROJECT:-project-00d0f3bd-bdef-4b0a-9eb}
      MONITORING_LLM_VERTEX_LOCATION: ${MONITORING_LLM_VERTEX_LOCATION:-global}
      # 프로필 이미지 아카이브(설계 스펙 §3-1) — analytics와 같은 버킷·같은 쓰기 PAR을 재사용
      MONITORING_IMAGE_PAR_URL: ${ANALYTICS_IMAGE_PAR_URL}
      # 이미지 스토어 선택(2026-08-12 GCS 이전) — analytics와 같은 버킷·같은 전용 SA 키를 재사용
      IMAGE_STORE: ${IMAGE_STORE:-par}
      IMAGE_GCS_BUCKET: ${IMAGE_GCS_BUCKET:-}
      IMAGE_GCS_KEY: ${IMAGE_GCS_KEY:-/run/secrets/gcs-image-archiver.json}
      # 만료 CDN 프로필 이미지 재수집 백필 트리거(POST /api/author-image-backfill, 2026-08-25) —
      # 기본 off. 실행할 때만 .env에 true를 넣고 up -d monitoring으로 개통(MONITORING_ENABLED 관용구),
      # 백필 완주 후 되돌린다. Hiker 재조회 콜 증폭 지점이라 상시 개방하지 않는다(limit 필수가 2차 방어).
      MONITORING_IMAGE_BACKFILL_TRIGGER_ENABLED: ${MONITORING_IMAGE_BACKFILL_TRIGGER_ENABLED:-false}
      # 해시태그 딥 재백필 1회 킬 스위치(2026-09-02 감시 세트 설계 §2) — 구 편입 하드스톱(1,000)
      # 기간에 버려진 게시물 회수용. 기본 off. 위 이미지 백필과 같은 관용구: 실행할 때만 .env에
      # true 넣고 up -d monitoring으로 개통(야간 스윕 창 KST 02~07시 회피), 완료 로그("해시태그
      # 딥 재백필 완료") 확인 후 되돌린다 — 켜둔 채면 재기동마다 태그당 수십~수백 콜이 낭비된다.
      MONITORING_BRAND_HASHTAG_DEEP_RESWEEP_ON_STARTUP: ${MONITORING_BRAND_HASHTAG_DEEP_RESWEEP_ON_STARTUP:-false}
      # 스케줄(KST=UTC+9): 일일 스윕 KST 02:00 — crawler collect 윈도우(KST 01:00~03:30)와 무관한 별개 파이프라인
      MONITORING_SCHEDULE_SWEEP_CRON: "0 0 17 * * *"
      # 브랜드 태그 스윕 — KST 02:00(UTC 17:00). 설계 원안은 03:00(캠페인 스윕과 시차)이었으나
      # 서버 override가 02:00으로 운영돼 왔고 08-12에 02:00을 정본으로 수용(캠페인 스윕과 동시 실행).
      # was.brand.sweep-hour-kst(nextScheduledAt 표기)와 반드시 함께 움직일 것.
      MONITORING_BRAND_SCHEDULE_SWEEP_CRON: "0 0 17 * * *"
      # 알람 메일 발송은 2026-08-27 주간 개편으로 was(주간 리포트)로 이관됐다 - monitoring은 alarm_event 적재만 한다.
      # 힙 512m(08-12 OOM 후속): 백필 core 2병렬 대비 — 힙 예산은 동시 콜 13 × ~10MB + 상주분
      # (08-13 보강 워커 6→10 상향 반영: 워커 10 + 스윕 core 1 + 등록 core 2가 최악값).
      # ExitOnOOM: OOM 후 반쯤 죽은 채 버티지 않고 즉시 종료 → restart 정책으로 깨끗하게 복귀.
      # OOM 자동 힙 덤프 — analytics 주석 참조. ExitOnOOM과 공존(덤프를 먼저 쓰고 종료).
      JAVA_OPTS: "-Xms128m -Xmx512m -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps/monitoring.hprof"
      # 액추에이터 관리 포트 분리(스펙 2026-08-22) — prod 네트워크 내부(prometheus 스크레이프) 전용.
      # was의 9081(application-prod.yml)과 같은 의도인데 monitoring은 prod 프로필 없이 env 주입이 관용구.
      MANAGEMENT_SERVER_PORT: "9083"
    volumes:
      - ./secrets/gcs-image-archiver.json:/run/secrets/gcs-image-archiver.json:ro
      - ./secrets/vertex-sa.json:/secrets/vertex-sa.json:ro
      - ./dumps:/dumps
    # 8083 리슨 = Spring 기동 완료 = monitoring DB Flyway 마이그레이션 적용 완료 신호.
    # 이미지에 curl이 없어 bash /dev/tcp로 확인(analytics와 동일 관용구).
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8083' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  # 인스타 댓글 doc_id 자동 갱신자 — one-shot, 호스트 크론이 트리거(deploy/docid-refresher/README.md 참조).
  # profiles: [tools]로 up -d엔 절대 포함되지 않는다 — 이미지도 CD가 빌드·push하지 않으므로
  # 서버가 로컬(build:)로 직접 빌드한다(4종 상주 서비스와 달리 ghcr pull 대상이 아님).
  docid-refresher:
    build: ./docid-refresher
    profiles: [tools]
    logging: *logging
    mem_limit: 1024m   # Chromium 헤드리스 실행 여유
    networks: [prod]   # postgres 접속. IG는 레지덴셜 프록시(IPv4) 경유라 v6egress 불요
    environment:
      DATAIMPULSE_RESIDENTIAL_PROXY_URL: ${DATAIMPULSE_RESIDENTIAL_PROXY_URL:-}
      MONITORING_DB_HOST: postgres
      MONITORING_DB_PORT: "5432"
      MONITORING_DB_NAME: monitoring
      MONITORING_DB_USER: ${MONITORING_DB_USER}
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD}
    # restart 없음(one-shot) — depends_on도 두지 않는다(run --rm은 up -d 스택과 별개 실행이라
    # postgres가 이미 떠 있다는 전제, 크론 스크립트에서 postgres 헬시 확인은 불필요).

  # OCI ONS 알람 → 디스코드 웹훅 릴레이 — ONS가 SLACK 엔드포인트를 hooks.slack.com만
  # 허용해 디스코드 직결 불가(2026-07 실측). caddy가 /internal/ons-relay/*를 이쪽으로 라우팅.
  ons-relay:
    image: python:3.12-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    oom_score_adj: -800   # 알람 전달 경로 — 죽으면 "알람이 안 오는 것"과 "정상"을 구분 못 한다
    networks: [prod]
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      ONS_RELAY_TOKEN: ${ONS_RELAY_TOKEN}
    volumes:
      - ./ons-discord-relay.py:/relay.py:ro
    command: python /relay.py
    # 9099 리슨 확인 — 이미지에 bash가 없어(python:alpine) /dev/tcp 관용구 대신 파이썬 소켓.
    # 컨테이너 다운 감시(post-container-metrics.py)가 unhealthy를 다운(0)으로 집계한다(§9).
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9099), 3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # API 지표 저장(스펙 2026-08-10) — was:9081 스크레이프, 보관 30일 + 디스크 1GB 상한(이중 봉인).
  # 호스트 포트 미노출 — 조회는 Grafana 데이터소스로만. 관측 도구는 oom_score_adj +500(먼저 희생).
  prometheus:
    image: prom/prometheus:v3.4.0
    restart: unless-stopped
    logging: *logging
    networks: [prod]
    mem_limit: 256m
    oom_score_adj: 500
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=1GB"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # 로그 저장(스펙 2026-08-10) — 파일시스템 모드·보관 30일. 배포 시 컨테이너 로그 유실 문제의 해결책.
  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    logging: *logging
    networks: [prod]
    mem_limit: 384m
    oom_score_adj: 500
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki

  # 로그 수집기 — 도커 소켓(ro)으로 전 컨테이너 로그를 긁어 Loki로 push. Loki 불능 시 재시도
  # 버퍼링만 하고 서비스 컨테이너의 stdout 로깅(json-file)에는 영향 없음.
  alloy:
    image: grafana/alloy:v1.8.2
    restart: unless-stopped
    logging: *logging
    networks: [prod]
    mem_limit: 192m
    oom_score_adj: 500
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 엣지 액세스 로그 테일링(2026-08-24 스펙) — caddy가 같은 호스트 경로에 쓴다(caddy 서비스의
      # ./logs/caddy 바인드와 짝). 포지션은 named volume으로 영속 — 없으면 매 배포(restart alloy)마다
      # tail_from_end가 새로 걸려 재기동 순간의 로그를 놓친다.
      - ./logs/caddy:/var/log/caddy:ro
      - alloy-data:/var/lib/alloy/data

  # 서비스 현황 대시보드(app 스키마 읽기 전용) — 호스트 포트 미노출, Caddy가 grafana:3000으로 프록시.
  # CPU 2코어 제약 고려: 익명접속·회원가입·원격 리포팅/업데이트체크류 전부 끔, mem_limit 512m로 상한.
  # 대시보드 자동 새로고침은 패널 JSON(provisioning/dashboards/json)에서 5분으로 고정 — 1분 미만 금지.
  grafana:
    image: grafana/grafana:13.1.1
    restart: unless-stopped
    logging: *logging
    networks: [prod]
    mem_limit: 512m
    ports:
      - "127.0.0.1:3000:3000"   # 루프백 전용 — 어드민은 SSH 터널로만(analytics 8082·crawler 8080과 동일 관례)
    environment:
      # 터널로만 접근하므로 root_url은 사용자 쪽 로컬 포트 기준이다 — 로컬 3000은 Next.js가 쓸 수
      # 있어 3001로 잡았다(`ssh -L 3001:localhost:3000 <host>`). 이 값이 실제 접속 주소와 어긋나면
      # 로그인 리다이렉트·알림 링크가 깨진다.
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 2코어 서버에서 불필요한 백그라운드 잡(원격 리포팅·업데이트 체크·피드백 링크) 차단
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      # 프로비저닝 파일의 $__env{} 치환용 — analysis DB grafana_reader 비밀번호(README §14 런북에서 생성)
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD}
      # "미완료 등록 30분 초과" 알림 contact point가 재사용(ons-relay와 같은 웹훅, §9)
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    # /api/health는 인증 불필요. wget은 Grafana 공식 이미지가 기본 포함(공식 문서 헬스체크 예시와 동일
    # 관용구) — 다른 서비스들의 "이미지에 curl이 없어 bash /dev/tcp" 사유와 달리 grafana는 wget 사용.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # 호스트·컨테이너 지표(대시보드 개편 스펙 2026-08-18) — 죽음 감시는 OCI 알람(푸시),
  # 여기는 상태·추이(풀) 담당. 관측 스택이므로 압박 시 먼저 죽도록 oom_score_adj 500.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    logging: *logging
    networks: [prod]
    mem_limit: 64m
    oom_score_adj: 500
    pid: host
    command: ["--path.rootfs=/rootfs"]
    volumes: ["/:/rootfs:ro"]

  cadvisor:
    # 0.49는 containerd 스냅샷터 이미지 스토어(도커 29 기본, 서버 Storage Driver "overlayfs")를
    # 못 읽어 컨테이너 핸들러 생성이 통째로 실패했다 — name 라벨 시계열 0개, 로그는
    # "failed to identify the read-write layer ID" 도배(cadvisor#3643, 0.54.0에서 수정).
    # 0.54+ 도커 팩토리는 containerd 소켓 연결이 필수라 /run/containerd 마운트가 같이 필요하다.
    # 이미지 배포처는 gcr.io → ghcr.io로 이관됨(gcr에는 v0.52.1까지만 있다).
    image: ghcr.io/google/cadvisor:0.56.2
    # 컨테이너 외 cgroup(systemd 유닛 등)·compose 메타 라벨 시계열 억제 — 대시보드는
    # name 라벨만 쓴다(hypenow-infra.json).
    command: ["--docker_only=true", "--store_container_labels=false"]
    restart: unless-stopped
    logging: *logging
    networks: [prod]
    mem_limit: 256m
    oom_score_adj: 500
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      # 0.54+ 도커 핸들러가 rw 레이어 경로를 containerd 스펙에서 직접 읽는다 — 이 소켓이
      # 없으면 도커 팩토리 등록 자체가 실패해 0.49 때와 같은 무데이터로 돌아간다.
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    oom_score_adj: -800   # 유일한 엣지 — 죽으면 운영+test 전면 다운
    networks: [prod, test]   # api(운영)·dev-api(test) 도메인을 한 caddy가 라우팅 — 의도된 공유 접점
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy.d:/etc/caddy/caddy.d:ro
      - caddy-data:/data
      - caddy-config:/config
      # 액세스 로그(2026-07-29) — 호스트에서 바로 grep/jq 가능하게 바인드(로테이션은 Caddy roll이 담당)
      - ./logs/caddy:/var/log/caddy

volumes:
  pg-data:
  pg-raw-data:
  caddy-data:
  caddy-config:
  grafana-data:
  alloy-data:
  prometheus-data:
  loki-data:
