      # Hiker 일 소비 이상 급증 — delta(...[24h])는 잔액이 줄면 음수라 부호를 뒤집어(-delta) 소비량
      # 형태로 만든다. 충전(값이 오히려 오름)은 delta가 양수가 돼 burn이 음수가 되므로 gt 임계값에
      # 안전 방향(알람 안 남). 실측 일 소비 15,000~25,000 대비 40,000은 통상 소비의 약 2배.
