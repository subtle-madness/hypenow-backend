          severity: warning
          kind: daily
        annotations:
          summary: "좋아요 NULL 비율(monitoring): 어제 {{ $values.C }}, 최근 7일 중앙값 {{ $values.D }}. 기준: 중앙값의 2배 초과이면서 절대 0.02(2%) 초과. 확인: brand_post_snapshot 수집 완결성, 프로필 API 상태."
        data:
          - refId: A
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: hypenow-monitoring-pg
            model:
              refId: A
              format: table
              rawSql: |-
                SELECT avg((likes IS NULL AND NOT likes_hidden)::int)::float AS value
                FROM brand_post_snapshot
                WHERE captured_on = (now() AT TIME ZONE 'Asia/Seoul')::date - 1
          - refId: B
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: hypenow-monitoring-pg
            model:
              refId: B
              format: table
              rawSql: |-
                SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY v) AS value FROM (
                  SELECT COALESCE(r, 0) AS v FROM generate_series(
                    (now() AT TIME ZONE 'Asia/Seoul')::date - 8,
                    (now() AT TIME ZONE 'Asia/Seoul')::date - 2,
                    interval '1 day'
                  ) AS d
                  LEFT JOIN (
                    SELECT captured_on AS day, avg((likes IS NULL AND NOT likes_hidden)::int)::float AS r
                    FROM brand_post_snapshot
                    WHERE captured_on >= (now() AT TIME ZONE 'Asia/Seoul')::date - 10 GROUP BY 1
                  ) x ON x.day = d
                ) s
          - refId: C
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: reduce
              expression: A
              reducer: last
          - refId: D
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: D
              type: reduce
              expression: B
              reducer: last
          - refId: E
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: E
              type: math
              expression: "$C > $D * 2 && $C > 0.02"
          - refId: F
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: F
              type: threshold
              expression: E
              conditions:
