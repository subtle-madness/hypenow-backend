# "미완료 등록 30분 초과" 알림 — 대시보드 패널1(미완료 등록)과 같은 판정 기준.
# A: 원본 SQL(30분 초과 미완료 건수) → B: reduce(last) → C: threshold(> 0)가 firing 조건.
# interval 5m — 2코어 서버 부담 최소화(대시보드 자동새로고침과 동일 주기). for: 0m —
# SQL 자체가 이미 "30분 경과"를 조건에 넣고 있어 추가 유지시간을 둘 필요가 없다.
#
# ⚠ 프로비저닝으로 처음 반영한 뒤 Grafana UI(Alerting > Alert rules)에서 규칙이 정상 로드됐는지
# 반드시 확인할 것 — 이 스키마는 문서 기준으로 작성했고 실제 기동 검증은 못 했다(README §14 참조).
apiVersion: 1

groups:
  - orgId: 1
    name: hypenow-registrations
    # 폴더는 운영 — 08-26 개편으로 HypeNow 폴더가 퇴역했는데 이 규칙이 folder: HypeNow로 남아
    # 빈 폴더를 계속 되살렸다(폴더 삭제 400 folder.not-empty). 알림 규칙도 새 2폴더 체계를 따른다.
    folder: 운영
    interval: 5m
    rules:
      - uid: incomplete-registration-30m
        title: "미완료 등록 30분 초과"
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "completed_at IS NULL 상태로 30분 넘게 남아있는 등록이 있습니다. [흐름] 경쟁사 모니터링의 '처리 중 멈춘 등록' 패널 확인."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: hypenow-analysis-pg
            model:
              refId: A
              format: table
              rawSql: >-
                SELECT count(*) AS value FROM app.monitoring_registrations
                WHERE completed_at IS NULL AND now() - requested_at > interval '30 minutes'
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  # 09-04 수집 회귀 감시 트랙(feat/grafana-collection-alerts) — 2026-09-02~09-04 인스타 로그아웃
  # 프로필 API 401 차단으로 crawler COLLECT가 3일간 사실상 전멸했는데(raw_profile 09-03 KST 31건,
  # 정상 2,600~3,850) 실패가 DB에 안 남고(FAILED row 없음, 그냥 성공 건수가 0에 가깝게 줄어든다)
  # 수집량 알람 자체가 없어 09-04에야 발견됐다. 아래 그룹은 그 재발 감시용.
  #
  # 회귀 판정 공통 관용구: A=어제(KST) 값 → B=최근 7일(어제 제외 직전 7일, generate_series로
  # 결측일 0 채움) 중앙값 → C/D=reduce(last) → E=math(($C < $D*0.5 && $C < SOFT) || $C < HARD)
  # → F=threshold(E gt 0), condition F. SOFT=변동 큰 지표의 병행 절대 하한, HARD=중앙값 자체가
  # 무너진 장기 장애까지 잡는 절대 최저선. 상향 스파이크는 알람 아님(E가 하락만 본다).
  #
  # 백테스트 근거는 deploy/grafana/backtest/2026-09-04-collection-regression.md 참조 — 운영
  # 08-16~09-05 KST 실측(SELECT만). 아래 각 룰 주석의 SOFT/HARD는 그 문서와 동기화된 수치다.
  - orgId: 1
    name: hypenow-collection
    folder: 운영
    interval: 1h
    rules:
      # (a)-1 raw_profile 일별 전체 건수 회귀. 08-26 이후 안정 구간 실측 2,647~5,222(스파이크 제외
      # 2,647~3,905), 09-03 KST 31건으로 붕괴. SOFT 1500(중앙값 절반이 안정구간 하한 밑으로
      # 떨어지는 지점) / HARD 500(어떤 소스 조합으로도 정상 운영에서 나올 수 없는 값 — 사고 당일 실측
      # 31·76의 중간). 08-19·08-22에 반복되던 옛 저조 패턴(~580~600, 08-25 이전에만 존재, 백테스트
      # 문서 §1 참조)은 08-20~09-01 오탐 점검 창에 08-22가 걸리지만 이후 재발이 없어 그대로 둔다 —
      # 오히려 당시엔 알람이 없어서 놓친 이상치였다는 뜻이라 하한을 더 낮추지 않았다.
      - uid: collection-raw-profile-daily
        title: "raw_profile 일별 수집량 회귀"
        condition: F
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          kind: daily
        annotations:
          summary: "raw_profile(crawler): 어제 {{ $values.C }}건, 최근 7일 중앙값 {{ $values.D }}건. 기준: 중앙값 50% 미만 또는 절대 하한 500건. 확인: 인스타 프로필 API 401(로그아웃 게이트) 여부, crawl_run COLLECT 성공 건수 룰과 함께 볼 것."
        data:
          - refId: A
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: hypenow-crawler-pg
            model:
              refId: A
              format: table
              rawSql: |-
                SELECT count(*) AS value FROM raw_profile
                WHERE (captured_at AT TIME ZONE 'Asia/Seoul')::date = (now() AT TIME ZONE 'Asia/Seoul')::date - 1
          - refId: B
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: hypenow-crawler-pg
            model:
              refId: B
              format: table
              rawSql: |-
                SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY v) AS value FROM (
                  SELECT COALESCE(cnt, 0) AS v FROM generate_series(
                    (now() AT TIME ZONE 'Asia/Seoul')::date - 8,
                    (now() AT TIME ZONE 'Asia/Seoul')::date - 2,
                    interval '1 day'
                  ) AS d
                  LEFT JOIN (
                    SELECT (captured_at AT TIME ZONE 'Asia/Seoul')::date AS day, count(*) AS cnt
                    FROM raw_profile WHERE captured_at >= now() - interval '10 days' GROUP BY 1
                  ) x ON x.day = d
                ) s
          - refId: C
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: reduce
              expression: A
              reducer: last
          - refId: D
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: D
              type: reduce
              expression: B
              reducer: last
          - refId: E
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: E
              type: math
              expression: "($C < $D * 0.5 && $C < 1500) || $C < 500"
          - refId: F
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: F
              type: threshold
              expression: E
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # (a)-2 REELS 성공 런수 회귀. 사고 기간(09-02~09-03 KST) 동안 REELS는 2,499~2,994로 영향
      # 없었다(프로필 401은 COLLECT job만 때렸다) — 그래도 REELS 자체 장애 감지용으로 둔다. 08-26
      # 이후 안정 2,494~3,395. 08-18~08-24에 있던 옛 저조 패턴(~700~730, raw_profile과 같은 시기·
      # 같은 원인 추정)은 08-25 이후 재발 없음 — HARD를 그 대역(700대) 위에 두지 않고 800으로 잡아
      # 재발 시에는 여전히 잡히게 했다.
      - uid: collection-reels-runs-daily
        title: "crawl_run REELS 성공 런수 회귀"
        condition: F
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          kind: daily
        annotations:
          summary: "REELS 성공 런(crawler): 어제 {{ $values.C }}건, 최근 7일 중앙값 {{ $values.D }}건. 기준: 중앙값 50% 미만 또는 절대 하한 800건. 확인: crawl_run WHERE job='REELS' 최근 상태."
        data:
          - refId: A
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: hypenow-crawler-pg
            model:
              refId: A
              format: table
              rawSql: |-
                SELECT count(*) AS value FROM crawl_run
                WHERE job = 'REELS' AND status = 'SUCCEEDED'
                  AND (started_at AT TIME ZONE 'Asia/Seoul')::date = (now() AT TIME ZONE 'Asia/Seoul')::date - 1
          - refId: B
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: hypenow-crawler-pg
            model:
              refId: B
              format: table
              rawSql: |-
                SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY v) AS value FROM (
                  SELECT COALESCE(cnt, 0) AS v FROM generate_series(
                    (now() AT TIME ZONE 'Asia/Seoul')::date - 8,
                    (now() AT TIME ZONE 'Asia/Seoul')::date - 2,
                    interval '1 day'
                  ) AS d
                  LEFT JOIN (
                    SELECT (started_at AT TIME ZONE 'Asia/Seoul')::date AS day, count(*) AS cnt
                    FROM crawl_run WHERE job = 'REELS' AND status = 'SUCCEEDED'
                      AND started_at >= now() - interval '10 days' GROUP BY 1
                  ) x ON x.day = d
                ) s
          - refId: C
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: reduce
              expression: A
              reducer: last
          - refId: D
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: D
              type: reduce
              expression: B
              reducer: last
          - refId: E
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: E
              type: math
              expression: "($C < $D * 0.5 && $C < 1500) || $C < 800"
          - refId: F
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: F
              type: threshold
              expression: E
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # (a)-3 COLLECT 성공 런수 회귀 — 09-02~09-04 사고를 정확히 잡는 룰(09-03 KST 41건, 정상
      # 2,819~4,357). raw_profile-daily와 사실상 같은 신호라 둘 다 살려둔다(하나는 crawl_run 관점,
      # 하나는 raw_profile 적재 관점 — 원인 진단 시 어느 단계에서 끊겼는지 교차 확인용).
      - uid: collection-collect-runs-daily
        title: "crawl_run COLLECT 성공 런수 회귀"
        condition: F
        for: 0m
