      # (a)-6 브랜드 태그 게시물 "보강"(enriched_at) 일별 건수 회귀 — first_seen보다도 더 변동이
      # 크다(운영 실측 3~13,943). SOFT 30/HARD 10으로 아주 낮게 잡았다 — 08-23 실측 3건은 이 기준으로도
      # 걸리는데(그날 median 787 대비 3건은 명백히 이상), 그 시점엔 보강 대상 백로그가 실제로 없었을
      # 가능성도 있어 완전히 배제하지 못했다(백테스트 문서 §6 참조). 그래도 절대치 자체가 10 미만인
      # 날은 파이프라인이 죽었다고 보는 게 안전해 HARD는 낮게 유지했다.
      - uid: collection-brand-tagged-enrich-daily
        title: "브랜드 태그 게시물 보강 일별 건수 회귀"
        condition: F
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          kind: daily
        annotations:
          summary: "태그 보강(monitoring): 어제 {{ $values.C }}건, 최근 7일 중앙값 {{ $values.D }}건. 기준: 중앙값 50% 미만(SOFT 30) 또는 절대 하한 10건. 변동이 매우 커서 절대 하한 위주로 본다. 확인: brand_tagged_post 보강(enrich) 크론 상태 - 백로그 없어 정상적으로 낮을 수도 있음."
        data:
          - refId: A
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: hypenow-monitoring-pg
            model:
              refId: A
              format: table
              rawSql: |-
                SELECT count(*) AS value FROM brand_tagged_post
                WHERE (enriched_at AT TIME ZONE 'Asia/Seoul')::date = (now() AT TIME ZONE 'Asia/Seoul')::date - 1
          - refId: B
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: hypenow-monitoring-pg
            model:
              refId: B
              format: table
              rawSql: |-
                SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY v) AS value FROM (
                  SELECT COALESCE(cnt, 0) AS v FROM generate_series(
                    (now() AT TIME ZONE 'Asia/Seoul')::date - 8,
                    (now() AT TIME ZONE 'Asia/Seoul')::date - 2,
                    interval '1 day'
                  ) AS d
                  LEFT JOIN (
                    SELECT (enriched_at AT TIME ZONE 'Asia/Seoul')::date AS day, count(*) AS cnt
                    FROM brand_tagged_post WHERE enriched_at >= now() - interval '10 days' GROUP BY 1
                  ) x ON x.day = d
                ) s
          - refId: C
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: reduce
              expression: A
              reducer: last
          - refId: D
            relativeTimeRange: { from: 864000, to: 0 }
