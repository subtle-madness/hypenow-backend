      # (a)-5 브랜드 태그 게시물 "발견"(first_seen_at) 일별 건수 회귀 — 브랜드 등록 폭증에 따라
      # 상향 변동이 극심하다(운영 실측 54~18,198). 09-02~09-04 사고 기간엔 오히려 증가(1,787→9,713→
      # 9,122) — 태그 발견 파이프라인은 무관했다는 뜻. SOFT/HARD를 백테스트로 낮게 잡아(150/50)
      # "거의 0에 가까운 붕괴"만 잡는 절대 하한 위주 가드로 설계 — 등록량 기반 자연 변동(352~1,847
      # 대) 오탐 없음을 08-16~09-04 KST 전 구간에서 확인.
      - uid: collection-brand-tagged-discovery-daily
