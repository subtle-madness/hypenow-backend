                    params: [0]

      # (a)-4 Hiker 콜(raw.fetch_payload) 일 합계 회귀 — 등록 폭증·백필로 변동이 극심하다(운영
      # 실측 534~29,710, 최대/최소 비율 약 55배). 스펙 제안 SOFT 2000은 백테스트에서 08-22(1,490건,
      # 당시 중앙값 3,200의 47% — 정상적인 등록 저조일)에 오탐이 나 SOFT를 1000으로 낮췄다(HARD는
      # 그대로 500). 09-02~09-04 사고 기간엔 오히려 이 지표가 올라갔다(hiker 폴백 증가) — 이
      # 룰만으로는 그 사고를 못 잡는다, raw_profile·COLLECT 룰이 주 감지선이고 이건 hiker 콜 자체가
      # 끊기는 별개 장애(과금 소진, 키 폐기, 네트워크) 전용 가드다.
      - uid: collection-hiker-calls-daily
        title: "Hiker 콜(raw.fetch_payload) 일 합계 회귀"
        condition: F
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          kind: daily
        annotations:
          summary: "Hiker 콜(monitoring): 어제 {{ $values.C }}건, 최근 7일 중앙값 {{ $values.D }}건. 기준: 중앙값 50% 미만(SOFT 1000) 또는 절대 하한 500건. 변동이 큰 지표라 절대 하한 위주로 본다. 확인: Hiker 잔액/키 상태, 벤더 API 응답."
        data:
          - refId: A
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: hypenow-monitoring-pg
            model:
              refId: A
              format: table
              rawSql: |-
                SELECT count(*) AS value FROM raw.fetch_payload
                WHERE (fetched_at AT TIME ZONE 'Asia/Seoul')::date = (now() AT TIME ZONE 'Asia/Seoul')::date - 1
          - refId: B
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: hypenow-monitoring-pg
            model:
              refId: B
              format: table
              rawSql: |-
                SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY v) AS value FROM (
                  SELECT COALESCE(cnt, 0) AS v FROM generate_series(
                    (now() AT TIME ZONE 'Asia/Seoul')::date - 8,
                    (now() AT TIME ZONE 'Asia/Seoul')::date - 2,
                    interval '1 day'
                  ) AS d
                  LEFT JOIN (
                    SELECT (fetched_at AT TIME ZONE 'Asia/Seoul')::date AS day, count(*) AS cnt
                    FROM raw.fetch_payload WHERE fetched_at >= now() - interval '10 days' GROUP BY 1
                  ) x ON x.day = d
                ) s
          - refId: C
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: reduce
              expression: A
              reducer: last
          - refId: D
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: D
              type: reduce
              expression: B
              reducer: last
          - refId: E
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: E
              type: math
              expression: "($C < $D * 0.5 && $C < 1000) || $C < 500"
          - refId: F
