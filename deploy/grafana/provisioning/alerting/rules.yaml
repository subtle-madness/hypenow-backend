                    params: [0]

  # 빠른 반응 그룹(10분 주기) — self 백엔드 건강도·잔액 신선도. self는 09-05 현재 IG 하이브리드
  # Phase1에서 보류 중이라 아래 self 관련 두 룰은 볼륨 게이트(>30) 덕에 self가 꺼져 있는 동안은
  # 조용하다(분모가 게이트 미만이면 E가 애초에 평가 안 됨) — collection-self-sweep-daily(느린 그룹,
  # 절대 하한 방식)와 설계가 다른 이유가 이거다.
  - orgId: 1
    name: hypenow-collection-fast
    folder: 운영
    interval: 10m
    rules:
      # (c) self 성공률 30분 — self 실패는 backend="hiker",outcome="fallback:*"로 찍힌다(self
      # 라벨엔 ok·partial만 존재, CONTEXT 확인됨) → 분모를 self 전체 + hiker fallback으로 잡아야
      # "self로 시도했다가 실패해 hiker로 넘어간" 것까지 분모에 포함된다. or vector(0)으로 0/0을
