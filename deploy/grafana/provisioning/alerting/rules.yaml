              format: table
              rawSql: |-
                SELECT count(*) AS value FROM brand_tagged_post
                WHERE (first_seen_at AT TIME ZONE 'Asia/Seoul')::date = (now() AT TIME ZONE 'Asia/Seoul')::date - 1
          - refId: B
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: hypenow-monitoring-pg
            model:
              refId: B
              format: table
              rawSql: |-
                SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY v) AS value FROM (
                  SELECT COALESCE(cnt, 0) AS v FROM generate_series(
                    (now() AT TIME ZONE 'Asia/Seoul')::date - 8,
                    (now() AT TIME ZONE 'Asia/Seoul')::date - 2,
                    interval '1 day'
                  ) AS d
                  LEFT JOIN (
                    SELECT (first_seen_at AT TIME ZONE 'Asia/Seoul')::date AS day, count(*) AS cnt
                    FROM brand_tagged_post WHERE first_seen_at >= now() - interval '10 days' GROUP BY 1
                  ) x ON x.day = d
                ) s
          - refId: C
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: reduce
              expression: A
              reducer: last
          - refId: D
            relativeTimeRange: { from: 864000, to: 0 }
