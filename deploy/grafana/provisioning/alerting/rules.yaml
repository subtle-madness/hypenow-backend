      # (a)-7 self 경로 스윕(fetchPost/fetchComments) 26시간 누적 건수 회귀 — 17:00 UTC 스윕 1회를
      # 창에 온전히 담기 위해 26h(스윕 소요 최대 55분 + 여유). B는 SQL처럼 결측일 0 채움이 안 되는
      # PromQL 특성상 최근 7일 평균으로 근사(increase(...[7d])/7). ⚠️ self는 09-05 현재 IG 하이브리드
      # Phase1 트랙에서 feed/user 401로 확장이 보류돼 있어(memory: "self 확장 보류") self 트래픽이
      # 실질 0에 가깝다 — 그래서 E에 기준선 게이트 `$D >= HARD`를 앞세운다: 직전 7일 평균이 HARD
      # 미만이면(self가 애초에 꺼져 있던 주) 침묵하고, self가 돌다가 끊긴 경우에만 운다(09-05 dev
      # 실측: 게이트 없이는 Prometheus 무데이터에서 `or vector(0)` 때문에 상시 fire). 부작용: self가
      # 일주일 넘게 죽어 있으면 이 룰도 조용해진다 — 그 상태는 hiker 폴백 비율(대시보드)로 본다. 리텐션 30d지만
      # instagram_source_route_total{backend="self"} 라벨 조합 자체가 09-03 UTC 이전으로는 조회되지
      # 않아(백테스트 문서 §7) 사고 당일 소급 검증은 못 했다 — SOFT/HARD는 CONTEXT 실측(self ok
      # 24h~15,324, self 활성 시점 기준)의 절반/오분의 일 근사치.
      - uid: collection-self-sweep-daily
        title: "self 스윕(fetchPost/fetchComments) 26h 누적 회귀"
        condition: F
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          kind: daily
        annotations:
          summary: "self 스윕(prometheus): 최근 26h {{ $values.C }}건, 최근 7일 평균 {{ $values.D }}건. 기준: 평균 50% 미만(SOFT 8000) 또는 절대 하한 3000건(직전 7일 평균이 3000 이상일 때만 판정). 확인: monitoring 로그의 self 라우트 오류, hiker 폴백 비율 패널."
        data:
          - refId: A
            relativeTimeRange: { from: 93600, to: 0 }
            datasourceUid: hypenow-prometheus
            model:
              refId: A
              editorMode: code
              expr: 'sum(increase(instagram_source_route_total{backend="self",outcome="ok",path=~"fetchPost|fetchComments"}[26h])) or vector(0)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 604800, to: 0 }
            datasourceUid: hypenow-prometheus
            model:
              refId: B
              editorMode: code
              expr: '(sum(increase(instagram_source_route_total{backend="self",outcome="ok",path=~"fetchPost|fetchComments"}[7d])) or vector(0)) / 7'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange: { from: 93600, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: reduce
              expression: A
              reducer: last
