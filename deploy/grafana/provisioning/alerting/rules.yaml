      # (e) 좋아요 NULL 비율(likes_hidden 제외) 일별 회귀 — 스펙 제안 절대 하한 0.3(30%)은 백테스트
      # 실측과 안 맞는다: 08-16~09-02 KST는 전부 0~0.5%대(사실상 0)였고, 사고 여파로 09-03 2.5%→
      # 09-04 5.9%까지 오른 게 관측된 최댓값이다(백테스트 문서 §9) — 30%는 이 지표로는 사실상 영원히
      # 안 울리는 죽은 임계값이라 0.02(2%)로 낮췄다. 그 결과 09-03(2.54%)부터 바로 잡히고, 08-30~
      # 09-02 정상구간(0.14~0.53%)에는 오탐이 없다.
      - uid: quality-brand-post-likes-null-daily
        title: "브랜드 게시물 좋아요 NULL 비율 회귀"
        condition: F
        for: 0m
        noDataState: OK
        execErrState: Error
