          severity: warning
          kind: daily
        annotations:
          summary: "태그 발견(monitoring): 어제 {{ $values.C }}건, 최근 7일 중앙값 {{ $values.D }}건. 기준: 중앙값 50% 미만(SOFT 150) 또는 절대 하한 50건. 등록량에 따라 변동이 커서 절대 하한 위주로 본다. 확인: brand_tagged_post 태그 감지 파이프라인, 크론 상태."
        data:
          - refId: A
            relativeTimeRange: { from: 864000, to: 0 }
            datasourceUid: hypenow-monitoring-pg
