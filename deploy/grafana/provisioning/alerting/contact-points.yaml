# 디스코드 웹훅 재사용 — ons-relay(compose.yaml)가 이미 같은 DISCORD_WEBHOOK_URL로 OCI 알람을
# 디스코드에 릴레이하고 있다(README §9). Grafana는 discord 컨택포인트 타입을 내장 지원해
# 릴레이를 한 번 더 거칠 필요 없이 웹훅에 직접 보낸다.
# $__env{} 치환은 compose.yaml의 grafana 서비스 environment에 DISCORD_WEBHOOK_URL이 있어야 동작.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord-ops
    receivers:
      - uid: discord-ops-webhook
        type: discord
        settings:
          url: $__env{DISCORD_WEBHOOK_URL}
          use_discord_username: false
        disableResolveMessage: false
