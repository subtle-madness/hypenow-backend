# analysis DB(app 스키마) 읽기 전용 데이터소스 — 롤 grafana_reader는 Flyway가 아닌 수동 런북으로
# 생성한다(README §14 — was_reader·alarm_reader와 같은 관례, CREATE ROLE은 앱 Flyway 권한 밖).
# 내부 도커 네트워크(prod)로만 통신 — 다른 서비스(analytics·crawler·was)의 JDBC URL도 SSL 파라미터가
# 없어 postgres 컨테이너가 SSL을 켜지 않은 상태(sslmode: disable)에 맞춘다.
apiVersion: 1

datasources:
  - name: HypeNow analysis (app 스키마, 읽기 전용)
    uid: hypenow-analysis-pg
    type: postgres
    access: proxy
    url: postgres:5432
    database: analysis
    user: grafana_reader
    isDefault: true
    editable: false
    jsonData:
      # ⚠️ 최상위 `database:`(위)만으로는 대시보드 패널이 동작하지 않는다 — Grafana 13의 Postgres
      # 플러그인은 프론트엔드에서 jsonData.database를 읽는다. 08-02 운영 실측: 최상위에만 두면
      # 백엔드로 도는 알림 규칙은 정상 동작하는데(grafana_reader 세션이 실제로 쿼리하는 것을
      # pg_stat_activity로 확인) 브라우저가 그리는 패널만 전부 No data가 되고 콘솔에
      # "You do not currently have a default database configured for this data source"가 찍힌다.
      # 최상위 database는 하위 호환용으로 남겨 둔다(백엔드 경로가 그걸 쓴다).
      database: analysis
      sslmode: disable
      postgresVersion: 1700 # postgres:17-alpine과 동일
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: $__env{GRAFANA_READER_PASSWORD}
