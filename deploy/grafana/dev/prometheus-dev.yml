global: { scrape_interval: 30s }
scrape_configs:
  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]
  # was JVM 패널 개발 시 로컬 bootRun( :was:bootRun )을 붙일 때만 유효 — 없어도 무해(down 표시)
  - job_name: was
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:9081"] }]
  # monitoring도 같은 패턴 — :monitoring:bootRun을 관리 포트 9083으로 띄울 때만 유효(README 참조)
  - job_name: monitoring
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:9083"] }]
