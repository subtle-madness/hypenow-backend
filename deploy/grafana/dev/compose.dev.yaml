# 그라파나 대시보드 개발용 로컬 하니스 — 운영과 같은 이미지·uid, 데이터만 목.
# 기동: docker compose -f compose.dev.yaml up -d  /  정리: down -v
name: grafana-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: analysis
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      # monitoring DB 생성(analysis는 POSTGRES_DB가 만든다). 운영 db/init은 crawler·monitoring 롤을
      # 전제해서 하니스에선 초기화가 깨진다 — initdb/01 주석 참조.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d analysis"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:13.1.1        # 운영과 동일 버전 고정
    ports: ["127.0.0.1:3300:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # 익명 뷰어 — 로컬 하니스 전용 편의(브라우저 리뷰 시 로그인 생략). 운영 compose엔 없음.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      # 대시보드 provider는 운영 파일 그대로 → 레포 JSON 수정이 60초 내 로컬 그라파나에 반영
      - ../provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # 데이터소스만 dev 것으로 대체(같은 uid, 접속만 로컬) — 운영 datasources·alerting은 마운트하지 않음
      - ./datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.4.0        # 운영과 동일 버전 고정(deploy/compose.yaml)
    volumes:
      - ./prometheus-dev.yml:/etc/prometheus/prometheus.yml:ro

  node-exporter:
    image: prom/node-exporter:v1.8.2

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      # 컨테이너별 시계열에 필요(운영 Task 9와 동일 마운트) — 없으면 cAdvisor가 read-write 레이어를
      # 못 찾아 container_* 메트릭이 통째로 비었다. macOS 한계는 README "운영과 다른 점" 참조.
      - /var/lib/docker:/var/lib/docker:ro
