# 프로젝트명 고정: 폴더명(hypenow-backend)이 바뀌어도 기존 컨테이너·볼륨(데이터) 유지
name: hypenow-crawler

services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      POSTGRES_DB: crawler
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler
    ports:
      - '5433:5432'
    volumes:
      - celfit-crawler-pg:/var/lib/postgresql/data

volumes:
  celfit-crawler-pg:
