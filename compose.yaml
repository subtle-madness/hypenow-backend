# 프로젝트명 고정: 폴더명(hypenow-backend)이 바뀌어도 기존 컨테이너·볼륨(데이터) 유지
name: hypenow-crawler

services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - celfit-crawler-pg:/var/lib/postgresql/data
      # analysis DB 자동 생성용 init 스크립트. Postgres는 데이터 디렉터리가 "처음"
      # 초기화될 때만 docker-entrypoint-initdb.d를 실행하므로, 이미 존재하는
      # celfit-crawler-pg 볼륨에는 적용되지 않음. 실 서버의 analysis DB는
      # task 1에서 수동으로 생성했음 — 이 마운트는 새로 셋업하는 환경을 위한 것.
      - ./db/init:/docker-entrypoint-initdb.d

  # was 조회 캐시 — 데이터 휘발 OK(재시작=콜드 캐시), 볼륨 없음
  redis:
    image: 'redis:7-alpine'
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - '6379:6379'

volumes:
  celfit-crawler-pg:
