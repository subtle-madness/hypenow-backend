plugins {
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
}

// 캐시 prefix용 빌드 정보(META-INF/build-info.properties) — 배포마다 캐시 네임스페이스가 바뀌어 구 스키마 페이로드를 안 읽는다
springBoot {
	buildInfo()
}

// build.time은 매 빌드 바뀌는 값이라 test 태스크의 입력 해시를 오염시켜 빌드 캐시가
// 영구 미스였다(08-05 실측: clean 후 재실행에서 test 재실행). 캐시 지문 계산에서만 무시 —
// 런타임에 읽는 값(위 캐시 prefix 용도)은 그대로 구워진다.
normalization {
	runtimeClasspath {
		properties('META-INF/build-info.properties') {
			ignoreProperty 'build.time'
		}
	}
}

dependencies {
	implementation project(':contract-analysis')
	// AI 어시스턴트 LLM 전송(2026-08-27 설계 §3) - Vertex HTTP·SA 토큰·재시도만 재사용한다.
	// 프롬프트·툴 정의·에이전트 루프는 was 소관이라 common-llm에 반입하지 않는다(monitoring과 동일 원칙).
	implementation project(':common-llm')
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// API 성능 측정(스펙 2026-08-10) — /actuator/prometheus로 uri별 레이턴시 히스토그램 노출
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	// 느린 요청 단계 분해(2026-08-27) — *Repository 빈 자동 타이밍(RepositoryTimingAspect).
	// Boot 4는 starter-aop가 없다(스타터 재편) — aspectjweaver가 클래스패스에 있으면 AOP 자동구성이 켜진다.
	implementation 'org.aspectj:aspectjweaver'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// Boot 4는 자동구성이 모듈로 분리 — spring-session-jdbc 단독으론 자동구성이 없어 starter를 쓴다
	implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
	// 조회 캐시(Redis) — 세션은 JDBC 유지(2026-07-28 결정: Redis는 순수 캐시 전용, specs/2026-07-28-redis-caching-design.md)
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.flywaydb:flyway-core'
	// /v1 표면 자동 문서화(보조 문서 — 정본은 프론트 API 스펙). prod에서는 비활성(application-prod.yml)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	// OCI Vault KMS — PII DEK 언래핑(트랙 A). local 모드에선 로드만 되고 미사용.
	// 두 아티팩트는 OCI SDK 릴리스에서 항상 같은 버전으로 짝지어 나온다(2026-09-03 Maven Central 확인).
	implementation 'com.oracle.oci.sdk:oci-java-sdk-keymanagement:3.95.1'
	implementation 'com.oracle.oci.sdk:oci-java-sdk-common-httpclient-jersey3:3.95.1'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// bootJar만 산출 — Dockerfile의 COPY build/libs/*.jar 가 단일 파일을 보장
tasks.named('jar') {
	enabled = false
}
