# 운영(오라클) 프로파일 — 값은 deploy/compose.yaml이 환경변수로 주입한다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
server:
  # 롤링 배포(deploy/scripts/rollout.sh) 전제 — SIGTERM에 신규 수신을 막고 진행 중 요청을
  # 드레인(기본 30s)한다. Boot 3.4+ 기본값이지만 배포 무중단의 전제 조건이라 명시 고정.
  shutdown: graceful
  # caddy 뒤에서 X-Forwarded-* 를 신뢰 — Secure 쿠키·scheme 판정 + 클라이언트 IP 복원.
  # remoteAddr 복원은 레이트리밋 키(IP별 버킷)의 전제 — 깨지면 전 사용자가 Caddy IP 버킷 하나를
  # 공유한다. ProdForwardedHeadersTest가 회귀 가드. 스푸핑은 Caddy(2.5+)가 외부 유입
  # X-Forwarded-For를 버리고 실측 IP로 재설정해 방어.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax    # 스펙 확정(2026-07-17) — www↔api는 hypenow.io 하위 same-site라 Lax로 충분, CSRF 방어 이중화
# Swagger는 운영에도 노출(07-19 결정, 07-17 미노출 결정 대체) — 접근은 admin 게이트(SecurityConfig 스웨거 체인)가 통제
was:
  cors:
    allowed-origins: https://www.hypenow.io   # 운영 프론트 오리진만 — dev 오리진은 기본 프로파일에
