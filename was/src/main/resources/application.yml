spring:
  application:
    name: was
  datasource:
    url: jdbc:postgresql://localhost:5433/analysis
    username: crawler
    password: crawler
    driver-class-name: org.postgresql.Driver
    hikari:
      # 명시적으로 10 유지 — 상향은 개선이 아니라 악화(07-30 풀 고갈 사건 실측). 운영 호스트는 CPU
      # 2코어뿐이고 병목은 CPU 바운드 분석 쿼리(Seq Scan)라, 풀을 20으로 올려도 20개 쿼리가 2코어를
      # 다투게 될 뿐 처리량이 늘지 않는다(오히려 컨텍스트 스위칭으로 악화 가능). 진짜 방어는
      # ConcurrencyLimiter(벌크헤드)로 진입 자체를 제한하는 것 — was.concurrency-limit.* 참고.
      maximum-pool-size: 10
      # 기본 30초는 풀이 마르면 톰캣 스레드를 30초씩 묶어 장애를 길게 만든다(07-30: 66초 500).
      # 5초로 단축해 빠르게 실패시킨다 — 정상 시 획득은 1ms 미만이라 부작용 없음.
      connection-timeout: 5000
      # 향후 릭 진단용 — 이번 07-30 건은 릭이 아니라 CPU 바운드 지연이었지만, 다음에 진짜 릭이면
      # 20초 이상 보유된 커넥션이 로그로 바로 드러난다.
      leak-detection-threshold: 20000
  session:
    jdbc:
      initialize-schema: never          # DDL은 Flyway(app 스키마)가 소유 — V2__spring_session.sql
      table-name: app.spring_session
    timeout: 30d                        # 비활동 30일 = 슬라이딩 만료 (스펙 4절)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms            # 명령 타임아웃 — 장애 시 지연 전파 상한(fail-open 전제, 스펙 §7)
      connect-timeout: 500ms
  servlet:
    multipart:
      max-file-size: 2MB                # 컨테이너 컷은 여유 — 1MB 정본 검증은 ProfileImageStore(스펙 6.13)
      max-request-size: 3MB
# 요청 ID 출력(RequestIdFilter → MDC requestId, 2026-08-23 요청 단위 로그 묶기) — Boot 기본
# 콘솔 패턴의 correlation 슬롯([스레드명] 뒤·로거명 앞)에 끼워 넣으므로 타임스탬프(1번 토큰)·
# 레벨(2번 토큰) 위치가 변하지 않는다. 운영 Alloy(deploy/alloy/config.alloy)가 이 위치로 level
# 라벨을 파싱하니(^\S+\s+(LEVEL)\s) logging.pattern.console을 직접 덮어쓰지 말 것 — 깨지면
# level 라벨이 사라져 {level="ERROR"} 대시보드·알람이 침묵한다. 요청 밖 로그(스케줄 잡·부팅)는
# 빈 대괄호([])로 찍힌다. 내부 호출 전파는 RequestIdPropagatingInterceptor 참조.
logging:
  pattern:
    correlation: "[%X{requestId:-}] "

server:
  port: 8081
  # 성과 대시보드 /contents는 유저에 따라 수십 MB JSON(전량 반환 설계)이고 FE는 브라우저에서
  # api.hypenow.io를 직접 호출한다(CORS 구도 — 중간에 압축해 주는 프록시가 없다). Caddy에도
  # encode가 없어 톰캣에서 압축하는 것이 유일한 지점이다(08-12 실측: 압축 전무 확인).
  compression:
    enabled: true
    mime-types: application/json
  servlet:
    session:
      cookie:
        name: hypenow-session           # 스펙 4절 — 프론트 현재 동작과 일치
        http-only: true
        same-site: lax                  # Vercel rewrite 동일 오리진 구도 — Domain 불필요
        max-age: 30d                    # 영속 쿠키
        path: /
# UI는 /swagger-ui, 스키마는 /v3/api-docs
springdoc:
  paths-to-match: /v*/**, /admin/**   # 버전 표면 전체(v1·v2·미래 v3…) + 어드민 API(07-22) — 구 /api·내부 페이지(postdemo 등)는 제외. 열거식은 /v2 신설(07-27) 때 누락된 전례가 있어 와일드카드로 일반화(07-30)
  swagger-ui:
    path: /swagger-ui                 # 베이스 URL을 진입 리다이렉트로 매핑 — 기본값(/swagger-ui.html)만 있으면
                                      # /swagger-ui가 매핑 없는 404(Whitelabel)로 떨어진다. 시큐리티 매처
                                      # (/swagger-ui/**)가 이 경로를 이미 덮으므로 SecurityConfig 변경은 불필요.
    csrf:
      enabled: true                   # try-it-out에 XSRF-TOKEN 쿠키를 헤더로 동봉 — /v1/auth/login 호출 후
                                      # 세션 쿠키(동일 오리진)로 잠긴 엔드포인트도 Swagger에서 테스트 가능
codes:
  api-key: ${CODES_API_KEY:}   # 어드민 코드 적재용 정적 토큰 — 빈 값이면 /admin/signup-codes 전면 거부(fail-closed)
was:
  mail:
    resend-api-key: ${RESEND_API_KEY:}    # 빈 값 → LoggingMailSender(발송 대신 로그 — 로컬·테스트)
    from: "hypenow <no-reply@hypenow.io>" # Resend 도메인 인증(hypenow.io SPF/DKIM) 필요 — 운영 체크리스트
    admin-only: ${WAS_MAIL_ADMIN_ONLY:false}  # true면 ADMIN role 수신자만 실발송(test 전용 — 실사용자 오발송 방지)
  cors:
    allowed-origins: http://localhost:3000,https://celfit-front.vercel.app
  profile-image:
    dir: ./data/profile-images          # 프로필 이미지 저장 디렉토리 — /profile-images/** 로 정적 서빙
# API 성능 측정(스펙 2026-08-10) — 노출은 health·prometheus만. 운영은 application-prod.yml이
# 관리 포트를 9081로 분리해 내부망 전용(Caddy 라우팅 없음), 로컬·테스트는 메인 포트에 그대로 노출.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true   # uri별 p95/p99를 Prometheus 쪽에서 histogram_quantile로 산출
      maximum-expected-value:
        # 기본 상한 30s에서는 그 이상 걸린 요청이 전부 30s 버킷으로 포화된다 — 08-25 posts
        # 서빙 장애(실측 96s)가 대시보드에 30s로 눌려 보인 원인. 실값 상한 확장.
        http.server.requests: 120s
monitoring:
  enabled: false   # true면 monitoring.datasource.*(읽기 전용 계정) 필수, monitoring.api.base-url은 기본값 http://monitoring:8083(계약 §1) — 계약: docs/contracts/monitoring-was-contract.md
  digest:
    weekly-cron: "0 0 9 * * MON"                       # 주간 다이제스트 정시 실행(KST) — 지난주(월~일)를 집계
    weekly-catchup-cron: "0 10,20,30,40,50 9-23 * * *"   # 같은 창 재계산 따라잡기(요일 제한 없음 — 08-28
                       # 품질 리뷰 C1: was가 월요일 내내 죽어 있다가 다른 요일에 되살아나도 지난주를
                       # 복구해야 한다. 멱등 upsert라 매일 재계산해도 안전) + 메일 재시도 창
  brand:
    ad-disclosure:
      expose: ${AD_DISCLOSURE_EXPOSE:false}   # 광고 표기 판정 was 노출 토글(스펙 §10-3) — true 전환이
                       # 곧 FE 노출 개통이다. 08-19 운영·test는 compose env로 true(사용자 결정 —
                       # FE가 표기 점검 UI를 선배포해 개통이 곧 장애 해소였음. 골드셋 오탐률 측정은
                       # 개통 후 후속으로 유지). 기본값은 false 유지 — 끄면 즉시 중립값 강제(킬 스위치).
                       # 이 키는 was 전용(노출 토글)이다 — monitoring 모듈 application.yml의
                       # 같은 이름 하위 경로(monitoring.brand.ad-disclosure.judge-model·concurrency,
                       # Tier2 LLM 풀 설정)와는 모듈도 뜻도 다른 별개 키다. grep 시 혼동 주의.
